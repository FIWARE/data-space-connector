name: Test
on: [push, pull_request]

# Pinned tool versions for CI.
# - HELM_UNITTEST_VERSION: the helm-unittest plugin (keep in sync with local dev).
# - HELM_VERSION: pin Helm explicitly instead of azure/setup-helm's "latest".
#   "latest" needs a network fetch that intermittently fails ("fetch failed"),
#   and the action then falls back to an older default (v3.18.x) -> flaky CI.
#   Must be Helm 4.x: the `helm plugin install --verify` flag used below only
#   exists in Helm 4 (the signed-plugin system); Helm 3 fails with
#   "unknown flag: --verify".
env:
  HELM_UNITTEST_VERSION: "0.6.3"
  HELM_VERSION: "v4.2.2"

jobs:

  # ---------------------------------------------------------------------------
  # Helm unit tests – fast, no cluster required.  Validates the template
  # rendering logic (tracing toggles, env-var injection, init containers, …)
  # using the helm-unittest plugin.
  # ---------------------------------------------------------------------------
  unittest:
    runs-on: ubuntu-latest
    name: "Helm Unit Tests"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false

      - name: Run unit tests
        run: helm unittest charts/data-space-connector

      # the consent-management components (consent-manager/-facade + managed mongo)
      # live in the trust-anchor chart; their suite ships there.
      - name: Run trust-anchor unit tests
        run: helm unittest charts/trust-anchor

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: local
            profiles: "test,local-test"
          - name: central
            profiles: "test,central,central-test"
          - name: dsp
            profiles: "test,dsp,dsp-test"
          - name: consent
            profiles: "test,consent,consent-test"
          - name: eidas
            profiles: "test,eidas,eidas-test"
        # every scenario is deployed both ways: rendered with `helm template` and applied
        # with kubectl, as a GitOps tool does (the default), and installed as Helm releases
        # (`helm-install`), as `helm install` does
        deployment:
          - name: template
            profiles: ""
          - name: helm-install
            profiles: ",helm-install"
    name: "Integration Test (${{ matrix.scenario.name }}, ${{ matrix.deployment.name }})"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v1
        with:
          java-version: '17'
          java-package: jdk

      - name: Ensure br_netfilter is enabled.
        run: |
          sudo modprobe br_netfilter

      - name: Execute tests (${{ matrix.scenario.name }}, ${{ matrix.deployment.name }})
        id: test
        run: |
          mvn clean integration-test -P${{ matrix.scenario.profiles }}${{ matrix.deployment.profiles }}

      - name: Post-mortem on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/it/target/k3s.yaml
        run: |
          echo "=============================="
          echo "  CLUSTER POST-MORTEM REPORT  "
          echo "=============================="

          echo ""
          echo "### HELM RELEASES ###"
          ./it/target/helm/helm list --all-namespaces --all || true

          echo ""
          echo "### NODE STATUS ###"
          kubectl get nodes -o wide || true

          echo ""
          echo "### NODE CAPACITY & ALLOCATABLE RESOURCES ###"
          kubectl describe nodes | grep -A 10 -E "^(Name:|Capacity:|Allocatable:|Conditions:)" || true

          echo ""
          echo "### ALL PODS (all namespaces) ###"
          kubectl get pods --all-namespaces -o wide || true

          echo ""
          echo "### PODS NOT RUNNING ###"
          kubectl get pods --all-namespaces --field-selector='status.phase!=Running,status.phase!=Succeeded' -o wide || true

          echo ""
          echo "### EVENTS (sorted by time, last 100) ###"
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -100 || true

          echo ""
          echo "### EVENTS WARNING ###"
          kubectl get events --all-namespaces --field-selector=type=Warning --sort-by='.lastTimestamp' || true

          echo ""
          echo "### IMAGE PULL / BACKOFF ERRORS ###"
          kubectl get pods --all-namespaces -o json \
            | jq -r '.items[] | select(.status.containerStatuses != null) | .metadata.namespace + "/" + .metadata.name + ": " + (.status.containerStatuses[].state | to_entries[] | .key + " -> " + (.value.reason // ""))' 2>/dev/null \
            | grep -iE "backoff|imagepull|errimagepull|crashloop|oomkill" || echo "No image pull / crash errors found"

          echo ""
          echo "### DESCRIBE PODS NOT RUNNING ###"
          kubectl get pods --all-namespaces --field-selector='status.phase!=Running,status.phase!=Succeeded' -o json \
            | jq -r '.items[].metadata | .namespace + "/" + .name' \
            | while read pod; do
                ns=$(echo $pod | cut -d/ -f1)
                name=$(echo $pod | cut -d/ -f2)
                echo "--- Pod: $pod ---"
                kubectl describe pod "$name" -n "$ns" || true
                echo ""
              done

          echo ""
          echo "### LOGS OF FAILED/ERRORED PODS (last 100 lines each) ###"
          kubectl get pods --all-namespaces -o json \
            | jq -r '.items[] | select(.status.phase == "Failed" or ((.status.containerStatuses // [])[] | .state.waiting.reason // "" | test("Error|BackOff|CrashLoop"))) | .metadata.namespace + "/" + .metadata.name' \
            | while read pod; do
                ns=$(echo $pod | cut -d/ -f1)
                name=$(echo $pod | cut -d/ -f2)
                echo "--- Logs: $pod ---"
                kubectl logs "$name" -n "$ns" --all-containers --tail=100 2>&1 || true
                echo ""
              done

          echo ""
          echo "### LOGS OF THE PREVIOUS CONTAINER OF RESTARTED PODS (last 100 lines each) ###"
          kubectl get pods --all-namespaces -o json \
            | jq -r '.items[] | select(any((.status.containerStatuses // [])[]; .restartCount > 0)) | .metadata.namespace + "/" + .metadata.name' \
            | while read pod; do
                ns=$(echo $pod | cut -d/ -f1)
                name=$(echo $pod | cut -d/ -f2)
                echo "--- Previous logs: $pod ---"
                kubectl logs "$name" -n "$ns" --all-containers --previous --tail=100 2>&1 || true
                echo ""
              done

          # Every scenario reads its data through Scorpio, and a restarted broker only shows why it
          # died in the previous container; what it did with the test's requests is in the current one.
          echo ""
          echo "### LOGS OF THE CURRENT SCORPIO CONTAINERS (last 200 lines each) ###"
          kubectl get pods --all-namespaces --no-headers \
              -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name \
            | grep scorpio \
            | while read ns name; do
                echo "--- Logs: $ns/$name ---"
                kubectl logs "$name" -n "$ns" --all-containers --timestamps --tail=200 2>&1 || true
                echo ""
              done

          echo ""
          echo "### POSTGRES OPERATOR LOGS (last 300 lines) ###"
          kubectl logs -n operators -l app.kubernetes.io/name=postgres-operator --tail=300 2>&1 || true

          echo ""
          echo "### DISK & MEMORY ON RUNNER ###"
          df -h || true
          free -h || true

          echo ""
          echo "### DOCKER IMAGES PULLED ###"
          docker images || true

          echo ""
          echo "=== END OF POST-MORTEM ==="

      # DSP failures are usually races between the EDC controlplanes and their TMF storage,
      # which only show up in the logs of pods that are still running. Keep the full logs of
      # every component in that path, including the previous container of restarted pods.
      - name: Collect DSP component logs on failure
        if: failure() && matrix.scenario.name == 'dsp'
        env:
          KUBECONFIG: ${{ github.workspace }}/it/target/k3s.yaml
        run: |
          mkdir -p dsp-logs
          kubectl get pods --all-namespaces --no-headers \
              -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name \
            | grep -E 'fdsc-edc|tm-forum-api|scorpio|odrl-pap|identityhub' \
            | while read ns name; do
                kubectl logs "$name" -n "$ns" --all-containers --timestamps \
                  > "dsp-logs/$ns-$name.log" 2>&1 || true
                if ! kubectl logs "$name" -n "$ns" --all-containers --timestamps --previous \
                    > "dsp-logs/$ns-$name.previous.log" 2>/dev/null; then
                  rm -f "dsp-logs/$ns-$name.previous.log"
                fi
              done
          ls -l dsp-logs

      - name: Upload DSP component logs
        if: failure() && matrix.scenario.name == 'dsp'
        uses: actions/upload-artifact@v4
        with:
          name: dsp-logs-${{ matrix.deployment.name }}
          path: dsp-logs/
          retention-days: 14
