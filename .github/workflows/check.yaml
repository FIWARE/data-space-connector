name: Check PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

# One run per pull request: opening a pull request with a label fires two events at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: ./.github/scripts/lint.sh

  # Relative links and anchors of the Markdown documentation, see lychee.toml.
  # Runs alongside the chart checks instead of gating them.
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check documentation links
        run: ./.github/scripts/check-links.sh

  # values.schema.json is generated from values.yaml, see CLAUDE.md. A change to values.yaml that
  # is not followed by regenerating the schema fails here.
  values-schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check the values schema is up to date
        run: ./.github/scripts/values-schema.sh --check

  eval:
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.17.0'
        
      - name: Eval
        run: |
          .github/build/install.sh
          .github/scripts/eval.sh

  # Requires a semver label and bumps the version of the charts the pull request changes, see
  # https://github.com/SEAMWARE/github-workflows
  chart-version:
    needs:
      - lint
      - eval
    uses: SEAMWARE/github-workflows/.github/workflows/chart-pr.yml@v1
    permissions:
      contents: write
      pull-requests: write
