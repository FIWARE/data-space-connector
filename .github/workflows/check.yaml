name: Check PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: ./.github/scripts/lint.sh

  # Relative links and anchors of the Markdown documentation, see lychee.toml.
  # Runs alongside the chart checks instead of gating them.
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check documentation links
        run: ./.github/scripts/check-links.sh

  # values.schema.json is generated from values.yaml, see CLAUDE.md. A change to values.yaml that
  # is not followed by regenerating the schema fails here.
  values-schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check the values schema is up to date
        run: ./.github/scripts/values-schema.sh --check

  eval:
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.17.0'
        
      - name: Eval
        run: |
          .github/build/install.sh
          .github/scripts/eval.sh

  check-labels:
    runs-on: ubuntu-latest
    needs:
      - lint
      - eval

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v1
        with:
          java-version: '11'
          java-package: jdk

      - id: match-label
        name: Match semver labels
        uses: zwaldowski/match-label-action@v1
        with:
          allowed: major, minor, patch

      - uses: zwaldowski/semver-release-action@v2
        name: Semver release
        with:
          dry_run: true
          bump: ${{ steps.match-label.outputs.match }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  comment:
    runs-on: ubuntu-latest
    needs: 
      - check-labels
    if: always() && needs.check-labels.result == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3.0.0
        with:
          message: "Please apply one of the following labels to the PR: 'patch', 'minor', 'major'."
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Bumps the version of every chart the PR changes, from its version on main and the PR's
  # semver label, and pushes the result to the PR branch. It only depends on check-labels: a
  # dependency on the comment job, which is skipped when the label is present, would skip it too.
  prepare-release:
    needs: ["check-labels"]

    runs-on: ubuntu-latest

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: bump
        uses: zwaldowski/match-label-action@v4
        with:
          allowed: major,minor,patch

      - name: Get changed files
        id: changed-files
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "$BASE_SHA...$HEAD_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # prepare yaml parser
      - uses: actions/setup-go@v4
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@latest
          yq --version

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          path: current-branch

      - uses: actions/checkout@v5
        with:
          ref: 'main'
          path: main
          
      - name: Update versions
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          declare -A changedCharts

          for file in $CHANGED_FILES; do

              echo "$file was changed"
              baseFolder=$(cut -d'/' -f1 <<< "$file")
              if [ $baseFolder = "charts" ] && [ $file != "charts/README.md" ]; then
                  chartName=$(cut -d'/' -f2 <<< "$file")
                  changedCharts[$chartName]=$chartName
              fi  
          done    

          for c in "${changedCharts[@]}"; do
              if [ ! -f "main/charts/$c/Chart.yaml" ]; then
                  echo "$c is not on main yet, keeping its version"
                  continue
              fi
              # get version from chart yaml
              version=$(yq e '.version' "main/charts/$c/Chart.yaml")
              major=$(cut -d'.' -f1 <<< "$version")
              minor=$(cut -d'.' -f2 <<< "$version")
              patch=$(cut -d'.' -f3 <<< "$version")

              prType=${{ steps.bump.outputs.match }}
              echo Update version $version with type $prType
              if [ $prType = "major" ]; then 
                  echo Update major
                  major=$((major+1))
                  minor=0
                  patch=0
              elif [ $prType = "minor" ]; then
                  echo Update minor
                  minor=$((minor+1))
                  patch=0
              elif [ $prType = "patch" ]; then 
                  echo Update patch
                  patch=$((patch+1))
              fi
              echo Update version to $major.$minor.$patch for $c
              yq e -i '.version = "'$major.$minor.$patch'"' current-branch/charts/$c/Chart.yaml
          done

      - name: Commit files
        id: commit
        run: |
          cd current-branch
          if git diff --quiet; then
              echo "Chart versions are already up to date"
              exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update helm chart versions" -a
          git show --stat HEAD
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The token cannot push to a fork: its author has to set the versions.
      - name: Versions to set on a fork
        if: steps.commit.outputs.committed == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cd current-branch
          echo "::error::This pull request comes from a fork, so the chart versions cannot be updated automatically. Set them in the pull request:"
          git show HEAD -- 'charts/*/Chart.yaml'
          exit 1

      - name: Push changes
        if: steps.commit.outputs.committed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ad-m/github-push-action@master
        with:
          directory: current-branch
          branch: ${{ github.head_ref }}
