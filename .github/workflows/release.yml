name: Release

on:
  push:
    branches:
      - main

jobs:

    generate-version:
      name: "Generate version"
      runs-on: ubuntu-latest

      outputs:
        version: ${{ steps.out.outputs.version }}

      steps:
        - uses: actions/checkout@v5

        - uses: actions/setup-java@v1
          with:
            java-version: '17'
            java-package: jdk

        - id: pr
          uses: actions-ecosystem/action-get-merged-pull-request@v1.0.1
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - name: Match semver label via bash
          id: match-label-bash
          run: |
            LABELS=$(cat <<-END
            ${{ steps.pr.outputs.labels }}
            END
            )
            IFS='\n' read -ra LABEL <<< "$LABELS"
            for i in "${LABEL[@]}"; do
                echo $i
                case $i in
                    # Will just use the first occurence
                    'major'|'minor'|'patch')
                        echo "RELEASE_LABEL=$i" >> $GITHUB_OUTPUT
                        break
                esac
            done
          
        - uses: zwaldowski/semver-release-action@v2
          with:
            dry_run: true
            bump: minor
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - name: Set version output
          id: out
          run: echo "version=${VERSION}" >> $GITHUB_OUTPUT

    # Publishes the charts, failing when a changed chart has no new version, see
    # https://github.com/FIWARE/github-workflows
    chart-release:
      uses: FIWARE/github-workflows/.github/workflows/chart-release.yml@v1
      permissions:
        contents: write
      with:
        oci-registry: quay.io/fiware/helm-charts
        oci-charts: data-space-connector trust-anchor
      secrets:
        oci-username: ${{ secrets.QUAY_USERNAME }}
        oci-password: ${{ secrets.QUAY_PASSWORD }}

    git-release:
      name: "Create Git Release"
      needs: ["generate-version", "chart-release"]
      runs-on: ubuntu-latest

      steps:

        - uses: actions/checkout@v5

        - name: Generate Table of contents
          uses: technote-space/toc-generator@v4
          with:
            TARGET_PATHS: "./README.md,./doc/README.md"
            COMMIT_MESSAGE: "Update ToC"

        - uses: "marvinpinto/action-automatic-releases@latest"
          with:
            repo_token: "${{ secrets.GITHUB_TOKEN }}"
            automatic_release_tag: ${{ needs.generate-version.outputs.version }}
            prerelease: false
            title: ${{ needs.generate-version.outputs.version }}
            files: |
              LICENSE
