name: Pre-Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

# one run at a time per pull request: opening one with a label fires two events at once, and both
# would publish the same pre-release
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:

  # The version from the semver label of the pull request, X.Y.Z-PRE-<number>, read when the job
  # runs. See https://github.com/FIWARE/github-workflows
  generate-version:
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  toc:
    needs: ["generate-version"]
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Generate Table of contents
        uses: technote-space/toc-generator@v4
        with:
          TARGET_PATHS: "./README.md,./doc/README.md"
          COMMIT_MESSAGE: "Update ToC"

  git-release:
    needs: ["generate-version"]
    uses: FIWARE/github-workflows/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.generate-version.outputs.version }}
      prerelease: true

  oci-release:
    name: Publish OCI snapshot (${{ matrix.chart }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chart:
          - data-space-connector
          - trust-anchor

    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Get PR number
        id: pr_number
        run: |
          NR=$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')
          echo "nr=$NR" >> $GITHUB_OUTPUT

      - name: Compute snapshot version
        id: version
        run: |
          CHART_VERSION=$(grep '^version:' charts/${{ matrix.chart }}/Chart.yaml | awk '{print $2}')
          SNAPSHOT_VERSION="${CHART_VERSION}-${{ steps.pr_number.outputs.nr }}"
          echo "snapshot-version=$SNAPSHOT_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/^version: .*/version: ${SNAPSHOT_VERSION}/" charts/${{ matrix.chart }}/Chart.yaml

      - name: Add Helm repositories
        run: |
          helm repo add fiware https://fiware.github.io/helm-charts
          helm repo add fiware-iam https://fiware.github.io/decentralized-iam
          helm repo add mongodb https://mongodb.github.io/helm-charts
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add postgres-operator https://opensource.zalando.com/postgres-operator/charts/postgres-operator

      - name: Build dependencies
        run: helm dependency update charts/${{ matrix.chart }}

      - name: Package chart
        run: helm package charts/${{ matrix.chart }}

      - name: Login to quay.io
        run: helm registry login quay.io -u ${{ secrets.QUAY_USERNAME }} -p ${{ secrets.QUAY_PASSWORD }}

      - name: Push OCI artifact
        run: helm push ${{ matrix.chart }}-${{ steps.version.outputs.snapshot-version }}.tgz oci://quay.io/fiware/helm-charts
