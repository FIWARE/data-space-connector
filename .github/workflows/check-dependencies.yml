name: Check Chart Dependencies

on:
  workflow_dispatch:
    inputs:
      reviewers:
        description: 'GitHub usernames to request review from (comma-separated)'
        required: false
        type: string
        default: 'mortega5'
  schedule:
    - cron: '0 6 * * 3'

jobs:

  # Opens a pull request for every chart dependency with a newer stable version, see
  # https://github.com/FIWARE/github-workflows
  check-dependencies:
    uses: FIWARE/github-workflows/.github/workflows/chart-dependencies.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      reviewers: ${{ inputs.reviewers || 'mortega5' }}
