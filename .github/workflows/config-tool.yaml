name: Config tool

on:
  push:
    branches:
      - main
    paths:
      - 'config-tool/**'
      - '.github/workflows/config-tool.yaml'
  pull_request:
    paths:
      - 'config-tool/**'
      - '.github/workflows/config-tool.yaml'

permissions:
  contents: read

# Cancel superseded PR runs only; every push to main keeps its binaries and e2e signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: config-tool

# Node has no lockfile at the repository root, so the npm cache keys on the tool's own.
env:
  NODE_VERSION: "22"
  NPM_LOCKFILE: config-tool/ui/package-lock.json
  E2E_BINARY: bin/dsc-config-linux-amd64

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: config-tool/go.mod
          cache-dependency-path: config-tool/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_LOCKFILE }}

      - name: UI
        working-directory: config-tool/ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Go
        run: |
          make lint
          go test ./...

  # One job for all five targets, so CI and `make cross` share the target list and ldflags (ADR 0011).
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe in the Makefile reads the config-tool/v* tags for the version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: config-tool/go.mod
          cache-dependency-path: config-tool/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_LOCKFILE }}

      - run: make cross

      - uses: actions/upload-artifact@v4
        with:
          name: dsc-config
          path: config-tool/bin/dsc-config-*
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_LOCKFILE }}

      - uses: actions/download-artifact@v4
        with:
          name: dsc-config
          path: config-tool/bin

      - name: Playwright
        working-directory: config-tool/ui
        env:
          DSC_CONFIG_BIN: ${{ github.workspace }}/config-tool/${{ env.E2E_BINARY }}
        run: |
          # Artifacts drop the executable bit.
          chmod +x "$DSC_CONFIG_BIN"
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: config-tool/ui/playwright-report

  # Only compiles the opt-in native window, so the wails-tagged code does not rot; whether the window
  # opens is not tested here.
  window:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Webview SDK
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: config-tool/go.mod
          cache-dependency-path: config-tool/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NPM_LOCKFILE }}

      - run: make build-window
