# ---------------------------------------------------------------------------
# Consent management overlay.
#
# Layered on top of k3s/provider.yaml by the `consent` maven profile
# (`-f k3s/provider.yaml -f k3s/consent-provider.yaml`), exactly the way
# k3s/dsp-provider.yaml layers the DSP scenario. It carries the consent
# *components* and their APISIX wiring so consent is opt-in:
#   * consent-manager + consent-facade (consentManagement.*)
#   * the external Go consent-plugin runner attached to APISIX
#     (odrlAuthorization.apisix.apisix.extPlugin + the init container that
#      stages the runner binary + its shared volume)
#
# NOTE: the `mp-data-service-consent` route and its ingress host stay in
# provider.yaml (base), just like the DSP scenario's routes/hosts do. helm
# REPLACES list values, so a single route/ingress entry cannot be overlaid
# onto the shared `routes`/`ingress.hosts` lists without duplicating them.
# That route is inert until this overlay enables the plugin runner and the
# consent-manager it calls.
# ---------------------------------------------------------------------------

decentralizedIam:
  odrlAuthorization:
    apisix:
      apisix:
        # external plugin runner (consent-plugin), started by APISIX as a subprocess.
        # APISIX spawns the runner with a *fixed* environment (only PATH,
        # APISIX_LISTEN_ADDRESS, ...), so the participant client secret cannot be
        # delivered to it via the container env. Instead the launch command reads
        # it from the mounted secret file and exports it (CONSENT_CLIENT_SECRET, the
        # runner's env fallback for client_secret) before exec'ing the runner -
        # keeping the secret out of the route config (etcd). `exec` preserves the
        # pid so APISIX's runner supervision still works.
        extPlugin:
          enabled: true
          cmd:
            - /bin/sh
            - -c
            - export CONSENT_CLIENT_SECRET="$(cat /consent-secret/clientSecret)"; exec /ext-plugin/go-runner
      # consent-plugin (external Go plugin) run by APISIX as a subprocess. The
      # statically-linked runner binary is staged into a shared volume by an init
      # container from the plugin image; APISIX spawns it and manages the socket.
      extraInitContainers:
        - name: install-consent-plugin
          image: quay.io/wi_stefan/consent-plugin:0.0.1
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "cp /app/go-runner /ext-plugin/go-runner"]
          volumeMounts:
            - name: ext-plugin-bin
              mountPath: /ext-plugin
      extraVolumeMounts:
        - name: ext-plugin-bin
          mountPath: /ext-plugin
        # the participant client secret, read by the launch command above
        - name: consent-plugin-secret
          mountPath: /consent-secret
          readOnly: true
      # NOTE: helm REPLACES list values, so the odrl-authorization defaults
      # (tpp-policy + opa-config, mounted by the OPA sidecar) are re-included here
      # alongside the ext-plugin binary volume.
      extraVolumes:
        - name: tpp-policy
          configMap:
            name: tpp-policy
        - name: opa-config
          configMap:
            name: opa-config
        - name: ext-plugin-bin
          emptyDir: {}
        - name: consent-plugin-secret
          secret:
            secretName: consent-plugin-credentials

# consent management (ISO/IEC TS 27560) - consent-manager + consent-facade.
# The facade reads the provider's tm-forum-api; mongo uses the managed replica set.
consentManagement:
  enabled: true
  # the consent-manager now runs in the trust-anchor (the central authority, see
  # k3s/consent-trust-anchor.yaml); the provider keeps only the consent-facade.
  # Consent is enforced solely by the APISIX consent-filter plugin (canonical
  # path); there is no odrl-pap PIP wiring here, and the provider does not hold
  # the consent key (the consent-manager + its facade do, at the trust-anchor).
  consentManager:
    enabled: false
  # The consent-facade now runs at the AUTHORITY (k3s/consent-trust-anchor.yaml),
  # not the provider: it is built to front multiple providers and authenticates to
  # each provider's OID4VP-protected TM Forum api (mp-tmf-api) as the dataspace
  # authority (did:web:dataspace-authority.org). The provider therefore no longer
  # deploys it; it keeps only the APISIX consent-plugin wiring below.
  consentFacade:
    enabled: false
  # the consent-plugin's participant client secret, mounted as a file into the
  # provider APISIX container and exported as env CONSENT_CLIENT_SECRET by the
  # ext-plugin launch command, so it is not stored as plaintext in the route
  # config / etcd. For the demo a literal Secret is created below; in production
  # set create=false and provide a Secret named consent-plugin-credentials
  # externally (e.g. Vault-synced via external-secrets) with the same key.
  pluginCredentials:
    create: true
    clientSecret: "demo"

extraManifests:
  - |
    {{- if .Values.consentManagement.pluginCredentials.create }}
    apiVersion: v1
    kind: Secret
    metadata:
      name: consent-plugin-credentials
      # helm template does not inject the namespace; set it explicitly so the
      # apply does not drop this into the default namespace.
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      clientSecret: {{ .Values.consentManagement.pluginCredentials.clientSecret | quote }}
    {{- end }}
  # --- authorize the consent-facade's cross-org reads at the odrl-pap -----------
  # The facade (at the authority) authenticates to mp-tmf-api over OID4VP and passes
  # the openid-connect check, but the route's OPA/ODRL layer default-denies without a
  # matching policy. This registers an ODRL policy permitting *read* of /tmf-api to any
  # holder of an OperatorCredential (the credential the authority presents), so the
  # facade can project the provider's TM Forum data. Idempotent (re-POST is tolerated).
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ .Release.Name }}-authorize-facade-tmf-read
      namespace: {{ .Release.Namespace }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 10
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: register-policy
              image: curlimages/curl:8.18.0
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  echo "waiting for odrl-pap..."
                  until curl -sf http://odrl-pap:8080/policy > /dev/null; do sleep 5; done
                  cat > /tmp/policy.json <<'JSON'
                  {"@context":{"odrl":"http://www.w3.org/ns/odrl/2/","xsd":"http://www.w3.org/2001/XMLSchema#"},"@id":"https://mp-operation.org/policy/authority/tmfApiRead","odrl:uid":"https://mp-operation.org/policy/authority/tmfApiRead","@type":"odrl:Policy","odrl:permission":{"odrl:assigner":{"@id":"https://www.mp-operation.org/"},"odrl:target":{"@type":"odrl:AssetCollection","odrl:source":"urn:asset","odrl:refinement":[{"@type":"odrl:Constraint","odrl:leftOperand":"http:path","odrl:operator":{"@id":"http:isInPath"},"odrl:rightOperand":"/tmf-api"}]},"odrl:assignee":{"@type":"odrl:PartyCollection","odrl:source":"urn:user","odrl:refinement":{"@type":"odrl:Constraint","odrl:leftOperand":{"@id":"vc:type"},"odrl:operator":{"@id":"odrl:hasPart"},"odrl:rightOperand":{"@value":"OperatorCredential","@type":"xsd:string"}}},"odrl:action":{"@id":"odrl:read"}}}
                  JSON
                  code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST http://odrl-pap:8080/policy -H 'Content-Type: application/json' --data @/tmp/policy.json)
                  echo "odrl-pap POST /policy -> HTTP $code"; cat /tmp/out
                  # 2xx = created; a conflict on re-run is fine (policy already present)
                  case "$code" in 2*) exit 0;; 409) echo "already registered"; exit 0;; *) exit 1;; esac
