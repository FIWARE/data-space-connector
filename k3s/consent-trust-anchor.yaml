# ---------------------------------------------------------------------------
# Consent authority overlay (trust-anchor namespace).
#
# Deploys the consent-manager + an internal APISIX facade + a managed MongoDB
# using the DSC umbrella chart as a SECOND release (name `consent-authority`) in
# the trust-anchor namespace - the "central authority" that knows all
# participants. Everything else the umbrella chart offers is disabled. The
# consent-facade stays at the provider and is reached cross-namespace.
#
# Layered by the `consent` maven profile:
#   helm template consent-authority charts/data-space-connector \
#     -f k3s/consent-trust-anchor.yaml --namespace trust-anchor
# ---------------------------------------------------------------------------

# --- everything the connector normally deploys, off -------------------------
scorpio:
  enabled: false


consentFacade:
  enabled: true

# --- OID4VP credential issuer for did:web:dataspace-authority.org --------------
# Self-contained Keycloak issuer (mirrors the consumer issuer) that mints a
# verifiable OperatorCredential for the consent-facade running in this release.
# Adapted from k3s/consumer.yaml; trimmed to just the operator-credential scope
# and the contract-management service-account client that requests it.
keycloak:
  enabled: true
  # -- distinct name so the Service/StatefulSet are `authority-keycloak`
  # (referenced by vcCredentials/vc-operator issuerURL below).
  fullnameOverride: authority-keycloak
  # -- EMBEDDED postgres. The external Zalando DB the umbrella defaults to is not
  # available in the trust-anchor namespace, so enable the keycloak subchart's
  # bundled postgres. With postgres.enabled=true the subchart auto-wires the JDBC
  # URL (`jdbc:postgresql://<release>-postgres:5432/keycloak`), the `postgres`
  # username and the password from the generated `<release>-postgres` secret -
  # the external `database.*` block is ignored entirely in that branch. We only
  # blank `database.existingSecret` so nothing dangling references the missing
  # Zalando secret.
  postgres:
    enabled: true
  database:
    existingSecret: ""
  resources:
    requests:
      cpu: "100m"
    limits:
      cpu: "500m"
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/alt-names: "keycloak-authority.127.0.0.1.nip.io"
      cert-manager.io/common-name: "keycloak-authority.127.0.0.1.nip.io"
    hosts:
      - host: keycloak-authority.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-authority.127.0.0.1.nip.io-tls
        hosts:
          - keycloak-authority.127.0.0.1.nip.io
  extraInitContainers:
    - name: prepare-keystore
      image: alpine/openssl:3.5.5
      command: ["/bin/sh", "-c"]
      args:
        - |
          openssl pkcs12 -export \
            -in /certs-did/tls.crt \
            -inkey /certs-did/tls.key \
            -certfile /certs-did/ca.crt \
            -out /did-material/cert.pfx \
            -name "didPrivateKey" \
            -passout env:STORE_PASS
          chmod 644 /did-material/cert.pfx
      env:
      - name: "STORE_PASS"
        valueFrom:
          secretKeyRef:
            name: keystore-password
            key: password
      volumeMounts:
        - name: did-material
          mountPath: /did-material
        - name: did-priv-key
          mountPath: /certs-did
    - name: register-at-tir
      image: curlimages/curl:8.18.0
      command:
        - /bin/sh
      args:
        - -ec
        - |
          #!/bin/sh
          curl -X 'POST' 'http://tir.trust-anchor.svc.cluster.local:8080/issuer' -H 'Content-Type: application/json' -d "{\"did\": \"did:web:dataspace-authority.org\", \"credentials\": []}"
  extraVolumeMounts:
    - mountPath: /did-material
      name: did-material
    - mountPath: /opt/keycloak/data/import
      name: realms
    - name: providers
      mountPath: /opt/keycloak/providers
  extraVolumes:
    - emptyDir: {}
      name: did-material
    - configMap:
        name: authority-realm-realm
      name: realms
    - name: did-priv-key
      secret:
        secretName: dataspace-authority.org-tls
    - name: providers
      emptyDir: {}
  issuerDid: did:web:dataspace-authority.org
  signingKey:
    storePath: /did-material/cert.pfx
    storePassword: "${STORE_PASS}"
    keyAlias: didPrivateKey
    keyPassword: "${STORE_PASS}"
    did: did:web:dataspace-authority.org
    keyAlgorithm: ES256
  proxy:
    enabled: true
    httpsProxy: "http://squid-proxy.infra.svc.cluster.local:8888"
    noProxy: "localhost,*.cluster.local,*.svc"
    spiProxyMappings: ".*\\.127\\.0\\.0\\.1\\.nip\\.io;http://squid-proxy.infra.svc.cluster.local:8888"
  # extraEnvVars replaces the umbrella list, so KC_HEAP_SIZE has to be repeated here.
  # STORE_PASS is consumed by the realm.json key-provider config (see signingKey above).
  extraEnvVars:
    - name: KC_HEAP_SIZE
      value: "1024m"
    - name: "STORE_PASS"
      valueFrom:
        secretKeyRef:
          name: keystore-password
          key: password
  realm:
    frontendUrl: https://keycloak-authority.127.0.0.1.nip.io
    import: true
    name: authority-realm
    attributes:
      issuerDid: "did:web:dataspace-authority.org"
    # -- only the operator-credential scope is needed to mint the
    # OperatorCredential for the consent-facade. Status-list mapper dropped
    # (no token-status-list plugin / tokenStatusList at the authority).
    verifiableCredentials:
      operator-credential:
        attributes:
          format: "jwt_vc_json"
          verifiable_credential_type: "OperatorCredential"
          credential_signing_alg: "ES256"
          credential_build_config.token_jws_type: "JWT"
        protocolMappers:
          - name: context-mapper-oc
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
          - name: email-mapper-oc
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: email
              userAttribute: email
          - name: firstName-mapper-oc
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: firstName
              userAttribute: firstName
          - name: lastName-mapper-oc
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: lastName
              userAttribute: lastName
          # operator-credential is presented to the provider's data service
          # (organization_did=mp-operations.org), so the role array carries that target.
          - name: role-mapper-oc
            protocol: oid4vc
            protocolMapper: oid4vc-target-role-mapper
            config:
              claim.name: roles
              clientId: did:web:mp-operations.org
    # -- roles for the role-mapper-oc target client. did:web:mp-operations.org
    # must exist as a client (defined below) for these role definitions and the
    # service-account role assignment to import cleanly.
    clientRoles: |
      "did:web:mp-operations.org": [
        {
          "name": "OPERATOR",
          "description": "Is allowed to operate clusters.",
          "clientRole": true
        },
        {
          "name": "REPRESENTATIVE",
          "description": "Is allowed to register.",
          "clientRole": true
        }]
    users: |
      {
        "username": "service-account-contract-management",
        "enabled": true,
        "serviceAccountClientId": "contract-management",
        "clientRoles": {
          "did:web:mp-operations.org": [
            "REPRESENTATIVE"
          ]
        },
        "verifiableCredentials": [
          {"credentialScopeName": "operator-credential"}
        ]
      }
    clients:
      # -- target client for the operator-credential role mapper. Minimal
      # service-account client; its roles (above) are what the OperatorCredential
      # `roles` claim is populated from.
      - clientId: did:web:mp-operations.org
        enabled: true
        description: Client to connect mp-operations.org
        surrogateAuthRequired: false
        alwaysDisplayInConsole: false
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        bearerOnly: false
        consentRequired: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        publicClient: false
        frontchannelLogout: false
        secret: kpWxZn7LgcWT84AzS3aS5X5URmL0FC0Q
        protocol: openid-connect
        attributes:
          client.secret.creation.time: "1675260539"
        protocolMappers: []
        authenticationFlowBindingOverrides: {}
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: []
      # -- the client the vc-operator authenticates as to request the credential.
      - clientId: contract-management
        enabled: true
        description: Client representing the contract-management
        surrogateAuthRequired: false
        alwaysDisplayInConsole: false
        clientAuthenticatorType: client-secret
        secret: contract-management-client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        bearerOnly: false
        consentRequired: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        publicClient: false
        frontchannelLogout: false
        protocol: openid-connect
        attributes:
          client.secret.creation.time: "1675260539"
          oid4vci.enabled: "true"
        authenticationFlowBindingOverrides: {}
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: ["operator-credential"]
tm-forum-api:
  enabled: false
contract-management:
  enabled: false
marketplace:
  enabled: false
fdsc-edc:
  enabled: false
fdsc-dashboard:
  enabled: false
vault:
  enabled: false
# --- did:web:dataspace-authority.org did-helper (serves the DID document) ------
did:
  enabled: true
  config:
    server:
      hostUrl: "http://dataspace-authority.org"
      certPath: "/certs/tls.crt"
  volumes:
    - name: certs
      secret:
        secretName: dataspace-authority.org-tls
        items:
          - key: tls.crt
            path: tls.crt
  volumeMounts:
    - name: certs
      mountPath: /certs
  ingress:
    enabled: true
    className: ""
    annotations:
      traefik.ingress.kubernetes.io/service.passhostheader: "true"
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/common-name: "dataspace-authority.org"
      cert-manager.io/alt-names: "dataspace-authority.org"
    hosts:
      - host: dataspace-authority.org
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: dataspace-authority.org-tls
        hosts:
          - dataspace-authority.org
cert-manager:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opentelemetry-operator:
  enabled: false
opentelemetry-collector:
  enabled: false
tempo:
  enabled: false
rainbow:
  enabled: false
identityhub:
  enabled: false
dataSpaceConfig:
  enabled: false
# the authority-keycloak issuer needs the generated admin secret (issuance-secret)
issuance:
  generatePasswords:
    enabled: true

# --- vc-operator: reconciles the OperatorCredential into a secret --------------
vc-operator:
  enabled: true
  watchNamespaces:
    - trust-anchor
  extraEnvVars:
    - name: HTTPS_PROXY
      value: "http://squid-proxy.infra.svc.cluster.local:8888"
    - name: HTTP_PROXY
      value: "http://squid-proxy.infra.svc.cluster.local:8888"
    - name: NO_PROXY
      value: "authority-keycloak,*.cluster.local,*.svc,10.0.0.0/8"
    - name: SSL_CERT_FILE
      value: "/etc/ssl/certs/ca.crt"
  extraVolumeMounts:
    - name: root-ca
      mountPath: /etc/ssl/certs/ca.crt
      subPath: ca.crt
      readOnly: true
  extraVolumes:
    - name: root-ca
      secret:
        secretName: dataspace-authority.org-tls
        items:
          - key: ca.crt
            path: ca.crt

# --- vcCredentials: the OperatorCredential request for the consent-facade -------
vcCredentials:
  enabled: true
  issuers:
    - name: authority-operator-issuer
      issuerURL: http://authority-keycloak:8080/realms/authority-realm
      issuerType: keycloak
      tokenURL: http://authority-keycloak:8080/realms/authority-realm/protocol/openid-connect/token
      auth:
        secretName: authority-contract-management-client-auth
        clientId: contract-management
        clientSecret: contract-management-client-secret
      requests:
        - name: authority-operator-credential
          credentialType: operator-credential
          format: jwt_vc_json
          targetSecretName: vc-operator-credential
          targetSecretKey: credential
          targetFile: operator-credential.jwt
          renewBefore: 5m
          holderBinding:
            enabled: false

# --- APISIX only, out of decentralized-iam (internal facade in front of the CM)
decentralizedIam:
  enabled: true
  vcAuthentication:
    # no Postgres at the authority (verifier/til/ccs/identityhub are off); avoids
    # colliding with the trust-anchor chart's own postgres-operator.
    postgres-operator:
      enabled: false
    managedPostgres:
      enabled: false
    trusted-issuers-list:
      enabled: false
    vcverifier:
      enabled: false
    credentials-config-service:
      enabled: false
  odrlAuthorization:
    apisix:
      etcd:
        replicaCount: 1
        persistence:
          enabled: false
      apisix:
        enabled: true
        admin:
          credentials:
            admin: admin
          allow:
            ipList:
              - 0.0.0.0/0
        deployment:
          mode: traditional
          role: "traditional"
          role_traditional:
            config_provider: "etcd"
          role_data_plane:
            config_provider: "etcd"
        catchAllRoute:
          enabled: false
      # internal only - the authority's apisix is not exposed via ingress
      ingress:
        enabled: false
      catchAllRoute:
        enabled: false
      # the consent key is sourced from consent-manager-secret (not a literal in
      # git/etcd): mounted here as env CONSENT_KEY and referenced in the facade
      # route header as $env://CONSENT_KEY, which APISIX resolves at runtime.
      extraEnvVars:
        - name: CONSENT_KEY
          valueFrom:
            secretKeyRef:
              name: consent-manager-secret
              key: consentKey
      # the consent-manager facade (roadmap item 1). Two routes:
      #  * /participants/login is exempt (it issues the token) - higher priority.
      #  * everything else requires a valid *participant JWT* (jwt-auth, keyed on
      #    the token's participant_name via the consumer registered below), then
      #    injects the consent key server-side. Callers therefore authenticate
      #    per-participant with their JWT and never hold the shared consent key.
      #    The x-user-key subject selector is forwarded: it now sits behind the
      #    per-participant jwt-auth (no longer an unauthenticated shortcut), so a
      #    participant can name the subject of a grant. Deriving the subject from
      #    the token `sub` instead of a caller-supplied header is the rest of UF-1.
      # Matched on uri only (no host); this apisix is internal (ingress off).
      routes:
        - uri: /consent-manager/v1/participants/login
          priority: 10
          upstream:
            nodes:
              consent-manager:3000: 1
            type: roundrobin
          plugins:
            proxy-rewrite:
              regex_uri: ["^/consent-manager/(.*)", "/$1"]
              headers:
                remove:
                  - x-user-key
        - uri: /consent-manager/*
          priority: 0
          upstream:
            nodes:
              consent-manager:3000: 1
            type: roundrobin
          plugins:
            jwt-auth:
              key_claim_name: participant_name
              header: authorization
            proxy-rewrite:
              regex_uri: ["^/consent-manager/(.*)", "/$1"]
              headers:
                set:
                  x-visionstrust-consent-key: "$env://CONSENT_KEY"
    # the PAP/PDP are not needed at the authority
    odrl-pap:
      enabled: false

# --- consent-manager, consent-facade and their managed MongoDB --------------
# These no longer live in this (umbrella-chart) release. They are deployed from
# the trust-anchor chart as part of the `trust-anchor` release in this same
# namespace, via k3s/consent-trust-anchor-components.yaml. This release provides
# only the IAM that backs consent: the keycloak issuer, the did:web helper (the
# `dataspace-authority.org-tls` secret the facade mounts), the vc-operator (the
# `vc-operator-credential` secret the facade mounts) and the APISIX facade route
# below. The route + the reconcile Job reference `consent-manager-secret` and the
# `consent-manager` service by name (both created by the trust-anchor release in
# this namespace). See doc/CONSENT_MANAGEMENT.md.
#
# No participant is statically configured. The authority learns participants
# through registration (`POST /v1/participants`), and the reconcile Job below then
# provisions a jwt-auth consumer for each. In the demo the provider participant is
# registered as a manual bootstrap step - see doc/CONSENT_MANAGEMENT.md.

# --- reconcile one jwt-auth consumer per participant --------------------------
# The apisix chart has no native `consumers` support, so a bootstrap Job PUTs the
# consumers via the admin API once apisix is up. Rather than a single hardcoded
# consumer, this reconciles *every* participant the consent-manager knows: it runs
# the consent-manager image (already carries mongoose + the compiled models),
# lists the participants, and PUTs a jwt-auth consumer for each - keyed on the
# participant's legalName (the token's `participant_name` claim), signed with the
# shared JWT_SECRET_KEY the consent-manager issues all tokens with. It is
# idempotent (PUT), so it also re-syncs consumers after an apisix/etcd reset. At
# first deploy the participant set is usually empty (a no-op); the register Job
# provisions the consumer for the participant it registers, so a real authority's
# registration path is what drives this. jwt-auth on the facade route then rejects
# any request whose token's participant_name has no matching consumer.
extraManifests:
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ .Release.Name }}-jwt-consumer
      # helm template does not inject the namespace; set it explicitly so the
      # apply does not drop this into the default namespace (where it cannot reach
      # the trust-anchor apisix admin, mongo or read consent-manager-secret).
      namespace: {{ .Release.Namespace }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 10
      template:
        spec:
          restartPolicy: OnFailure
          # The consent-manager image, consent-manager-secret and the managed mongo
          # (mongodb-svc / mongodb-consent-password) are created by the trust-anchor
          # release (charts/trust-anchor, via k3s/consent-trust-anchor-components.yaml)
          # in this same namespace. This Job runs in the consent-authority release
          # (where APISIX lives), so it references them by their well-known names -
          # keep these in sync with the trust-anchor chart's consentManagement /
          # managedMongo defaults.
          containers:
            - name: reconcile-consumers
              image: "consent-manager:local"
              imagePullPolicy: IfNotPresent
              env:
                - name: APISIX_ADMIN
                  value: "http://{{ .Release.Name }}-apisix-admin:9180"
                - name: APISIX_ADMIN_KEY
                  value: "admin"
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: consent-manager-secret
                      key: jwtSecret
                - name: CM_MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-consent-password
                      key: password
                - name: MONGO_URI
                  value: "mongodb://consent:$(CM_MONGO_PASSWORD)@mongodb-svc:27017/consent?replicaSet=mongodb"
                - name: RECONCILE_JS
                  value: |
                    const NM='/usr/src/app/node_modules/';
                    const mongoose=require(NM+'mongoose');
                    const http=require('http');
                    const Participant=require('/usr/src/app/dist/src/models/Participant/Participant.model').default;
                    const ADMIN=process.env.APISIX_ADMIN, KEY=process.env.APISIX_ADMIN_KEY, SECRET=process.env.JWT_SECRET_KEY;
                    const call=(method,url,headers,body)=>{const u=new URL(url);return new Promise((res,rej)=>{const d=body?JSON.stringify(body):null;const opt={host:u.hostname,port:u.port||80,method,path:u.pathname+u.search,headers:Object.assign({'content-type':'application/json'},headers||{},d?{'content-length':Buffer.byteLength(d)}:{})};const r=http.request(opt,x=>{let b='';x.on('data',c=>b+=c);x.on('end',()=>res({code:x.statusCode,body:b}));});r.on('error',rej);if(d)r.write(d);r.end();});};
                    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                    (async()=>{
                      let up=false;
                      for(let i=0;i<60&&!up;i++){try{const r=await call('GET',ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY});if(r.code===200||r.code===401)up=true;}catch(e){}if(!up){console.log('waiting for apisix admin...');await sleep(3000);}}
                      await mongoose.connect(process.env.MONGO_URI);
                      const ps=await Participant.find({}).select('legalName');
                      let n=0;
                      for(const p of ps){
                        const ln=p.legalName;if(!ln)continue;
                        const username=ln.replace(/[^0-9a-zA-Z_]/g,'_');
                        const r=await call('PUT',ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY},{username:username,plugins:{'jwt-auth':{key:ln,secret:SECRET,algorithm:'HS256'}}});
                        if(r.code>=300)throw new Error('consumer PUT for '+ln+' -> HTTP '+r.code+' '+r.body.slice(0,150));
                        console.log('  consumer '+username+'  key='+JSON.stringify(ln));n++;
                      }
                      console.log('reconciled '+n+' participant consumer(s)');
                      await mongoose.disconnect();
                    })().catch(e=>{console.error('ERR',e.stack||e.message);process.exit(1);});
              command: ["/bin/sh", "-ec"]
              args:
                - node -e "$RECONCILE_JS"
  # --- keystore password for the authority-keycloak prepare-keystore init ------
  # Consumed by the keycloak prepare-keystore init container (STORE_PASS) to
  # export /did-material/cert.pfx from the dataspace-authority.org-tls secret.
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: keystore-password
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      password: "dsc-authority-keystore-2026!"
