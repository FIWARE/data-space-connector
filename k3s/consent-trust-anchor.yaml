# ---------------------------------------------------------------------------
# Consent authority overlay (trust-anchor namespace).
#
# Deploys the consent-manager + an internal APISIX facade + a managed MongoDB
# using the DSC umbrella chart as a SECOND release (name `consent-authority`) in
# the trust-anchor namespace - the "central authority" that knows all
# participants. Everything else the umbrella chart offers is disabled. The
# consent-facade stays at the provider and is reached cross-namespace.
#
# Layered by the `consent` maven profile:
#   helm template consent-authority charts/data-space-connector \
#     -f k3s/consent-trust-anchor.yaml --namespace trust-anchor
# ---------------------------------------------------------------------------

# --- everything the connector normally deploys, off -------------------------
scorpio:
  enabled: false
keycloak:
  enabled: false
tm-forum-api:
  enabled: false
contract-management:
  enabled: false
marketplace:
  enabled: false
fdsc-edc:
  enabled: false
fdsc-dashboard:
  enabled: false
vault:
  enabled: false
did:
  enabled: false
cert-manager:
  enabled: false
vc-operator:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opentelemetry-operator:
  enabled: false
opentelemetry-collector:
  enabled: false
tempo:
  enabled: false
rainbow:
  enabled: false
identityhub:
  enabled: false
dataSpaceConfig:
  enabled: false
# no keycloak here -> no issuance secrets needed
issuance:
  generatePasswords:
    enabled: false

# --- APISIX only, out of decentralized-iam (internal facade in front of the CM)
decentralizedIam:
  enabled: true
  vcAuthentication:
    # no Postgres at the authority (verifier/til/ccs/identityhub are off); avoids
    # colliding with the trust-anchor chart's own postgres-operator.
    postgres-operator:
      enabled: false
    managedPostgres:
      enabled: false
    trusted-issuers-list:
      enabled: false
    vcverifier:
      enabled: false
    credentials-config-service:
      enabled: false
  odrlAuthorization:
    apisix:
      etcd:
        replicaCount: 1
        persistence:
          enabled: false
      apisix:
        enabled: true
        admin:
          credentials:
            admin: admin
          allow:
            ipList:
              - 0.0.0.0/0
        deployment:
          mode: traditional
          role: "traditional"
          role_traditional:
            config_provider: "etcd"
          role_data_plane:
            config_provider: "etcd"
        catchAllRoute:
          enabled: false
      # internal only - the authority's apisix is not exposed via ingress
      ingress:
        enabled: false
      catchAllRoute:
        enabled: false
      # the consent key is sourced from consent-manager-secret (not a literal in
      # git/etcd): mounted here as env CONSENT_KEY and referenced in the facade
      # route header as $env://CONSENT_KEY, which APISIX resolves at runtime.
      extraEnvVars:
        - name: CONSENT_KEY
          valueFrom:
            secretKeyRef:
              name: consent-manager-secret
              key: consentKey
      # the consent-manager facade (roadmap item 1). Two routes:
      #  * /participants/login is exempt (it issues the token) - higher priority.
      #  * everything else requires a valid *participant JWT* (jwt-auth, keyed on
      #    the token's participant_name via the consumer registered below), then
      #    injects the consent key server-side and strips the x-user-key shortcut.
      # Matched on uri only (no host); this apisix is internal (ingress off).
      routes:
        - uri: /consent-manager/v1/participants/login
          priority: 10
          upstream:
            nodes:
              consent-manager:3000: 1
            type: roundrobin
          plugins:
            proxy-rewrite:
              regex_uri: ["^/consent-manager/(.*)", "/$1"]
              headers:
                remove:
                  - x-user-key
        - uri: /consent-manager/*
          priority: 0
          upstream:
            nodes:
              consent-manager:3000: 1
            type: roundrobin
          plugins:
            jwt-auth:
              key_claim_name: participant_name
              header: authorization
            proxy-rewrite:
              regex_uri: ["^/consent-manager/(.*)", "/$1"]
              headers:
                set:
                  x-visionstrust-consent-key: "$env://CONSENT_KEY"
                remove:
                  - x-user-key
    # the PAP/PDP are not needed at the authority
    odrl-pap:
      enabled: false

# --- managed MongoDB replica set for the consent-manager --------------------
mongo-operator:
  enabled: true
managedMongo:
  enabled: true

# --- the consent-manager (the consent-facade lives at the provider) ---------
consentManagement:
  enabled: true
  consentManager:
    enabled: true
    # the consent-facade lives at the provider (cross-namespace)
    contractServiceBaseUrl: "http://consent-facade.provider.svc.cluster.local:8080"
  consentFacade:
    enabled: false
  # seeded into consent-manager-secret; the consent-manager validates it and the
  # facade route injects the same value ($env://CONSENT_KEY) on the caller's behalf.
  consentKey: "changeme-consent-key"
  # provider participant registered at deploy time (item 3) via the consent-manager's
  # real POST /participants API - so the participant is a deploy artifact with a
  # stable selfDescriptionURL, not a per-run side effect of the seed script.
  # clientID/clientSecret MUST match the provider consent-filter plugin credentials
  # (route conf client_id + the consent-plugin-credentials secret in the provider ns).
  providerParticipant:
    enabled: true
    legalName: "M&P Operations Inc."
    email: "provider@mp-operation.org"
    did: "did:web:mp-operations.org"
    clientID: "consent-demo-provider"
    # the backing TMForum organization (provider party API) the selfDescriptionURL
    # dereferences to; find-or-created by name so the SD is stable across runs.
    orgName: "Consent Demo Provider"
    orgCountry: "DE"
    # cross-namespace endpoints at the provider (the consent-facade serves the SD)
    tmforumUrl: "http://tm-forum-api-svc.provider.svc.cluster.local:8080"
    facadeUrl: "http://consent-facade.provider.svc.cluster.local:8080"

# --- reconcile one jwt-auth consumer per participant --------------------------
# The apisix chart has no native `consumers` support, so a bootstrap Job PUTs the
# consumers via the admin API once apisix is up. Rather than a single hardcoded
# consumer, this reconciles *every* participant the consent-manager knows: it runs
# the consent-manager image (already carries mongoose + the compiled models),
# lists the participants, and PUTs a jwt-auth consumer for each - keyed on the
# participant's legalName (the token's `participant_name` claim), signed with the
# shared JWT_SECRET_KEY the consent-manager issues all tokens with. It is
# idempotent (PUT), so it also re-syncs consumers after an apisix/etcd reset. At
# first deploy the participant set is usually empty (a no-op); consent_grant.sh
# provisions the consumer for each participant it registers, so a real authority's
# registration path is what drives this. jwt-auth on the facade route then rejects
# any request whose token's participant_name has no matching consumer.
extraManifests:
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ .Release.Name }}-jwt-consumer
      # helm template does not inject the namespace; set it explicitly so the
      # apply does not drop this into the default namespace (where it cannot reach
      # the trust-anchor apisix admin, mongo or read consent-manager-secret).
      namespace: {{ .Release.Namespace }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 10
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconcile-consumers
              image: "{{ .Values.consentManagement.consentManager.image.repository }}:{{ .Values.consentManagement.consentManager.image.tag }}"
              imagePullPolicy: {{ .Values.consentManagement.consentManager.image.pullPolicy }}
              env:
                - name: APISIX_ADMIN
                  value: "http://{{ .Release.Name }}-apisix-admin:9180"
                - name: APISIX_ADMIN_KEY
                  value: "admin"
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.consentManagement.consentManager.secret.name }}
                      key: jwtSecret
                - name: CM_MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.consentManagement.consentManager.mongo.auth.existingSecret }}
                      key: {{ .Values.consentManagement.consentManager.mongo.auth.existingSecretPasswordKey }}
                - name: MONGO_URI
                  value: "mongodb://{{ .Values.consentManagement.consentManager.mongo.username }}:$(CM_MONGO_PASSWORD)@{{ .Values.consentManagement.consentManager.mongo.host }}:{{ .Values.consentManagement.consentManager.mongo.port }}/{{ .Values.consentManagement.consentManager.mongo.database }}?replicaSet={{ .Values.consentManagement.consentManager.mongo.replicaSet }}"
                - name: RECONCILE_JS
                  value: |
                    const NM='/usr/src/app/node_modules/';
                    const mongoose=require(NM+'mongoose');
                    const http=require('http');
                    const Participant=require('/usr/src/app/dist/src/models/Participant/Participant.model').default;
                    const ADMIN=process.env.APISIX_ADMIN, KEY=process.env.APISIX_ADMIN_KEY, SECRET=process.env.JWT_SECRET_KEY;
                    const call=(method,url,headers,body)=>{const u=new URL(url);return new Promise((res,rej)=>{const d=body?JSON.stringify(body):null;const opt={host:u.hostname,port:u.port||80,method,path:u.pathname+u.search,headers:Object.assign({'content-type':'application/json'},headers||{},d?{'content-length':Buffer.byteLength(d)}:{})};const r=http.request(opt,x=>{let b='';x.on('data',c=>b+=c);x.on('end',()=>res({code:x.statusCode,body:b}));});r.on('error',rej);if(d)r.write(d);r.end();});};
                    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                    (async()=>{
                      let up=false;
                      for(let i=0;i<60&&!up;i++){try{const r=await call('GET',ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY});if(r.code===200||r.code===401)up=true;}catch(e){}if(!up){console.log('waiting for apisix admin...');await sleep(3000);}}
                      await mongoose.connect(process.env.MONGO_URI);
                      const ps=await Participant.find({}).select('legalName');
                      let n=0;
                      for(const p of ps){
                        const ln=p.legalName;if(!ln)continue;
                        const username=ln.replace(/[^0-9a-zA-Z_]/g,'_');
                        const r=await call('PUT',ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY},{username:username,plugins:{'jwt-auth':{key:ln,secret:SECRET,algorithm:'HS256'}}});
                        if(r.code>=300)throw new Error('consumer PUT for '+ln+' -> HTTP '+r.code+' '+r.body.slice(0,150));
                        console.log('  consumer '+username+'  key='+JSON.stringify(ln));n++;
                      }
                      console.log('reconciled '+n+' participant consumer(s)');
                      await mongoose.disconnect();
                    })().catch(e=>{console.error('ERR',e.stack||e.message);process.exit(1);});
              command: ["/bin/sh", "-ec"]
              args:
                - node -e "$RECONCILE_JS"
  # --- provider participant client secret (item 3) ----------------------------
  # Used by the register Job below to set the participant's clientSecret. MUST
  # equal the provider consent-filter plugin's client secret (consent-plugin-
  # credentials in the provider namespace) so the plugin can log in as it.
  - |
    {{- if .Values.consentManagement.providerParticipant.enabled }}
    apiVersion: v1
    kind: Secret
    metadata:
      name: provider-participant-credentials
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      clientSecret: "demo"
    {{- end }}
  # --- register the provider participant at deploy time (item 3) ---------------
  # Runs the consent-manager image to (1) find-or-create the backing TMForum org
  # at the provider (so the selfDescriptionURL is stable), (2) register the
  # participant via the consent-manager's real POST /v1/participants API
  # (idempotent: 201 new / 409 exists), and (3) provision its jwt-auth consumer.
  # This makes the provider participant a deploy artifact rather than a per-run
  # side effect of consent_grant.sh.
  - |
    {{- if .Values.consentManagement.providerParticipant.enabled }}
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ .Release.Name }}-register-provider-participant
      namespace: {{ .Release.Namespace }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 10
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: register-participant
              image: "{{ .Values.consentManagement.consentManager.image.repository }}:{{ .Values.consentManagement.consentManager.image.tag }}"
              imagePullPolicy: {{ .Values.consentManagement.consentManager.image.pullPolicy }}
              env:
                - name: CM_URL
                  value: "http://consent-manager:{{ .Values.consentManagement.consentManager.service.port }}"
                - name: TMF_PARTY
                  value: "{{ .Values.consentManagement.providerParticipant.tmforumUrl }}/tmf-api/party/v4/organization"
                - name: FACADE
                  value: "{{ .Values.consentManagement.providerParticipant.facadeUrl }}"
                - name: APISIX_ADMIN
                  value: "http://{{ .Release.Name }}-apisix-admin:9180"
                - name: APISIX_ADMIN_KEY
                  value: "admin"
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.consentManagement.consentManager.secret.name }}
                      key: jwtSecret
                - name: PROV_LEGALNAME
                  value: {{ .Values.consentManagement.providerParticipant.legalName | quote }}
                - name: PROV_EMAIL
                  value: {{ .Values.consentManagement.providerParticipant.email | quote }}
                - name: PROV_DID
                  value: {{ .Values.consentManagement.providerParticipant.did | quote }}
                - name: PROV_CLIENTID
                  value: {{ .Values.consentManagement.providerParticipant.clientID | quote }}
                - name: PROV_CLIENTSECRET
                  valueFrom:
                    secretKeyRef:
                      name: provider-participant-credentials
                      key: clientSecret
                - name: PROV_ORG_NAME
                  value: {{ .Values.consentManagement.providerParticipant.orgName | quote }}
                - name: PROV_ORG_COUNTRY
                  value: {{ .Values.consentManagement.providerParticipant.orgCountry | quote }}
                - name: REGISTER_JS
                  value: |
                    const http=require('http');
                    const CM=process.env.CM_URL, TMF=process.env.TMF_PARTY, FACADE=process.env.FACADE;
                    const ADMIN=process.env.APISIX_ADMIN, KEY=process.env.APISIX_ADMIN_KEY, SECRET=process.env.JWT_SECRET_KEY;
                    const P={legalName:process.env.PROV_LEGALNAME,email:process.env.PROV_EMAIL,did:process.env.PROV_DID,clientID:process.env.PROV_CLIENTID,clientSecret:process.env.PROV_CLIENTSECRET};
                    const ORG_NAME=process.env.PROV_ORG_NAME, ORG_COUNTRY=process.env.PROV_ORG_COUNTRY;
                    const call=(method,url,headers,body)=>{const u=new URL(url);return new Promise((res,rej)=>{const d=body?JSON.stringify(body):null;const opt={host:u.hostname,port:u.port||80,method,path:u.pathname+u.search,headers:Object.assign({'content-type':'application/json'},headers||{},d?{'content-length':Buffer.byteLength(d)}:{})};const r=http.request(opt,x=>{let b='';x.on('data',c=>b+=c);x.on('end',()=>res({code:x.statusCode,body:b}));});r.on('error',rej);if(d)r.write(d);r.end();});};
                    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                    async function waitOk(url,headers,ok){for(let i=0;i<60;i++){try{const r=await call('GET',url,headers);if(ok.includes(r.code))return;}catch(e){}console.log('waiting for '+url+'...');await sleep(3000);}throw new Error('timeout waiting for '+url);}
                    (async()=>{
                      await waitOk(CM+'/v1/participants',{},[200]);
                      await waitOk(TMF+'?limit=1',{},[200]);
                      await waitOk(ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY},[200,401]);
                      let orgId;
                      const list=await call('GET',TMF+'?limit=1000');
                      let orgs=[];try{orgs=JSON.parse(list.body);}catch(e){}
                      const found=(Array.isArray(orgs)?orgs:[]).find(o=>o&&o.name===ORG_NAME);
                      if(found){orgId=found.id;}
                      else{const c=await call('POST',TMF,{},{name:ORG_NAME,tradingName:ORG_NAME,isLegalEntity:true,organizationType:'company',contactMedium:[{characteristic:{country:ORG_COUNTRY}}],partyCharacteristic:[{name:'did',value:P.did}]});if(c.code>=300)throw new Error('party org POST -> '+c.code+' '+c.body.slice(0,150));orgId=JSON.parse(c.body).id;}
                      const SD=FACADE+'/participants/'+orgId;
                      const reg=await call('POST',CM+'/v1/participants',{},Object.assign({},P,{selfDescriptionURL:SD}));
                      if(reg.code!==201&&reg.code!==409)throw new Error('POST /participants -> '+reg.code+' '+reg.body.slice(0,150));
                      console.log('participant '+JSON.stringify(P.legalName)+' registered (HTTP '+reg.code+'), SD='+SD);
                      const username=P.legalName.replace(/[^0-9a-zA-Z_]/g,'_');
                      const cr=await call('PUT',ADMIN+'/apisix/admin/consumers',{'x-api-key':KEY},{username:username,plugins:{'jwt-auth':{key:P.legalName,secret:SECRET,algorithm:'HS256'}}});
                      if(cr.code>=300)throw new Error('consumer PUT -> '+cr.code+' '+cr.body.slice(0,150));
                      console.log('consumer '+username+' provisioned');
                    })().catch(e=>{console.error('ERR',e.stack||e.message);process.exit(1);});
              command: ["/bin/sh", "-ec"]
              args:
                - node -e "$REGISTER_JS"
    {{- end }}
