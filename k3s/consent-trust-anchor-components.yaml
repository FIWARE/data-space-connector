# ---------------------------------------------------------------------------
# Consent components overlay for the *trust-anchor* release (charts/trust-anchor).
#
# Layered onto k3s/trust-anchor.yaml in the `consent` maven profile
# (`-f k3s/trust-anchor.yaml -f k3s/consent-trust-anchor-components.yaml`), it
# adds the consent-manager + consent-facade to the trust-anchor release. It is
# purely additive - the trust-anchor release keeps deploying the TIR/TIL as usual.
# The consent-manager stores its data in the release's managed Postgres (database
# `consent_manager`, provisioned by the chart's setup Job).
#
# The IAM that backs consent (keycloak issuer, verifier, did:web helper providing
# the `dataspace-authority.org-tls` secret, the APISIX gateway publishing
# consent-manager.dataspace-authority.org, and the vc-operator minting
# `vc-operator-credential`) is deployed SEPARATELY as the `consent-authority`
# release of the umbrella chart, via k3s/consent-trust-anchor.yaml in the same
# namespace. The facade reads those secrets by name. See doc/CONSENT_MANAGEMENT.md
# for the full topology.
# ---------------------------------------------------------------------------

# --- the consent-manager + the consent-facade (both at the authority) --------
consentManagement:
  enabled: true
  networkPolicy:
    # the provider APISIX, whose consent-filter plugin calls
    # consent-manager.trust-anchor.svc.cluster.local:8080 from the provider namespace
    consentManagerClients:
      - namespace: provider
        podLabels:
          app.kubernetes.io/name: apisix

# The consent-manager, from the published dsc-consent-manager chart (see the
# `consent-manager` dependency in charts/trust-anchor/Chart.yaml). Its database and
# Secrets come from the chart's setup Job and the trust-anchor's managed Postgres.
consent-manager:
  enabled: true
  config:
    # The application's own base url. It is written into the ISO 27560 receipts and the
    # e-mail-verification links, so it has to be the address a data subject can actually
    # reach - the same reasoning as the facade's public `selfUrl` below.
    consentManagerUrl: "https://consent-manager.dataspace-authority.org"
    # the consent-facade runs in this (authority) namespace
    contractServiceUrl: "http://consent-facade.trust-anchor.svc.cluster.local:8080"
    # k3s only. verifier.dataspace-authority.org resolves to 127.0.0.1 inside pods and its
    # ingress cert is signed by the cluster CA, which the chart cannot mount. So the
    # discovery and JWKS fetches go through the squid proxy, as for every other component,
    # and skip the in-cluster TLS peer check (tokens are still verified against the JWKS).
    # The contract-service client stays DIRECT: the consent-facade NetworkPolicy admits
    # only consent-manager pods, not squid. That exemption needs consent-manager 0.0.2 or
    # newer - before that, the client inherited the global proxy address alongside the
    # DIRECT type and failed every request. A verifier with a publicly trusted cert needs
    # none of these.
    extraEnv:
      MICRONAUT_HTTP_CLIENT_PROXY_TYPE: HTTP
      MICRONAUT_HTTP_CLIENT_PROXY_ADDRESS: squid-proxy.infra.svc.cluster.local:8888
      MICRONAUT_HTTP_SERVICES_CONTRACT_SERVICE_PROXY_TYPE: DIRECT
      MICRONAUT_HTTP_CLIENT_SSL_INSECURE_TRUST_ALL_CERTIFICATES: "true"
  ## Every caller - data subject or participant - presents an access token of the
  ## authority's verifier (k3s/consent-trust-anchor.yaml, service `consent-manager`).
  identityProviders:
    primary:
      # The verifier stamps its bare `server.host` as the token `iss`; the app compares it
      # byte-for-byte with the discovery document's `issuer`.
      issuer: https://verifier.dataspace-authority.org
      # the verifier serves OIDC discovery only under the per-service path
      discoveryUrl: https://verifier.dataspace-authority.org/services/consent-manager/.well-known/openid-configuration
      # the verifier service id, which the verifier puts into `aud`
      audience: consent-manager
      # The claim contract of the verifier's `consent-manager` service (flat, top-level
      # claims; see k3s/consent-trust-anchor.yaml): `roles` is the credential's `type`
      # array, `participant_id` the MembershipCredential's issuer DID.
      claims:
        userIdentifier: [sub]
        participantIdentifier: [participant_id]
        roles: [roles]
      # The credential type is the role; the verifier already pins the type per scope.
      # `catalog` keeps the chart default, spelled out here: no credential carries it.
      roleMapping:
        user: UserCredential
        participant: MembershipCredential
        catalog: consent-catalog
  deployment:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# The consent-facade, from its own published chart (see the `consent-facade` dependency
# in charts/trust-anchor/Chart.yaml). It fronts multiple providers and authenticates its
# outbound TM Forum calls to each provider's OID4VP-protected mp-tmf-api as
# did:web:dataspace-authority.org, using the holder key + issued OperatorCredential
# provisioned by the authority issuer (in the consent-authority release).
consent-facade:
  enabled: true
  ## the provider's OID4VP-protected TM Forum ingress. Reached in-cluster through the
  ## squid proxy (see oid4vp.proxy); its self-signed cert is trusted via dsc-ca.
  tmForum:
    url: "https://mp-tmf-api.127.0.0.1.nip.io"
  # The ids the facade mints (participant self-descriptions, catalog data resources)
  # travel into privacy notices and ISO 27560 consent receipts, so they must be PUBLIC,
  # dereferenceable URLs - a data subject, an auditor or another participant has to be
  # able to resolve them. Hence the public ingress host, not the cluster-internal service
  # name. The consent-manager still reaches them in-cluster (through the squid proxy,
  # trusting the cluster CA), and the provider-side owner-resolver rewrites the host to
  # its local facade instance while keeping these ids.
  selfUrl: "https://consent-facade.dataspace-authority.org"
  # Publish ONLY the self-description reads. /verify, /bilaterals and /contracts stay
  # internal: they expose which participants hold contracts with each other, and the
  # facade has no authentication of its own.
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/common-name: "consent-facade.dataspace-authority.org"
      cert-manager.io/alt-names: "consent-facade.dataspace-authority.org"
    hosts:
      - host: consent-facade.dataspace-authority.org
        paths:
          - /participants
          - /catalog
    tls:
      - secretName: consent-facade.dataspace-authority.org-tls
        hosts:
          - consent-facade.dataspace-authority.org
  oid4vp:
    # present the OperatorCredential (holder did:web:dataspace-authority.org) to obtain an
    # access token for mp-tmf-api. Holder key + credential + dsc-ca come from the
    # dataspace-authority.org-tls and vc-operator-credential secrets, both created by the
    # consent-authority release in this namespace.
    enabled: true
    # the verifier SERVICE id registered for the DSC TM Forum api (the verifier looks the
    # service up by client_id; this is not the holder DID)
    clientId: "tmf-api"
    # scopes requested for TM Forum access
    scopes:
      - default
    # trust anchors for client identification (the verifier's chain). The dsc-ca is mounted
    # as a PEM at this path by deployment.additionalVolumeMounts below.
    trustAnchors:
      - /etc/ssl/cacert.pem
    # folder the credential is projected into
    credentialsFolder: /credential-repo
    holder:
      id: did:web:dataspace-authority.org
      # the algorithm the verifiable presentation is signed with
      signatureAlgorithm: ECDH-ES
    signingKey:
      secretName: dataspace-authority.org-tls
    # the OperatorCredential the authority's keycloak issues via the vc-operator; the
    # provider's odrl-pap grants /tmf-api read to holders of exactly this credential type
    # (see the authorize-facade-tmf-read Job in k3s/consent-provider.yaml)
    credentials:
      - secretName: vc-operator-credential
        secretKey: credential
        fileName: operator-credential.jwt
    proxy:
      enabled: true
      host: squid-proxy.infra.svc.cluster.local
      port: 8888
      # this facade reads the provider's EXTERNAL mp-tmf-api ingress, which only resolves
      # through the proxy - so the TM Forum clients go through it too
      tmForumClients: true
  truststore:
    enabled: true
    caSecret:
      name: dataspace-authority.org-tls
  deployment:
    # the image runs as uid 185 (UBI openjdk)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 185
      runAsGroup: 0
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 185
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    # The dsc-ca as a PEM file at the path `oid4vp.trustAnchors` names. The chart's
    # `truststore` imports the same CA into the JVM truststore (for every TLS client),
    # while OID4VP client identification reads it as a PEM from this path.
    additionalVolumes:
      - name: root-ca
        secret:
          secretName: dataspace-authority.org-tls
          items:
            - key: ca.crt
              path: ca.crt
    additionalVolumeMounts:
      - name: root-ca
        mountPath: /etc/ssl/cacert.pem
        subPath: ca.crt
        readOnly: true
