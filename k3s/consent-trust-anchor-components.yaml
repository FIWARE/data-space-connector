# ---------------------------------------------------------------------------
# Consent components overlay for the *trust-anchor* release (charts/trust-anchor).
#
# Layered onto k3s/trust-anchor.yaml in the `consent` maven profile
# (`-f k3s/trust-anchor.yaml -f k3s/consent-trust-anchor-components.yaml`), it
# adds the consent-manager + consent-facade + their managed MongoDB to the
# trust-anchor release. It is purely additive - the trust-anchor release keeps
# deploying the TIR/TIL as usual.
#
# The IAM that backs consent (keycloak issuer, did:web helper providing the
# `dataspace-authority.org-tls` secret, the APISIX facade route, and the
# vc-operator minting `vc-operator-credential`) is deployed SEPARATELY as the
# `consent-authority` release of the umbrella chart, via k3s/consent-trust-anchor.yaml
# in the same namespace. The facade reads those secrets by name; the APISIX route
# reads the consentKey from consent-manager-secret (created here) by name. See
# doc/CONSENT_MANAGEMENT.md for the full topology.
#
# The MongoDB community operator is NOT a dependency of the trust-anchor chart;
# it is installed cluster-wide (k3s/mongo-operator.yaml, watchNamespace "*") and
# reconciles the MongoDBCommunity resource declared here.
# ---------------------------------------------------------------------------

# --- managed MongoDB replica set for the consent-manager --------------------
managedMongo:
  enabled: true

# --- the consent-manager + the consent-facade (both at the authority) --------
consentManagement:
  enabled: true
  consentManager:
    enabled: true
    # the consent-facade runs in this (authority) namespace
    contractServiceBaseUrl: "http://consent-facade.trust-anchor.svc.cluster.local:8080"
    # trust the subject verifier's OID4VP access tokens: the consent-manager verifies them via OIDC
    # discovery + JWKS and maps the token `sub` (the holder DID) to a local User/UserIdentifier. This
    # lets a data subject authenticate to the consent-manager DIRECTLY (no facade, no x-user-key).
    externalIdp:
      enabled: true
      # the authority's own verifier (deployed by k3s/consent-trust-anchor.yaml,
      # decentralizedIam.vcAuthentication.vcverifier). The verifier stamps its bare `server.host`
      # (https://verifier.dataspace-authority.org) as the token `iss`, so that exact host is the
      # trusted issuer. It serves OIDC discovery only under the per-service path, so we point the
      # consent-manager's discovery at `/services/consent-manager/.well-known/openid-configuration`
      # via `discoveryPath` while `issuers` stays the bare host that matches the token `iss`.
      issuers:
        - https://verifier.dataspace-authority.org
      discoveryPath: /services/consent-manager/.well-known/openid-configuration
      # must equal the `aud` the verifier puts in the issued token (the verifier service id) - decode
      # a real access token (cut -d. -f2 | base64 -d) to confirm, and adjust if verification fails.
      # One value for both kinds of caller: the data SUBJECT and a PARTICIPANT authenticate
      # to the same relying party and are separated by verifier SCOPE, not by service - see
      # the `consent-manager` verifier service in k3s/consent-trust-anchor.yaml (scopes
      # `openid` for the subject's UserCredential, `participant` for a participant's
      # MembershipCredential). Both tokens therefore carry aud=consent-manager.
      audience: consent-manager
      # the verifier ingress resolves to 127.0.0.1 in the local cluster, so route the consent-manager's
      # discovery + JWKS fetches through the squid proxy
      proxy: http://squid-proxy.infra.svc.cluster.local:8888
      # trust the cluster CA (selfsigned-ca) that signs the verifier's ingress cert. We mount it from
      # the did-helper's dataspace-authority.org-tls secret rather than the verifier ingress cert
      # itself: it holds the same CA root, is created early (the consent-facade already mounts it),
      # and so does not couple the consent-manager's start to the late verifier ingress cert.
      caSecret:
        name: dataspace-authority.org-tls
        key: ca.crt
  # seeded into consent-manager-secret; the consent-manager validates it and the
  # authority's APISIX facade route injects the same value ($env://CONSENT_KEY),
  # reading it from consent-manager-secret by name.
  consentKey: "changeme-consent-key"

# The consent-facade, from its own published chart (see the `consent-facade` dependency
# in charts/trust-anchor/Chart.yaml). It fronts multiple providers and authenticates its
# outbound TM Forum calls to each provider's OID4VP-protected mp-tmf-api as
# did:web:dataspace-authority.org, using the holder key + issued OperatorCredential
# provisioned by the authority issuer (in the consent-authority release).
consent-facade:
  enabled: true
  ## the provider's OID4VP-protected TM Forum ingress. Reached in-cluster through the
  ## squid proxy (see oid4vp.proxy); its self-signed cert is trusted via dsc-ca.
  tmForum:
    url: "https://mp-tmf-api.127.0.0.1.nip.io"
  # The ids the facade mints (participant self-descriptions, catalog data resources)
  # travel into privacy notices and ISO 27560 consent receipts, so they must be PUBLIC,
  # dereferenceable URLs - a data subject, an auditor or another participant has to be
  # able to resolve them. Hence the public ingress host, not the cluster-internal service
  # name. The consent-manager still reaches them in-cluster (through the squid proxy,
  # trusting the cluster CA), and the provider-side owner-resolver rewrites the host to
  # its local facade instance while keeping these ids.
  selfUrl: "https://consent-facade.dataspace-authority.org"
  # Publish ONLY the self-description reads. /verify, /bilaterals and /contracts stay
  # internal: they expose which participants hold contracts with each other, and the
  # facade has no authentication of its own.
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      cert-manager.io/private-key-algorithm: "ECDSA"
      cert-manager.io/common-name: "consent-facade.dataspace-authority.org"
      cert-manager.io/alt-names: "consent-facade.dataspace-authority.org"
    hosts:
      - host: consent-facade.dataspace-authority.org
        paths:
          - /participants
          - /catalog
    tls:
      - secretName: consent-facade.dataspace-authority.org-tls
        hosts:
          - consent-facade.dataspace-authority.org
  oid4vp:
    # present the OperatorCredential (holder did:web:dataspace-authority.org) to obtain an
    # access token for mp-tmf-api. Holder key + credential + dsc-ca come from the
    # dataspace-authority.org-tls and vc-operator-credential secrets, both created by the
    # consent-authority release in this namespace.
    enabled: true
    holder:
      id: did:web:dataspace-authority.org
    signingKey:
      secretName: dataspace-authority.org-tls
    proxy:
      enabled: true
  truststore:
    enabled: true
    caSecret:
      name: dataspace-authority.org-tls
  deployment:
    # The dsc-ca as a PEM file at the path `oid4vp.trustAnchors` names. The chart's
    # `truststore` imports the same CA into the JVM truststore (for every TLS client),
    # while OID4VP client identification reads it as a PEM from this path.
    additionalVolumes:
      - name: root-ca
        secret:
          secretName: dataspace-authority.org-tls
          items:
            - key: ca.crt
              path: ca.crt
    additionalVolumeMounts:
      - name: root-ca
        mountPath: /etc/ssl/cacert.pem
        subPath: ca.crt
        readOnly: true
