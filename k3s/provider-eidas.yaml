  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: eidas-trust-list-mock
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: eidas-trust-list-mock
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: eidas-trust-list-mock
      template:
        metadata:
          labels:
            app.kubernetes.io/name: eidas-trust-list-mock
        spec:
          containers:
            - name: static
              image: lipanski/docker-static-website:2.1.0
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 3000
                  name: http
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: trust-lists
                  mountPath: /home/static/lotl.xml
                  subPath: lotl.xml
                - name: trust-lists
                  mountPath: /home/static/tl-de.xml
                  subPath: tl-de.xml
          volumes:
            - name: trust-lists
              configMap:
                name: eidas-trust-list-mock
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: eidas-trust-list-mock
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: eidas-trust-list-mock
    spec:
      selector:
        app.kubernetes.io/name: eidas-trust-list-mock
      ports:
        - name: http
          port: 3000
          targetPort: 3000
