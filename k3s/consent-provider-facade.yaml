# ---------------------------------------------------------------------------
# The PROVIDER's own consent-facade instance, deployed as a second release of
# charts/trust-anchor into the `provider` namespace.
#
# Why a separate release of that chart rather than a hand-written manifest in
# k3s/consent-provider.yaml (which is what this replaces): the facade needs the
# full OID4VP holder wiring - a PKCS#8 key conversion init container, the dsc-ca
# imported into the JVM truststore, the credential volume, a dozen OID4VP env
# vars - and that is already implemented, and exercised, by the chart's
# consent-facade template. Duplicating it drifts. This mirrors how the authority
# already runs two releases (trust-anchor + consent-authority) in one namespace.
#
# This instance serves two purposes for the provider:
#
#   1. CONTRACT LOOKUP for the owner-resolver: it projects the provider's own
#      TMForum agreements, so the resolver can find the governing contract and its
#      ODRL asset target. Reads are in-namespace, no OID4VP needed for them.
#   2. OID4VP TOKEN SERVICE for the consent-plugin: POST /internal/tokens mints an
#      access token for the authority's consent-manager, so the plugin holds no
#      participant credential of its own. See doc/CONSENT_MANAGEMENT.md.
# ---------------------------------------------------------------------------

# Everything else the trust-anchor chart ships is the AUTHORITY's business and must
# stay off in this release: the provider already runs its own postgres/TIR from the
# umbrella chart, and MongoDB belongs to the consent-manager at the authority.
postgres-operator:
  enabled: false
managedPostgres:
  enabled: false
trusted-issuers-list:
  enabled: false
managedMongo:
  enabled: false

consentManagement:
  enabled: true
  # the consent-manager runs at the AUTHORITY (k3s/consent-trust-anchor*.yaml)
  consentManager:
    enabled: false
  # The chart's policies assume the authority topology (facade reachable only from
  # the consent-manager pod). The provider's callers are its APISIX pods and the
  # owner-resolver, so the policies for this namespace are declared alongside those
  # components in k3s/consent-provider.yaml instead - and both would otherwise
  # create a `consent-facade-ingress` policy of the same name.
  networkPolicy:
    enabled: false
  consentFacade:
    enabled: true
    # the provider's own TMForum api, in-namespace
    tmfApiUrl: http://tm-forum-api-svc:8080
    # The CANONICAL id space contract/catalog ids are minted in. It must equal the
    # AUTHORITY facade's self url, because the consent records reference those ids
    # (Consent.data[].resource): this instance serves the same ids from local data,
    # so a consent recorded against an authority-minted id still matches.
    selfUrl: https://consent-facade.dataspace-authority.org
    # never published - /internal/tokens mints tokens that speak for this participant
    ingress:
      enabled: false
    oid4vp:
      enabled: true
      # tls.key = the holder signing key, ca.crt = the dsc-ca the verifier cert chains to
      didSecretName: mp-operations.org-tls
      holder:
        id: did:web:mp-operations.org
      # the authority verifier's ingress resolves to 127.0.0.1 in the local cluster,
      # so the OID4VP exchange goes through the squid forward proxy
      proxy:
        enabled: true
        # but NOT the TM Forum calls: this provider's TM Forum api is the in-namespace
        # Service tm-forum-api-svc, and squid cannot resolve a cluster-internal name -
        # it answers 500 and every contract lookup fails.
        tmForumClients: false
      # The credential this participant presents: the MembershipCredential its own
      # keycloak issues (issuerDid did:web:mp-operations.org), kept fresh in
      # vc-fdsc-edc-credential by the provider's vc-operator. The authority verifier
      # trusts it because that issuer DID is registered in the trust-anchor TIR.
      credentials:
        - secretName: vc-fdsc-edc-credential
          secretKey: credential
          fileName: membership-credential.jwt
      # what the plugin may ask for. `clientId` is the verifier SERVICE and `scope`
      # selects its credential policy - `participant` accepts the MembershipCredential
      # this provider's own keycloak issues (see k3s/consent-trust-anchor.yaml).
      tokenTargets:
        - audience: consent-manager
          url: https://verifier.dataspace-authority.org
          clientId: consent-manager
          scope: ["participant"]
          # the verifier serves OIDC discovery per service, not at its root - asking at
          # the root returns a 404 the OID4VP client tries to parse as the config document
          discoveryPath: /services/consent-manager
