apiVersion: v1
kind: Service
metadata:
  name: traefik-admin
  namespace: infra
  labels:
    app.kubernetes.io/name: traefik
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: admin
      port: 80
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-loadbalancer
  namespace: infra
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    # the default ports as well: CoreDNS resolves every *.127.0.0.1.nip.io host to this Service,
    # so a pod that calls https://<host> without a proxy reaches the ingress, as it would through
    # a public load balancer
    - name: http-default
      port: 80
      targetPort: http
    - name: https-default
      port: 443
      targetPort: https