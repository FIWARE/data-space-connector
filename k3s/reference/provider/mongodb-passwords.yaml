# The marketplace's MongoDB passwords (provider-marketplace.yaml sets generatePasswords: false),
# with test values.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-admin-password
      namespace: provider
    type: Opaque
    stringData:
      password: reference-mongodb-admin
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-charging-password
      namespace: provider
    type: Opaque
    stringData:
      password: reference-mongodb-charging
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-belp-password
      namespace: provider
    type: Opaque
    stringData:
      password: reference-mongodb-belp
