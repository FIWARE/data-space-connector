# Question-model bundle of chart 10.16.0: recognition rules, the feature catalogue and the role presets
# (ADR 0017). The role guide's component matrix is authoritative; internal/model/rolematrix_test.go
# keeps roles and roleMatrix in agreement with it. Value rules come with Epic 3's questions.
chart: data-space-connector
version: 10.16.0
revision: 2
topLevelKeys: [
  nameOverride, fullnameOverride, imagePullSecrets, issuance, decentralizedIam, scorpio, elsi,
  keycloak, tm-forum-api, statusListServer, rainbow, contract-management, did, registration,
  dataSpaceConfig, mongo-operator, managedMongo, marketplace, fdsc-edc, vcCredentials, vc-operator,
  identityhub, vault, cert-manager, certManagerResources, extraManifests, fdsc-dashboard,
  prometheus, grafana, tracing, opentelemetry-operator, opentelemetry-collector, tempo,
  consentManagement, consent-facade, consent-owner-resolver]
recognize:
  - {path: did.enabled, answer: identity.did.enabled, stage: features, kind: toggle}
  - {path: statusListServer.enabled, answer: identity.statuslist.enabled, stage: features, kind: toggle}
  - {path: keycloak.realm.wallets.enabled, answer: identity.wallets.enabled, stage: features, kind: toggle}
  - {path: scorpio.enabled, answer: data.scorpio.enabled, stage: features, kind: toggle}
  - {path: tm-forum-api.enabled, answer: contract.tmforum.enabled, stage: features, kind: toggle}
  - {path: marketplace.enabled, answer: market.local.enabled, stage: features, kind: toggle}
  - {path: rainbow.enabled, answer: dsp.rainbow.enabled, stage: features, kind: toggle}
  - {path: dataSpaceConfig.enabled, answer: dsp.config.enabled, stage: features, kind: toggle}
features:
  - {id: identity.issuer, title: Credential issuance, group: identity, keys: [keycloak, vcCredentials],
     summary: "Issue Verifiable Credentials to your users (Keycloak, OID4VCI)"}
  - {id: identity.did, title: DID document, group: identity, keys: [did],
     summary: "Publish the organization's DID document (did:web/did:key)"}
  - {id: identity.statuslist, title: Credential revocation, group: identity, keys: [statusListServer],
     summary: Revoke issued credentials (token status list)}
  - {id: identity.vcoperator, title: Credentials as Kubernetes resources, group: identity, keys: [vc-operator, vcCredentials],
     summary: Manage credential definitions as Kubernetes resources}
  - {id: identity.wallets, title: Wallet clients, group: identity, requires: [identity.issuer],
     keys: [keycloak.realm.wallets], summary: Preset clients for the Lissi and EUDI wallets}
  - {id: identity.eidas, title: eIDAS identity, group: identity, requires: [identity.issuer],
     keys: [elsi, decentralizedIam.vcAuthentication.vcverifier.deployment.eidas],
     summary: eIDAS/ELSI certificate-based identity and validation}
  - {id: access.verification, title: Credential verification, group: access, keys: [decentralizedIam.vcAuthentication],
     summary: "Verify incoming credentials, hand out access tokens (VCVerifier + local Trusted Issuers List)"}
  - {id: access.policies, title: Policy enforcement, group: access, keys: [decentralizedIam.odrlAuthorization],
     summary: Enforce ODRL policies on every request (APISIX + OPA + ODRL-PAP)}
  - {id: data.scorpio, title: NGSI-LD data service, group: data, keys: [scorpio],
     summary: An NGSI-LD context broker as the data service}
  - {id: data.external, title: Your own data services, group: data, requires: [access.policies],
     keys: [decentralizedIam.odrlAuthorization.apisix.routes], summary: Protect data services you run yourself}
  - {id: contract.tmforum, title: TMForum contract APIs, group: contracts, keys: [tm-forum-api],
     summary: TMForum product/contract APIs}
  - {id: contract.management, title: Contract management, group: contracts, requires: [contract.tmforum, access.policies],
     keys: [contract-management], summary: Turn orders into access policies automatically}
  - {id: market.local, title: Local marketplace, group: marketplace, requires: [contract.tmforum],
     keys: [marketplace], summary: A marketplace of your own (BAE)}
  - {id: market.central, title: Central marketplace, group: marketplace, requires: [contract.tmforum],
     keys: [contract-management], summary: "Publish into the data space's central marketplace"}
  - {id: dsp.edc, title: Dataspace Protocol (DSP), group: interop, keys: [fdsc-edc, identityhub, registration],
     summary: "Dataspace Protocol via EDC, with DCP identity (IdentityHub)"}
  - {id: dsp.rainbow, title: Rainbow DSP, group: interop, keys: [rainbow],
     summary: The Rust DSP implementation (Rainbow)}
  - {id: dsp.config, title: Data space configuration, group: interop, keys: [dataSpaceConfig],
     summary: Serve /.well-known/data-space-configuration}
  - {id: consent.provider, title: Consent enforcement, group: consent, requires: [access.policies],
     keys: [consent-facade, consent-owner-resolver], summary: Enforce data-subject consent on provider APIs}
  - {id: consent.authority, title: Consent authority, group: consent, chart: trust-anchor,
     keys: [consentManagement, consent-manager, consent-facade], summary: "Run the data space's consent manager"}
  - {id: ta.registry, title: Trusted Issuers Registry, group: operator, chart: trust-anchor, keys: [trusted-issuers-list],
     summary: Trusted Issuers Registry + Trusted Issuers List API}
  - {id: ta.onboarding, title: Participant onboarding, group: operator, chart: trust-anchor,
     keys: [trusted-issuers-list.ingress.til], summary: Participant onboarding}
  - {id: obs.tracing, title: Tracing, group: observability,
     keys: [tracing, opentelemetry-collector, opentelemetry-operator], summary: Distributed traces from every component}
  - {id: obs.traceStore, title: Trace store, group: observability, keys: [tempo, grafana],
     summary: Store and browse traces (Tempo + Grafana)}
  - {id: obs.metrics, title: Metrics, group: observability, keys: [prometheus, grafana, fdsc-dashboard],
     summary: Metrics and dashboards}
# Floors: measured footprint without load, doc/deployment-integration/roles/PREREQUISITES.md#sizing.
# consumer-provider has no row there and takes the provider's.
roles:
  - id: consumer
    title: Consumer
    summary: Uses data and services offered by others.
    chart: data-space-connector
    floor: {memory: 0.8Gi, cpu: 50m, measuredWith: 10.13.2}
    docs: doc/deployment-integration/roles/consumer/README.md
    features:
      identity.issuer: recommended
      identity.did: recommended
      identity.statuslist: available
      identity.vcoperator: available
      identity.wallets: available
      identity.eidas: available
      access.verification: not-offered
      access.policies: not-offered
      data.scorpio: not-offered
      data.external: not-offered
      contract.tmforum: not-offered
      contract.management: not-offered
      market.local: not-offered
      market.central: not-offered
      dsp.edc: available
      dsp.rainbow: available
      dsp.config: available
      consent.provider: not-offered
      consent.authority: not-offered
      ta.registry: not-offered
      ta.onboarding: not-offered
      obs.tracing: available
      obs.traceStore: available
      obs.metrics: available
  - id: provider
