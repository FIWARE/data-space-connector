      identity.issuer: recommended
      identity.did: recommended
      identity.statuslist: available
      identity.vcoperator: available
      identity.wallets: available
      identity.eidas: available
      access.verification: recommended
      access.policies: recommended
      data.scorpio: recommended
      data.external: available
      contract.tmforum: available
      contract.management: available
      market.local: available
      market.central: available
      dsp.edc: available
      dsp.rainbow: available
      dsp.config: available
      consent.provider: available
      consent.authority: not-offered
      ta.registry: not-offered
      ta.onboarding: not-offered
      obs.tracing: available
      obs.traceStore: available
      obs.metrics: available
  - id: consumer-provider
    title: Consumer + Provider
    summary: Both. The common case in a real data space.
    chart: data-space-connector
    floor: {memory: 2.3Gi, cpu: 200m, measuredWith: 10.13.2}
    docs: doc/deployment-integration/roles/consumer-provider/README.md
    features:
      identity.issuer: recommended
      identity.did: recommended
      identity.statuslist: available
      identity.vcoperator: available
      identity.wallets: available
      identity.eidas: available
      access.verification: recommended
      access.policies: recommended
      data.scorpio: recommended
      data.external: available
      contract.tmforum: available
      contract.management: available
      market.local: available
      market.central: available
      dsp.edc: available
      dsp.rainbow: available
      dsp.config: available
      consent.provider: available
      consent.authority: not-offered
      ta.registry: not-offered
      ta.onboarding: not-offered
      obs.tracing: available
      obs.traceStore: available
      obs.metrics: available
  - id: operator
    title: Operator
    summary: Runs the trust infrastructure of the data space.
    chart: trust-anchor
    floor: {memory: 0.3Gi, cpu: 20m, measuredWith: 1.3.0}
    docs: doc/deployment-integration/roles/operator/README.md
    features:
      identity.issuer: not-offered
      identity.did: not-offered
      identity.statuslist: not-offered
      identity.vcoperator: not-offered
      identity.wallets: not-offered
      identity.eidas: not-offered
      access.verification: not-offered
      access.policies: not-offered
      data.scorpio: not-offered
      data.external: not-offered
      contract.tmforum: not-offered
      contract.management: not-offered
      market.local: not-offered
      market.central: not-offered
      dsp.edc: not-offered
      dsp.rainbow: not-offered
      dsp.config: not-offered
      consent.provider: not-offered
      consent.authority: available
      ta.registry: recommended
      ta.onboarding: available
      obs.tracing: not-offered
      obs.traceStore: not-offered
      obs.metrics: not-offered
  - id: custom
    title: Custom
    summary: Nothing preselected. Pick from the whole catalogue yourself.
    chart: data-space-connector
    docs: doc/deployment-integration/roles/README.md#component-matrix
