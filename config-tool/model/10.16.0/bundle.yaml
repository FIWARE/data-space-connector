    doc: doc/deployment-integration/roles/provider/README.md#contract-management
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[4].host', fn: copy, args: ["{{ .host.contractManagement }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[4].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].hosts[4]', fn: copy, args: ["{{ .host.contractManagement }}"]}
  - id: host.dsp
    stage: foundations
    type: hostname
    features: [access.policies, dsp.edc]
    default: "dsp.{{ .domain.base }}"
    label: Dataspace Protocol host
    help: The Dataspace Protocol endpoint of FDSC-EDC.
