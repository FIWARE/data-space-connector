  - id: resources.profile
    stage: foundations
    group: platform
    type: choice
    default: "{{ .target.environment }}"
    label: Resource profile
    help: >-
      The CPU and memory requests and limits of the Java components. It follows the environment chosen on Target
      unless you pick another.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#set-memory-limits-on-the-java-components
    options:
      - value: development
        label: Development
        note: Small requests that fit a single node, with limits that leave room for the JVM's start-up.
      - value: production
        label: Production
        note: Memory request equal to the limit, so the scheduler reserves what the JVM may take.
      - value: custom
        label: Custom
        note: Leaves the chart's defaults; you size the components yourself.
  # The proxy group (ADR 0025): proxy.https switches it, so neither the other two derive nor any target renders
  # without it. No target renders without proxy.no either, so a proxy never goes out without its NO_PROXY (an
  # unanswered release name or namespace leaves the default underived). Keycloak reads the env vars the umbrella's keycloak.proxy sets only while spiProxyMappings is empty.
  - id: proxy.https
    stage: foundations
    group: egress
    type: url
    label: HTTPS proxy
    help: >-
      The forward proxy the components use for outbound HTTPS calls, such as http://proxy.infra.svc.cluster.local:3128.
      The verifier, Keycloak, the marketplace, the vc-operator and APISIX's openid-connect routes get it. Leave it
      empty when the cluster reaches the internet directly.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#outbound-access
    targets:
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalEnvVars
        element: {key: HTTPS_PROXY, value: {value: "{{ .proxy.https }}"}}
        requires: [proxy.no]
      - {path: keycloak.proxy.enabled, fn: const, args: [true], requires: [proxy.https, proxy.no]}
      - {path: keycloak.proxy.httpsProxy, fn: copy, args: ["{{ .proxy.https }}"], requires: [proxy.no]}
      - path: marketplace.bizEcosystemLogicProxy.additionalEnvVars
        element: {key: HTTPS_PROXY, value: {value: "{{ .proxy.https }}"}}
        requires: [proxy.no]
      - path: vc-operator.extraEnvVars
        element: {key: HTTPS_PROXY, value: {value: "{{ .proxy.https }}"}}
        requires: [proxy.no]
      - {path: decentralizedIam.odrlAuthorization.apisix.routes, each: plugins.openid-connect.proxy_opts.https_proxy,
         within: plugins.openid-connect, fn: copy, args: ["{{ .proxy.https }}"], requires: [proxy.no]}
  - id: proxy.http
    stage: foundations
    group: egress
    type: url
    default: "{{ .proxy.https }}"
    defaultWhen: {id: proxy.https, set: true}
    label: HTTP proxy
    help: The forward proxy for plain HTTP calls. It follows the HTTPS proxy unless you set another.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#outbound-access
    targets:
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalEnvVars
        element: {key: HTTP_PROXY, value: {value: "{{ .proxy.http }}"}}
        requires: [proxy.https, proxy.no]
      - {path: keycloak.proxy.httpProxy, fn: copy, args: ["{{ .proxy.http }}"], requires: [proxy.https, proxy.no]}
      - path: marketplace.bizEcosystemLogicProxy.additionalEnvVars
        element: {key: HTTP_PROXY, value: {value: "{{ .proxy.http }}"}}
        requires: [proxy.https, proxy.no]
      - path: vc-operator.extraEnvVars
        element: {key: HTTP_PROXY, value: {value: "{{ .proxy.http }}"}}
        requires: [proxy.https, proxy.no]
      - {path: decentralizedIam.odrlAuthorization.apisix.routes, each: plugins.openid-connect.proxy_opts.http_proxy,
         within: plugins.openid-connect, fn: copy, args: ["{{ .proxy.http }}"], requires: [proxy.https, proxy.no]}
  # Each client matches NO_PROXY entries differently (ADR 0025), so the default lists every form that one of them
  # reads, then the bare names of the noProxyServices table in its order.
  - id: proxy.no
    stage: foundations
    group: egress
    type: string
    default: >-
      localhost,127.0.0.1,svc,.svc,cluster.local,.cluster.local,{{ .target.namespace }}.svc,credentials-config-service,trusted-issuers-list,tm-forum-api,tm-forum-api-svc,status-list-server,{{ fullname .target.release "keycloak" }},{{ fullname .target.release "opentelemetry-collector" }}
    defaultWhen: {id: proxy.https, set: true}
    label: No proxy
    help: >-
      Comma-separated hosts and domains the components reach directly. The default covers the in-cluster services
      by every form the five clients understand. Only the verifier and the vc-operator read CIDRs, and only for
      calls to an IP address: append the pod and service CIDRs (10.42.0.0/16,10.43.0.0/16 on k3s), or the
      vc-operator reaches the Kubernetes API through the proxy.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#outbound-access
    targets:
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalEnvVars
        element: {key: NO_PROXY, value: {value: "{{ .proxy.no }}"}}
        requires: [proxy.https]
      - {path: keycloak.proxy.noProxy, fn: copy, args: ["{{ .proxy.no }}"], requires: [proxy.https]}
      - path: marketplace.bizEcosystemLogicProxy.additionalEnvVars
        element: {key: NO_PROXY, value: {value: "{{ .proxy.no }}"}}
        requires: [proxy.https]
      - path: vc-operator.extraEnvVars
        element: {key: NO_PROXY, value: {value: "{{ .proxy.no }}"}}
        requires: [proxy.https]
      - {path: decentralizedIam.odrlAuthorization.apisix.routes, each: plugins.openid-connect.proxy_opts.no_proxy,
         within: plugins.openid-connect, fn: copy, args: ["{{ .proxy.no }}"], requires: [proxy.https]}
  # One PEM Secret, key ca.crt, reaches each component through that component's own mechanism (ADR 0025). The
  # element names avoid the vcverifier chart's own caCert names (ca-bundle, custom-ca-volume, add-root-ca).
  - id: ca.privateSecret
    stage: foundations
    group: egress
    type: secretName
    label: Private CA Secret
    help: >-
      The Secret in the release namespace whose key ca.crt holds the PEM bundle of the private CA that signs the
      public hosts. APISIX then trusts only that file, so append the public roots when a route calls a publicly
      signed provider. Leave it empty when every host has a publicly trusted certificate.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#private-ca
    targets:
      - {path: decentralizedIam.odrlAuthorization.apisix.apisix.ssl.existingCASecret, fn: copy, args: ["{{ .ca.privateSecret }}"]}
      - {path: decentralizedIam.odrlAuthorization.apisix.apisix.ssl.certCAFilename, fn: const, args: [ca.crt],
         requires: [ca.privateSecret]}
      # The trust store is written only while the HTTPS listener is on; TLS still ends at the Ingress.
      - {path: decentralizedIam.odrlAuthorization.apisix.apisix.ssl.enabled, fn: const, args: [true],
         requires: [ca.privateSecret]}
      - {path: decentralizedIam.odrlAuthorization.apisix.routes, each: plugins.openid-connect.ssl_verify,
         within: plugins.openid-connect, fn: const, args: [true], requires: [ca.privateSecret]}
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalVolumes
        mechanism: verifier-ca
        element: {key: private-ca, value: {secret: {secretName: "{{ .ca.privateSecret }}", items: [{key: ca.crt, path: ca.crt}]}}}
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalVolumes
        mechanism: verifier-ca
        element: {key: private-ca-bundle, value: {emptyDir: {}}}
        requires: [ca.privateSecret]
      # Go reads /etc/ssl/cert.pem; the bundle replaces it with the system roots plus the private CA.
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalVolumeMounts
        mechanism: verifier-ca
        element: {key: private-ca-bundle, value: {mountPath: /etc/ssl/cert.pem, subPath: cert.pem}}
        requires: [ca.privateSecret]
      # The image is the vcverifier chart's caCert.bundleImage default; internal/render/ca_test.go pins it.
      - path: decentralizedIam.vcAuthentication.vcverifier.deployment.initContainers
        mechanism: verifier-ca
        element:
          key: add-private-ca
          value:
            image: alpine:3.23.3
            command: [sh, -c, cat /etc/ssl/cert.pem /private-ca/ca.crt > /bundle/cert.pem]
            volumeMounts:
              - {name: private-ca, mountPath: /private-ca, readOnly: true}
              - {name: private-ca-bundle, mountPath: /bundle}
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
        requires: [ca.privateSecret]
      # Node 18 adds NODE_EXTRA_CA_CERTS to its bundled roots.
      - path: marketplace.bizEcosystemLogicProxy.extraContainerVolumes
        mechanism: marketplace-ca
        element: {key: private-ca, value: {secret: {secretName: "{{ .ca.privateSecret }}", items: [{key: ca.crt, path: ca.crt}]}}}
      - path: marketplace.bizEcosystemLogicProxy.extraVolumeMounts
        mechanism: marketplace-ca
        element: {key: private-ca, value: {mountPath: /etc/ssl/private-ca, readOnly: true}}
        requires: [ca.privateSecret]
      - path: marketplace.bizEcosystemLogicProxy.additionalEnvVars
        mechanism: marketplace-ca
        element: {key: NODE_EXTRA_CA_CERTS, value: {value: /etc/ssl/private-ca/ca.crt}}
        requires: [ca.privateSecret]
      # Go's SSL_CERT_DIR adds the directory to the default bundle file, where SSL_CERT_FILE would replace it.
      - path: vc-operator.extraVolumes
        mechanism: vc-operator-ca
        element: {key: private-ca, value: {secret: {secretName: "{{ .ca.privateSecret }}", items: [{key: ca.crt, path: ca.crt}]}}}
      - path: vc-operator.extraVolumeMounts
        mechanism: vc-operator-ca
        element: {key: private-ca, value: {mountPath: /etc/ssl/private-ca, readOnly: true}}
        requires: [ca.privateSecret]
      - path: vc-operator.extraEnvVars
        mechanism: vc-operator-ca
        element: {key: SSL_CERT_DIR, value: {value: /etc/ssl/private-ca}}
        requires: [ca.privateSecret]
      # truststore-paths is the outgoing trust and takes PEM; tls.truststore* only checks inbound mTLS clients.
      - path: keycloak.extraVolumes
        mechanism: keycloak-ca
        element: {key: private-ca, value: {secret: {secretName: "{{ .ca.privateSecret }}", items: [{key: ca.crt, path: private-ca.pem}]}}}
      - path: keycloak.extraVolumeMounts
        mechanism: keycloak-ca
        element: {key: private-ca, value: {mountPath: /opt/keycloak/conf/truststores/private-ca.pem, subPath: private-ca.pem, readOnly: true}}
        requires: [ca.privateSecret]
      - path: keycloak.extraEnvVars
        mechanism: keycloak-ca
        element: {key: KC_TRUSTSTORE_PATHS, value: {value: /opt/keycloak/conf/truststores/private-ca.pem}}
        requires: [ca.privateSecret]
