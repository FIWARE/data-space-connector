# Question-model bundle of chart 10.16.0: recognition rules, the feature catalogue and the role presets
# (ADR 0017). The role guide's component matrix is authoritative; internal/model/rolematrix_test.go
# keeps roles and roleMatrix in agreement with it.
#
# The foundations list (ADR 0020) holds the cross-cutting answers of Stage 3 and the chart keys they reach:
#   id       dotted answer id (domain.base): the key in the profile's answers, open field answers.<id>
#   type     string | hostname | domain | did | url | secretName, each checked with one pattern; choice, one of its
#            options;
#            bool, true or false; credentialTypes, a list of {type, description?}. Only copy writes a bool or a list
#   group    organization | dataspace | network (default) | platform | egress: the Stage 3 panel that asks it
#   options  a choice's {value, label, note}; note is optional text shown at the point of choice
#   default  a template over other answers; the answer is derived only while all of them are answered.
#            Only a choice may have a constant default, which must be one of its options. A default may also
#            read the reserved target.environment, target.release and target.namespace (Stage 1), which no
#            foundation declares and no target reads
#   defaultWhen {id, equals | set: true}: the default applies only while the resolved answer id equals equals,
#            or while it resolves at all
#   prefix   a template over other answers that the answer, given or derived, must start with
#   targets  {path, fn, args, sep, requires}; a target referencing an unanswered id, or one whose requires are
#            not all resolved, writes nothing. The list forms (ADR 0025):
#            element {key, value}: one element of a list the lists table declares, found by its key field;
#              mechanism names the elements that render together, or not at all after a unique collision or a
#              conflict from the mechanisms table
#            each, within: a key path written into every loaded element of the list at path that holds the
#              mapping within (default: each's parent); it never creates an element
#   features feature ids; display only: Stage 3 hides the foundation while any of them is off. It gates
#            neither the render nor the rules (US-5.3). A host lists the feature whose keys cover its ingress,
#            plus, behind APISIX, the feature that deploys the route's upstream
# Templates are Go text/template holding only text and {{ .id }} actions, plus {{ fullname .ref "chart" }}:
# Helm's standard fullname of a release's chart. The target fns:
#   tpl    renders its one template arg
#   join   renders every template arg and joins the results with sep
#   copy   takes the answer its one {{ .id }} arg names, keeping its type
#   const  writes its one scalar arg verbatim; only under a list index, to complete an owned list, or with requires
# Helm replaces a list instead of merging it, so a path indexes into a list only when the targets write
# that list whole: indices 0..n-1 and every key of every element. Quote a path in a flow mapping: a plain
# scalar there cannot hold '[' or ','. internal/render/provider_test.go checks the targets against k3s/provider.yaml.
#
# The resources table (ADR 0024) sizes the Java components per value of the choice foundation answer:
#   measuredOn  the chart version PREREQUISITES.md#sizing measured the figures on; doc links that guidance
#   components  {id, label, path, enabledKeys, fallbackPaths?, chartMemoryLimit?}: path is the resources block;
#               enabledKeys maps every switch that must be true for the component to deploy to its chart default;
#               chartMemoryLimit is the memory limit the chart sets when the values set none
#   unsized     the other JVM workloads, in the same form; no profile sizes them, so their path may hold one '*'
#               segment for every key of a map, covered by a limit under any of fallbackPaths
#   profiles    <option>: {<component id>: {requests: {cpu, memory}, limits: {cpu, memory}}}, every component of
#               components in every row; an option without a row (custom) sizes nothing
#
# The rules list (ADR 0021) holds the L2 rules: a finding on field while every when holds.
#   severity  warning (shown, never blocks) | error (blocks generate)
#   stage     the stage that shows field; it labels and links the finding
#   field     target.environment or answers.<foundation id>, the open field the finding points at
#   when      [{field, equals | unset: true}]: all must hold over the resolved answers, so a derived default counts;
#             field may also be features.<feature id> (equals on|off, absent is off); unset takes answers.<id> only
#   distinct  {prefix}, instead of field and when: an error per pair of hostname foundations whose id starts with
#             prefix (ending in a dot) and that resolve to the same host, ignoring case and a trailing dot. The
#             message may use {{ .first }}, {{ .second }} (the pair's labels) and {{ .host }}
#   didWebHost {did, host}, instead of field and when: a finding when the did:web DID's host (decoded, without port)
#             is not the resolved host foundation. Neither kind reads features: every host renders whatever the role
#   memoryLimit {components}, with field and when as its precondition: one finding naming every listed component
#             of the resources table that deploys and ends up without a memory limit (rendered, loaded, a fallback
#             path or chartMemoryLimit, which a loaded null drops). The message may use {{ .components }}
chart: data-space-connector
version: 10.16.0
revision: 16
topLevelKeys: [
  nameOverride, fullnameOverride, imagePullSecrets, issuance, decentralizedIam, scorpio, elsi,
  keycloak, tm-forum-api, statusListServer, rainbow, contract-management, did, registration,
  dataSpaceConfig, mongo-operator, managedMongo, marketplace, fdsc-edc, vcCredentials, vc-operator,
  identityhub, vault, cert-manager, certManagerResources, extraManifests, fdsc-dashboard,
  prometheus, grafana, tracing, opentelemetry-operator, opentelemetry-collector, tempo,
  consentManagement, consent-facade, consent-owner-resolver]
recognize:
  - {path: 'did.enabled', answer: identity.did.enabled, stage: features, kind: toggle}
  - {path: 'statusListServer.enabled', answer: identity.statuslist.enabled, stage: features, kind: toggle}
  - {path: 'keycloak.realm.wallets.enabled', answer: identity.wallets.enabled, stage: features, kind: toggle}
  - {path: 'scorpio.enabled', answer: data.scorpio.enabled, stage: features, kind: toggle}
  - {path: 'tm-forum-api.enabled', answer: contract.tmforum.enabled, stage: features, kind: toggle}
  - {path: 'marketplace.enabled', answer: market.local.enabled, stage: features, kind: toggle}
  - {path: 'rainbow.enabled', answer: dsp.rainbow.enabled, stage: features, kind: toggle}
  - {path: 'dataSpaceConfig.enabled', answer: dsp.config.enabled, stage: features, kind: toggle}
  # A loaded TIR address answers its foundation, so the leaf re-renders instead of being pinned (ADR 0022).
  - {path: 'decentralizedIam.vcAuthentication.vcverifier.deployment.verifier.tirAddress', answer: dataspace.tirAddress,
     stage: foundations, kind: value}
features:
  - {id: identity.issuer, title: Credential issuance, group: identity, keys: [keycloak, vcCredentials],
     summary: "Issue Verifiable Credentials to your users (Keycloak, OID4VCI)",
     consequence: "Without credential issuance your users cannot get Verifiable Credentials to prove who they are."}
  - {id: identity.did, title: DID document, group: identity, keys: [did],
     summary: "Publish the organization's DID document (did:web/did:key)",
     consequence: "Without a DID document other participants cannot resolve your identity or verify what you sign."}
  - {id: identity.statuslist, title: Credential revocation, group: identity, keys: [statusListServer],
     summary: Revoke issued credentials (token status list)}
  - {id: identity.vcoperator, title: Credentials as Kubernetes resources, group: identity, keys: [vc-operator, vcCredentials],
     summary: Manage credential definitions as Kubernetes resources}
  - {id: identity.wallets, title: Wallet clients, group: identity, requires: [identity.issuer],
     keys: [keycloak.realm.wallets], summary: Preset clients for the Lissi and EUDI wallets}
  - {id: identity.eidas, title: eIDAS identity, group: identity, requires: [identity.issuer],
     keys: [elsi, decentralizedIam.vcAuthentication.vcverifier.deployment.eidas],
     summary: eIDAS/ELSI certificate-based identity and validation}
  - {id: access.verification, title: Credential verification, group: access, keys: [decentralizedIam.vcAuthentication],
     summary: "Verify incoming credentials, hand out access tokens (VCVerifier + local Trusted Issuers List)",
     consequence: "Without credential verification this connector cannot accept a participant's access token."}
  - {id: access.policies, title: Policy enforcement, group: access, keys: [decentralizedIam.odrlAuthorization],
     summary: Enforce ODRL policies on every request (APISIX + OPA + ODRL-PAP),
     consequence: "Without policy enforcement nothing checks who may access your data services."}
  - {id: data.scorpio, title: NGSI-LD data service, group: data, keys: [scorpio],
     summary: An NGSI-LD context broker as the data service,
     consequence: "Without the NGSI-LD data service you offer no data unless you protect a data service of your own."}
  - {id: data.external, title: Your own data services, group: data, requires: [access.policies],
     keys: [decentralizedIam.odrlAuthorization.apisix.routes], summary: Protect data services you run yourself}
  - {id: contract.tmforum, title: TMForum contract APIs, group: contracts, keys: [tm-forum-api],
     summary: TMForum product/contract APIs}
  - {id: contract.management, title: Contract management, group: contracts, requires: [contract.tmforum, access.policies],
     keys: [contract-management], summary: Turn orders into access policies automatically}
  - {id: market.local, title: Local marketplace, group: marketplace, requires: [contract.tmforum],
     keys: [marketplace], summary: A marketplace of your own (BAE)}
  - {id: market.central, title: Central marketplace, group: marketplace, requires: [contract.tmforum],
     keys: [contract-management], summary: "Publish into the data space's central marketplace"}
  - {id: dsp.edc, title: Dataspace Protocol (DSP), group: interop, keys: [fdsc-edc, identityhub, registration],
     summary: "Dataspace Protocol via EDC, with DCP identity (IdentityHub)"}
  - {id: dsp.rainbow, title: Rainbow DSP, group: interop, keys: [rainbow],
     summary: The Rust DSP implementation (Rainbow)}
  - {id: dsp.config, title: Data space configuration, group: interop, keys: [dataSpaceConfig],
     summary: Serve /.well-known/data-space-configuration}
  - {id: consent.provider, title: Consent enforcement, group: consent, requires: [access.policies],
     keys: [consent-facade, consent-owner-resolver], summary: Enforce data-subject consent on provider APIs}
  - {id: consent.authority, title: Consent authority, group: consent, chart: trust-anchor,
     keys: [consentManagement, consent-manager, consent-facade], summary: "Run the data space's consent manager"}
  - {id: ta.registry, title: Trusted Issuers Registry, group: operator, chart: trust-anchor, keys: [trusted-issuers-list],
     summary: Trusted Issuers Registry + Trusted Issuers List API,
     consequence: "Without the Trusted Issuers Registry participants cannot check which issuers the data space trusts."}
  - {id: ta.onboarding, title: Participant onboarding, group: operator, chart: trust-anchor,
     keys: [trusted-issuers-list.ingress.til], summary: Participant onboarding}
  - {id: obs.tracing, title: Tracing, group: observability,
     keys: [tracing, opentelemetry-collector, opentelemetry-operator], summary: Distributed traces from every component}
  - {id: obs.traceStore, title: Trace store, group: observability, keys: [tempo, grafana],
     summary: Store and browse traces (Tempo + Grafana)}
  - {id: obs.metrics, title: Metrics, group: observability, keys: [prometheus, grafana, fdsc-dashboard],
     summary: Metrics and dashboards}
