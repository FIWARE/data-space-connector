# Maps the component matrix of doc/deployment-integration/roles/README.md to feature ids.
roleMatrix:
  components:
    VCVerifier: access.verification
    credentials-config-service: access.verification
    trusted-issuers-list: access.verification
    APISIX: access.policies
    OPA: access.policies
    odrl-pap: access.policies
    Keycloak: identity.issuer
    DID: identity.did
    tmforum-api: contract.tmforum
    contract-management: contract.management
    FDSC-EDC: dsp.edc
    Trusted Issuers Registry: ta.registry
  infrastructure: [PostgreSQL]
rules:
  - id: did-key-in-production
    severity: warning
    stage: foundations
    field: answers.did.method
    when:
      - {field: target.environment, equals: production}
      - {field: answers.did.method, equals: "did:key"}
    message: >-
      A did:key in production: other participants cannot resolve it over the web, and its key cannot be rotated
      without a new identity. Production data spaces usually expect did:web.
    doc: doc/deployment-integration/roles/provider/README.md#did-and-key-management
  - id: tir-address-for-verification
    severity: error
    stage: foundations
    field: answers.dataspace.tirAddress
    when:
      - {field: features.access.verification, equals: "on"}
      - {field: answers.dataspace.tirAddress, unset: true}
    message: >-
      The verifier cannot check issuers without the data space's Trust Anchor: credential verification is on, but
      the TIR address is not set. Enter it, import it from the data space's descriptor, or turn verification off.
    doc: doc/deployment-integration/roles/provider/README.md#vcverifier
  - id: host-collision
    severity: error
    stage: foundations
    distinct: {prefix: host.}
    message: >-
      {{ .first }} and {{ .second }} both resolve to {{ .host }}. The chart routes by host, so one of them stops
      being reachable. Give one of them another host.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#public-names-have-to-resolve-inside-the-cluster
  - id: did-web-host
    severity: error
    stage: foundations
    didWebHost: {did: did.value, host: host.did}
    message: >-
      The DID resolves on another host than the one serving its DID document. Pin the DID document host to the
      DID's host, or reset the DID to derived.
    doc: doc/deployment-integration/roles/provider/README.md#did-and-key-management
  # Whether a component deploys is read from its enabledKeys (rendered, loaded, else the chart default), not from
  # the features: the tool renders no enabled key until US-5.3, so a feature that is off still deploys (ADR 0024).
  - id: java-memory-limit
    severity: warning
    stage: foundations
    field: answers.resources.profile
    when:
      - {field: target.environment, equals: production}
    memoryLimit: {components: [keycloak, scorpio, tmforum, til, contractManagement,
                               ccs, dss, consentFacade, identityhub, edc]}
    message: >-
      Without a memory limit, the JVM sizes its heap from the node: {{ .components }}.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#set-memory-limits-on-the-java-components
resources:
  answer: resources.profile
  measuredOn: 10.13.2
  doc: doc/deployment-integration/roles/PREREQUISITES.md#sizing
  components:
    # keycloak.resources is already set in the umbrella values.yaml (500Mi/0.5 -> 2Gi/1): OOMs on kernel >= 6.14.
    - {id: keycloak, label: Keycloak, path: keycloak.resources,
       enabledKeys: {keycloak.enabled: true}, chartMemoryLimit: 2Gi}
    - {id: scorpio, label: Scorpio, path: scorpio.resources,
       enabledKeys: {scorpio.enabled: true}}
    - {id: tmforum, label: TMForum API, path: tm-forum-api.defaultConfig.resources,
       enabledKeys: {tm-forum-api.enabled: true}}
    - {id: til, label: Trusted Issuers List,
       path: decentralizedIam.vcAuthentication.trusted-issuers-list.deployment.resources,
       enabledKeys: {decentralizedIam.enabled: true, decentralizedIam.vcAuthentication.enabled: true,
                     decentralizedIam.vcAuthentication.trusted-issuers-list.enabled: true}}
    - {id: contractManagement, label: contract-management, path: contract-management.deployment.resources,
       enabledKeys: {contract-management.enabled: true}}
  # Not JVM, so not listed: odrl-pap (Quarkus native), verifier, vc-operator, did-helper, Rainbow, the
  # status-list-server, consent-owner-resolver (native), the marketplace (Node/Python) and the dashboard.
  unsized:
    - {id: ccs, label: credentials-config-service,
       path: decentralizedIam.vcAuthentication.credentials-config-service.deployment.resources,
       enabledKeys: {decentralizedIam.enabled: true, decentralizedIam.vcAuthentication.enabled: true,
                     decentralizedIam.vcAuthentication.credentials-config-service.enabled: false}}
    - {id: dss, label: DSS validation service, path: decentralizedIam.vcAuthentication.dss.deployment.resources,
       enabledKeys: {decentralizedIam.enabled: true, decentralizedIam.vcAuthentication.enabled: true,
                     decentralizedIam.vcAuthentication.dss.enabled: false}}
    - {id: consentFacade, label: consent-facade, path: consent-facade.deployment.resources,
       enabledKeys: {consent-facade.enabled: false}}
    - {id: identityhub, label: IdentityHub, path: identityhub.resources,
       enabledKeys: {identityhub.enabled: false}, chartMemoryLimit: 512Mi}
    # fdsc-edc renders one Deployment per key of fdsc-edc.deployment, each merged over fdsc-edc.common.deployment.
    - {id: edc, label: fdsc-edc, path: fdsc-edc.deployment.*.deployment.resources,
       fallbackPaths: [fdsc-edc.common.deployment.resources], enabledKeys: {fdsc-edc.enabled: true}}
  # Memory floors at rest on 10.13.2: Keycloak 0.6 GiB, Scorpio 0.4, TMForum API 0.35, TIL 0.2, contract-management 0.2.
  # development: memory request = floor rounded up to 256Mi, limit = 2x the request.
  # production: memory request = limit = 2.5x the floor rounded up to 512Mi, so the pod is not evicted first.
  # Neither lowers the chart's Keycloak limit of 2Gi. CPU limits leave room for the JVM's start-up burst.
  profiles:
    development:
      keycloak: {requests: {cpu: 100m, memory: 768Mi}, limits: {cpu: "1", memory: 2Gi}}
      scorpio: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 1500m, memory: 1Gi}}
      tmforum: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
      til: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      contractManagement: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
    production:
      keycloak: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "2", memory: 2Gi}}
      scorpio: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "2", memory: 1Gi}}
      tmforum: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "2", memory: 1Gi}}
      til: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "1", memory: 512Mi}}
      contractManagement: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "1", memory: 512Mi}}
# Lists keyed element targets write into (ADR 0025). base holds the default elements of the layer that supplies the
# list, the umbrella's values.yaml or the subchart's; internal/render/proxy_test.go pins each against it.
lists:
  - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalEnvVars
    key: name
  - path: marketplace.bizEcosystemLogicProxy.additionalEnvVars
    key: name
    base:
      - {name: OTEL_SDK_DISABLED, value: "true"}
      - {name: OTEL_SERVICE_NAME, value: marketplace}
      - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: ""}
      - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
      - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
      - {name: OTEL_TRACES_SAMPLER_ARG, value: "1.0"}
      - {name: OTEL_PROPAGATORS, value: "tracecontext,baggage"}
      - {name: OTEL_METRICS_EXPORTER, value: none}
      - {name: OTEL_LOGS_EXPORTER, value: none}
  - path: vc-operator.extraEnvVars
    key: name
  - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalVolumes
    key: name
  - path: decentralizedIam.vcAuthentication.vcverifier.deployment.additionalVolumeMounts
    key: name
    unique: [mountPath]
  - path: decentralizedIam.vcAuthentication.vcverifier.deployment.initContainers
    key: name
  - path: marketplace.bizEcosystemLogicProxy.extraContainerVolumes
    key: name
  - path: marketplace.bizEcosystemLogicProxy.extraVolumeMounts
    key: name
    unique: [mountPath]
  - path: vc-operator.extraVolumes
    key: name
  - path: vc-operator.extraVolumeMounts
    key: name
    unique: [mountPath]
  - path: keycloak.extraEnvVars
    key: name
    base:
      - {name: KC_HEAP_SIZE, value: "1024m"}
  - path: keycloak.extraVolumes
    key: name
  - path: keycloak.extraVolumeMounts
    key: name
    unique: [mountPath]
    base:
      - {name: realms, mountPath: /opt/keycloak/data/import}
# The in-cluster services a proxied component calls, which the proxy.no default bypasses by bare name (ADR 0025).
# name is a template over target.release and target.namespace; overrides are the value paths that rename the
# service, the first set one wins. Otherwise a set nameOverride replaces the chart name in fullname, as Helm's
# fullname does. internal/render/noproxy_names_test.go pins every row against the charts.
noProxyServices:
  - {name: credentials-config-service, overrides: [decentralizedIam.vcAuthentication.credentials-config-service.fullnameOverride]}
  - {name: trusted-issuers-list, overrides: [decentralizedIam.vcAuthentication.trusted-issuers-list.fullnameOverride]}
  - {name: tm-forum-api, overrides: [tm-forum-api.apiProxy.service.nameOverride]}
  # The all-in-one service: tm-forum-api names it so while its defaultConfig.serverHost holds the name, as by default.
  - {name: tm-forum-api-svc}
  # templates/status-list-server-service.yaml hard-codes the name.
  - {name: status-list-server}
  - {name: '{{ fullname .target.release "keycloak" }}', overrides: [keycloak.fullnameOverride],
     nameOverride: keycloak.nameOverride}
  - {name: '{{ fullname .target.release "opentelemetry-collector" }}', overrides: [opentelemetry-collector.fullnameOverride],
     nameOverride: opentelemetry-collector.nameOverride}
# Cluster objects the rendered values reference and the user creates before installing; NEXT_STEPS.md lists them.
#   kind     secret
#   name     a template over answers; the requirement applies only while all of them resolve
#   key      the data key the object must hold
requirements:
  - {kind: secret, name: "{{ .ca.privateSecret }}", key: ca.crt,
     purpose: The PEM bundle of the private CA that signs the public hosts.}
# Mechanisms that collide with something the chart templates itself, which no lists row's unique check sees.
#   id         a mechanism of the element targets
#   conflicts  [{whenSet: [paths]}]: the mechanism is withheld while a loaded file sets every path of any one entry,
#              as a Helm `if` reads it; no target may write these paths
mechanisms:
  # The vcverifier chart mounts its own ca-bundle at /etc/ssl/cert.pem with a client certificate, and renders its
  # add-root-ca init container, so its caCert, as soon as deployment.initContainers is non-empty.
  - id: verifier-ca
    conflicts:
      - whenSet: [decentralizedIam.vcAuthentication.vcverifier.deployment.serverCertificates.caCert.enabled]
      - whenSet: [decentralizedIam.vcAuthentication.vcverifier.deployment.serverCertificates.clientKey.secretName,
                  decentralizedIam.vcAuthentication.vcverifier.deployment.verifier.clientIdentification.certificatePath]
foundations:
  - id: org.displayName
    stage: foundations
    group: organization
    type: string
    label: Display name
    help: >-
      The organization's name as other participants see it, shown in the header of the Keycloak login page in the
      chart's default styling.
    doc: doc/deployment-integration/roles/KEYCLOAK.md
    targets:
      # _realm.tpl writes displayNameHtml into the realm JSON unescaped: type string refuses '"', '\', '<' and '>',
      # and the chart's default wrapper is kept with single-quoted attributes.
      - {path: 'keycloak.realm.displayNameHtml', fn: tpl, args: ["<div class='kc-logo-text'><span>{{ .org.displayName }}</span></div>"]}
  - id: domain.base
    stage: foundations
    type: domain
    label: Base domain
    help: Every public host name is derived from it as <component>.<base domain>, unless that host is overridden.
    doc: doc/deployment-integration/roles/PREREQUISITES.md#public-names-have-to-resolve-inside-the-cluster
    # The APISIX ingress is shared by every host behind policy enforcement; the host.* below own its elements.
    targets:
      - path: 'decentralizedIam.odrlAuthorization.apisix.ingress.annotations."cert-manager.io/alt-names"'
        fn: join
        sep: ","
        args:
          - "{{ .host.dataService }}"
          - "{{ .host.tppDataService }}"
          - "{{ .host.tppService }}"
          - "{{ .host.tmfApi }}"
          - "{{ .host.contractManagement }}"
          - "{{ .host.dsp }}"
          - "{{ .host.dcp }}"
          - "{{ .host.identityhub }}"
          - "{{ .host.identityhubManagement }}"
          - "{{ .host.vault }}"
          - "{{ .host.oid4vcManagement }}"
          - "{{ .host.dcpManagement }}"
          - "{{ .host.consentDataService }}"
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].secretName', fn: const, args: [apisix-provider-tls]}
  - id: did.method
    stage: foundations
    group: organization
    type: choice
    default: did:web
    label: DID method
    help: How other participants resolve the organization's DID to its keys.
    doc: doc/deployment-integration/roles/provider/README.md#did-and-key-management
    options:
      - value: did:web
        label: did:web
        note: Resolved over HTTPS from the base domain, so the domain has to be public and the DID document served there.
      - value: did:key
        label: did:key
        note: >-
          Meant for local development: the key is the identifier, so it cannot be rotated without a new identity,
          and production data spaces usually expect did:web.
  - id: did.value
    stage: foundations
    group: organization
    type: did
    default: "did:web:{{ .host.did }}"
    defaultWhen: {id: did.method, equals: "did:web"}
    prefix: "{{ .did.method }}:"
    label: Organization DID
    help: >-
      The participant's identifier in the data space. Derived from the DID document host for did:web until it is
      edited; an edited DID stays as it is when the host changes.
    doc: doc/deployment-integration/roles/provider/README.md#did-and-key-management
    # Narrower than US-3.2's list of consumers (ADR 0021), each left to the story that owns the surrounding block:
    #   registration.issuer[0].did and the verifier's TIR curl script (initContainers): lists naming other
    #     participants or k3s-local content, US-3.3
    #   keycloak.signingKey.did: alone it yields a keystore provider without a store, US-5.5 (with the realm's
    #     clients, credentials, clientRoles and users)
    #   identityhub.bootstrap.did and fdsc-edc's oid4vp.holder.kid: the kid must be <bootstrap.did>#<keyAlias> once
    #     the bootstrap DID is set (dsc.identityhub.assertHolderKid), and keyAlias is not owned, US-8.11
    #   the ODRL-PAP and marketplace env lists and the dashboard providers: lists with other content, US-5.6, US-5.3
    #   dataSpaceConfig and APISIX: chart 10.16.0 has no DID key there
    # The fdsc-edc keys sit under common, never under deployment.<name>: the subchart creates one controlplane per
    # deployment entry, and their names are the user's. They are not gated on fdsc-edc yet (US-5.3).
    targets:
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.deployment.verifier.did', fn: copy, args: ["{{ .did.value }}"]}
      - {path: 'contract-management.did', fn: copy, args: ["{{ .did.value }}"]}
      - {path: 'keycloak.issuerDid', fn: copy, args: ["{{ .did.value }}"]}
      - {path: 'fdsc-edc.common.config.edc.participant.id', fn: copy, args: ["{{ .did.value }}"]}
      - {path: 'fdsc-edc.common.config.issuerId', fn: copy, args: ["{{ .did.value }}"]}
      # The STS client: it must equal the participant id, or the IdentityHub refuses the token request.
      - {path: 'fdsc-edc.common.config.oauth.clientId', fn: copy, args: ["{{ .did.value }}"]}
      # Names the secret the IdentityHub bootstrap writes for this DID.
      - {path: 'fdsc-edc.common.config.oauth.secretAlias', fn: tpl, args: ["{{ .did.value }}-sts-client-secret"]}
      - {path: 'fdsc-edc.common.config.oid4vp.holder.id', fn: copy, args: ["{{ .did.value }}"]}
  - id: host.keycloak
    stage: foundations
    type: hostname
    features: [identity.issuer]
    default: "keycloak.{{ .domain.base }}"
    label: Keycloak host
    help: Keycloak, the credential issuer, with its login pages and OID4VCI endpoints.
    doc: doc/deployment-integration/roles/KEYCLOAK.md#ingress-and-tls
    targets:
      - {path: 'keycloak.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.keycloak }}"]}
      - {path: 'keycloak.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.keycloak }}"]}
      - {path: 'keycloak.ingress.hosts[0].host', fn: copy, args: ["{{ .host.keycloak }}"]}
      - {path: 'keycloak.ingress.hosts[0].paths[0].path', fn: const, args: [/]}
      - {path: 'keycloak.ingress.hosts[0].paths[0].pathType', fn: const, args: [Prefix]}
      - {path: 'keycloak.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.keycloak }}-tls"]}
      - {path: 'keycloak.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.keycloak }}"]}
      - {path: 'keycloak.realm.frontendUrl', fn: tpl, args: ["https://{{ .host.keycloak }}"]}
  - id: host.statusList
    stage: foundations
    type: hostname
    features: [identity.statuslist]
    default: "status-list.{{ .domain.base }}"
    label: Status list host
    help: The status list server that publishes which issued credentials are revoked.
    doc: doc/deployment-integration/roles/provider/README.md
    targets:
      - {path: 'statusListServer.env.serverDomain', fn: copy, args: ["{{ .host.statusList }}"]}
      - {path: 'keycloak.tokenStatusList.serverUrl', fn: tpl, args: ["https://{{ .host.statusList }}"]}
      - {path: 'statusListServer.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.statusList }}"]}
      - {path: 'statusListServer.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.statusList }}"]}
      - {path: 'statusListServer.ingress.hosts[0].host', fn: copy, args: ["{{ .host.statusList }}"]}
      - {path: 'statusListServer.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'statusListServer.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.statusList }}-tls"]}
      - {path: 'statusListServer.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.statusList }}"]}
  - id: host.did
    stage: foundations
    type: hostname
    features: [identity.did]
    default: "{{ .domain.base }}"
    label: DID document host
    help: >-
      Where the did:web document is served; a did:web DID names this host. The TLS certificate and its key are not
      changed here.
    doc: doc/deployment-integration/roles/provider/README.md#did-and-key-management
    # The ingress TLS secret holds the DID key, mounted by the did chart, Keycloak and the status list server, so the
    # certificate stays with US-8.11 (ADR 0023).
    targets:
      - {path: 'did.ingress.hosts[0].host', fn: copy, args: ["{{ .host.did }}"]}
      - {path: 'did.ingress.hosts[0].paths[0].path', fn: const, args: [/]}
      - {path: 'did.ingress.hosts[0].paths[0].pathType', fn: const, args: [ImplementationSpecific]}
      - {path: 'did.config.server.hostUrl', fn: tpl, args: ["http://{{ .host.did }}"]}
  - id: host.til
    stage: foundations
    type: hostname
    features: [access.verification]
    default: "til.{{ .domain.base }}"
    label: Trusted Issuers List host
    help: The management API of the local Trusted Issuers List.
    doc: doc/deployment-integration/roles/operator/README.md#trusted-issuers-list-til-management-api
    targets:
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.til }}"]}
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.til }}"]}
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.hosts[0].host', fn: copy, args: ["{{ .host.til }}"]}
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.tls[0].secretName', fn: tpl, args: ["{{ .host.til }}-tls"]}
      - {path: 'decentralizedIam.vcAuthentication.trusted-issuers-list.ingress.til.tls[0].hosts[0]', fn: copy, args: ["{{ .host.til }}"]}
  - id: host.verifier
    stage: foundations
    type: hostname
    features: [access.verification]
    default: "verifier.{{ .domain.base }}"
    label: Verifier host
    help: >-
      The verifier, which checks presented credentials and hands out access tokens. The TLS certificate and its key
      are not changed here.
    doc: doc/deployment-integration/roles/provider/README.md#vcverifier
    # The ingress TLS secret is the verifier's signing key, mounted by additionalVolumes and named in
    # clientIdentification, so the certificate stays with US-8.11 (ADR 0023).
    targets:
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.ingress.hosts[0].host', fn: copy, args: ["{{ .host.verifier }}"]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.deployment.server.host', fn: tpl, args: ["https://{{ .host.verifier }}"]}
      # The marketplace's SIOP login goes to the verifier.
      - {path: 'marketplace.siop.verifier.host', fn: tpl, args: ["https://{{ .host.verifier }}"]}
  - id: host.ccs
    stage: foundations
    type: hostname
    features: [access.verification]
    default: "ccs.{{ .domain.base }}"
    label: Credentials config host
    help: The credentials config service, which tells the verifier which credentials a service accepts.
    doc: doc/deployment-integration/roles/provider/README.md#authentication-verifiable-credential-verification
    targets:
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.ccs }}"]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.ccs }}"]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.hosts[0].host', fn: copy, args: ["{{ .host.ccs }}"]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.tls[0].secretName', fn: tpl, args: ["{{ .host.ccs }}-tls"]}
      - {path: 'decentralizedIam.vcAuthentication.vcverifier.configIngress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.ccs }}"]}
  - id: host.pap
    stage: foundations
    type: hostname
    features: [access.policies]
    default: "pap.{{ .domain.base }}"
    label: Policy administration host
    help: The ODRL policy administration point, where access policies are managed.
    doc: doc/deployment-integration/roles/provider/README.md#authorization-policy-enforcement
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.pap }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.pap }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.hosts[0].host', fn: copy, args: ["{{ .host.pap }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.pap }}-tls"]}
      - {path: 'decentralizedIam.odrlAuthorization.odrl-pap.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.pap }}"]}
  - id: host.scorpio
    stage: foundations
    type: hostname
    features: [data.scorpio]
    default: "scorpio.{{ .domain.base }}"
    label: Scorpio host
    help: Direct access to the NGSI-LD context broker, bypassing policy enforcement.
    doc: doc/deployment-integration/roles/provider/README.md
    targets:
      - {path: 'scorpio.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.scorpio }}"]}
      - {path: 'scorpio.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.scorpio }}"]}
      - {path: 'scorpio.ingress.hosts[0].host', fn: copy, args: ["{{ .host.scorpio }}"]}
      - {path: 'scorpio.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'scorpio.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.scorpio }}-tls"]}
      - {path: 'scorpio.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.scorpio }}"]}
  - id: host.tmForumApi
    stage: foundations
    type: hostname
    features: [contract.tmforum]
    default: "tm-forum-api.{{ .domain.base }}"
    label: TMForum API host
    help: Direct access to the TMForum APIs, bypassing policy enforcement.
    doc: doc/deployment-integration/roles/provider/README.md#tmforum-api
    targets:
      - {path: 'tm-forum-api.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.tmForumApi }}"]}
      - {path: 'tm-forum-api.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.tmForumApi }}"]}
      - {path: 'tm-forum-api.ingress.hosts[0].host', fn: copy, args: ["{{ .host.tmForumApi }}"]}
      - {path: 'tm-forum-api.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'tm-forum-api.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.tmForumApi }}-tls"]}
      - {path: 'tm-forum-api.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.tmForumApi }}"]}
  - id: host.marketplace
    stage: foundations
    type: hostname
    features: [market.local]
    default: "marketplace.{{ .domain.base }}"
    label: Marketplace host
    help: The marketplace (BAE) front end.
    doc: doc/deployment-integration/roles/provider/LOCAL_MARKETPLACE.md
    targets:
      - {path: 'marketplace.externalUrl', fn: tpl, args: ["https://{{ .host.marketplace }}"]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.marketplace }}"]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.marketplace }}"]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.hosts[0].host', fn: copy, args: ["{{ .host.marketplace }}"]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.marketplace }}-tls"]}
      - {path: 'marketplace.bizEcosystemLogicProxy.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.marketplace }}"]}
  - id: host.dashboard
    stage: foundations
    type: hostname
    features: [obs.metrics]
    default: "dashboard.{{ .domain.base }}"
    label: Dashboard host
    help: The FDSC dashboard.
    doc: doc/config-tool/FEATURE_MODEL.md
    targets:
      - {path: 'fdsc-dashboard.ingress.annotations."cert-manager.io/common-name"', fn: copy, args: ["{{ .host.dashboard }}"]}
      - {path: 'fdsc-dashboard.ingress.annotations."cert-manager.io/alt-names"', fn: copy, args: ["{{ .host.dashboard }}"]}
      - {path: 'fdsc-dashboard.ingress.hosts[0].host', fn: copy, args: ["{{ .host.dashboard }}"]}
      - {path: 'fdsc-dashboard.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'fdsc-dashboard.ingress.tls[0].secretName', fn: tpl, args: ["{{ .host.dashboard }}-tls"]}
      - {path: 'fdsc-dashboard.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.dashboard }}"]}
  - id: host.dataService
    stage: foundations
    type: hostname
    features: [access.policies, data.scorpio]
    default: "data-service.{{ .domain.base }}"
    label: Data service host
    help: The NGSI-LD data service behind policy enforcement.
    doc: doc/deployment-integration/roles/provider/README.md#authorization-policy-enforcement
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[0].host', fn: copy, args: ["{{ .host.dataService }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[0].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].hosts[0]', fn: copy, args: ["{{ .host.dataService }}"]}
  - id: host.tppDataService
    stage: foundations
    type: hostname
    features: [access.policies, data.scorpio]
    default: "tpp-data-service.{{ .domain.base }}"
    label: Transfer-checked data service host
    help: The data service that is reachable only during a running Dataspace Protocol transfer.
    doc: doc/DSP_INTEGRATION.md
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[1].host', fn: copy, args: ["{{ .host.tppDataService }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[1].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].hosts[1]', fn: copy, args: ["{{ .host.tppDataService }}"]}
  - id: host.tppService
    stage: foundations
    type: hostname
    features: [access.policies, access.verification]
    default: "tpp-service.{{ .domain.base }}"
    label: Transfer-checked service host
    help: The OpenID configuration of the transfer-checked data service.
    doc: doc/DSP_INTEGRATION.md
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[2].host', fn: copy, args: ["{{ .host.tppService }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[2].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].hosts[2]', fn: copy, args: ["{{ .host.tppService }}"]}
  - id: host.tmfApi
    stage: foundations
    type: hostname
    features: [access.policies, contract.tmforum]
    default: "tmf-api.{{ .domain.base }}"
    label: Protected TMForum API host
    help: The TMForum APIs behind policy enforcement, as participants call them.
    doc: doc/deployment-integration/roles/provider/README.md#tmforum-api
    targets:
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[3].host', fn: copy, args: ["{{ .host.tmfApi }}"]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.hosts[3].paths[0]', fn: const, args: [/]}
      - {path: 'decentralizedIam.odrlAuthorization.apisix.ingress.tls[0].hosts[3]', fn: copy, args: ["{{ .host.tmfApi }}"]}
  - id: host.contractManagement
    stage: foundations
    type: hostname
    features: [access.policies, contract.management]
    default: "contract-management.{{ .domain.base }}"
    label: Contract management host
