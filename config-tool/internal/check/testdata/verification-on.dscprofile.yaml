# A provider with credential verification on and no TIR address, which tir-address-for-verification refuses.
format: 1
model: {chart: data-space-connector, version: 10.16.0, revision: 9}
target:
  type: file
  namespace: provider
  createNamespace: true
  releaseName: provider
  chart: data-space-connector
  chartVersion: 10.16.0
  environment: development
role: provider
features:
  access.verification: {enabled: true, source: preset}
answers:
  domain.base: example.org
open: []
secrets: {}
