# Each case is a rules list Versions refuses over the foundations of ../foundations/did.yaml and the one-feature
# catalogue of checkrules_test.go, with a fragment of the error it must report.
- name: id missing
  err: "rules[0]: id is missing"
  rules:
    - {severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: duplicate id
  err: 'rules[1]: id "r" is already used by rules[0]'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: severity unknown
  err: 'severity "info" is unknown'
  rules:
    - {id: r, severity: info, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: stage unknown
  err: 'stage "nowhere" is unknown'
  rules:
    - {id: r, severity: warning, stage: nowhere, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: stage is not the field's
  err: "stage target is not foundations, the stage of field answers.did.method"
  rules:
    - {id: r, severity: warning, stage: target, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: message missing
  err: "message is missing"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], doc: doc/a.md}
- name: when missing
  err: "when, distinct, didWebHost, memoryLimit, caCoverage, noProxyCoverage or valueSet is missing"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, message: M, doc: doc/a.md}
- name: field is not a foundation
  err: 'field: "answers.did.typo" is neither one of target.environment nor answers.<foundation id>'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.typo, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: field without prefix
  err: 'field: "did.method" is neither'
  rules:
    - {id: r, severity: warning, stage: foundations, field: did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: when field unknown
  err: 'when[0]: "target.namespace" is neither'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: target.namespace, equals: x}], message: M, doc: doc/a.md}
- name: when value not an option
  err: 'when[0]: "did:jwk" is not a value of answers.did.method (did:web, did:key)'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:jwk"}], message: M, doc: doc/a.md}
- name: when value not an environment
  err: 'when[0]: "prod" is not a value of target.environment (development, production)'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: target.environment, equals: prod}], message: M, doc: doc/a.md}
- name: doc missing
  err: 'doc "" is not a repo-relative path'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M}
- name: doc is a URL
  err: 'doc "https://example.org/a.md" is not a repo-relative path'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: "https://example.org/a.md"}
- name: doc is absolute
  err: 'doc "/doc/a.md" is not a repo-relative path'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: /doc/a.md}
- name: doc leaves the repo
  err: 'doc "../a.md#x" is not a repo-relative path'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: "../a.md#x"}
- name: doc not clean
  err: 'doc "doc/./a.md" is not a repo-relative path'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/./a.md}
- name: unknown rule field
  err: "field equal not found"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.method, equal: "did:key"}], message: M, doc: doc/a.md}
- name: field is a feature
  err: 'field: "features.access.verification" is neither'
  rules:
    - {id: r, severity: warning, stage: features, field: features.access.verification, when: [{field: answers.did.method, equals: "did:key"}], message: M, doc: doc/a.md}
- name: when feature not in the catalogue
  err: 'when[0]: "features.access.typo" names no feature of the catalogue'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: features.access.typo, equals: "on"}], message: M, doc: doc/a.md}
- name: when feature value not on or off
  err: 'when[0]: "true" is not a value of features.access.verification (on, off)'
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: features.access.verification, equals: "true"}], message: M, doc: doc/a.md}
- name: when has more than one of equals, unset and set
  err: "when[0]: answers.did.value has more than one of equals, unset and set"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.value, equals: x, unset: true}], message: M, doc: doc/a.md}
- name: when has none of equals, unset and set
  err: "when[0]: answers.did.value has none of equals, unset and set"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.value}], message: M, doc: doc/a.md}
- name: when unset is false
  err: "when[0]: answers.did.value has none of equals, unset and set"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.did.value, unset: false}], message: M, doc: doc/a.md}
- name: when unset on a feature
  err: "when[0]: unset and set apply to answers.<foundation id> only, not features.access.verification"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: features.access.verification, unset: true}], message: M, doc: doc/a.md}
- name: when unset on the environment
  err: "when[0]: unset and set apply to answers.<foundation id> only, not target.environment"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: target.environment, unset: true}], message: M, doc: doc/a.md}
- name: memoryLimit with distinct
  err: "memoryLimit combines with when only, not with distinct, didWebHost or another kind"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: target.environment, equals: production}], distinct: {prefix: did.}, memoryLimit: {components: [keycloak]}, message: M, doc: doc/a.md}
- name: memoryLimit without when
  err: "memoryLimit needs when, its precondition, and field, where the finding points"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, memoryLimit: {components: [keycloak]}, message: M, doc: doc/a.md}
- name: memoryLimit without field
  err: "memoryLimit needs when, its precondition, and field, where the finding points"
  rules:
    - {id: r, severity: warning, stage: foundations, when: [{field: target.environment, equals: production}], memoryLimit: {components: [keycloak]}, message: M, doc: doc/a.md}
- name: memoryLimit without a resources table
  err: "memoryLimit: the bundle has no resources table"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: target.environment, equals: production}], memoryLimit: {components: [keycloak]}, message: M, doc: doc/a.md}
- name: memoryLimit with a bad when
  err: "answers.nope"
  rules:
    - {id: r, severity: warning, stage: foundations, field: answers.did.method, when: [{field: answers.nope, equals: x}], memoryLimit: {components: [keycloak]}, message: M, doc: doc/a.md}
