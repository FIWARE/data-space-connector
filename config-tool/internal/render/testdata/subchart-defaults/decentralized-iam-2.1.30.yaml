# helm pull decentralized-iam --repo https://fiware.github.io/decentralized-iam --version 2.1.30 --untar
# The effective defaults after decentralized-iam -> vc-authentication -> vcverifier.
# null: declared in none of the three layers, so the subchart's template sees nothing.
chart: decentralized-iam
version: 2.1.30
values:
  vcAuthentication:
    vcverifier:
      deployment:
        additionalEnvVars: null
        additionalVolumes: null
        additionalVolumeMounts: null
        initContainers: null
        serverCertificates:
          caCert:
            bundleImage:
              repository: alpine
              tag: 3.23.3
              bundlePath: /etc/ssl/cert.pem
  odrlAuthorization:
    apisix:
      routes: []
      apisix:
        ssl:
          enabled: false
          existingCASecret: ""
          certCAFilename: ""
