# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# The service account of the chart's MongoDB (managedMongo.serviceAccount). The operator's own,
# `mongodb-database`, exists in a single namespace only, so the chart creates one with another name
# and points the MongoDBCommunity's pods at it.
suite: MongoDB service account
templates:
  - templates/mongodb.yaml
release:
  name: dsc
  namespace: provider
tests:
  - it: renders nothing without managedMongo
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the service account, its Role and RoleBinding by default
    set:
      managedMongo.enabled: true
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: dsc-mongodb
          namespace: provider
          any: true
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: dsc-mongodb
          namespace: provider
          any: true
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: dsc-mongodb
          namespace: provider
          any: true

  - it: gives the Role the rules of the operator's mongodb-database
    set:
      managedMongo.enabled: true
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, patch, delete]

  - it: binds the Role to the service account
    set:
      managedMongo.enabled: true
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: dsc-mongodb
              namespace: provider
      - equal:
          path: roleRef.name
          value: dsc-mongodb

  - it: runs the MongoDB pods as the service account
    set:
      managedMongo.enabled: true
    documentSelector:
      path: kind
      value: MongoDBCommunity
    asserts:
      - equal:
          path: spec.statefulSet.spec.template.spec.serviceAccountName
          value: dsc-mongodb

  - it: takes a custom name
    set:
      managedMongo.enabled: true
      managedMongo.serviceAccount.name: marketplace-mongodb
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: marketplace-mongodb
          any: true
      - equal:
          path: spec.statefulSet.spec.template.spec.serviceAccountName
          value: marketplace-mongodb
        documentSelector:
          path: kind
          value: MongoDBCommunity

  - it: uses an existing service account without creating one
    set:
      managedMongo.enabled: true
      managedMongo.serviceAccount.create: false
      managedMongo.serviceAccount.name: my-mongodb
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: my-mongodb
          any: true
        not: true
      - equal:
          path: spec.statefulSet.spec.template.spec.serviceAccountName
          value: my-mongodb
        documentSelector:
          path: kind
          value: MongoDBCommunity

  - it: keeps the operator's default with create false and no name
    set:
      managedMongo.enabled: true
      managedMongo.serviceAccount.create: false
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: dsc-mongodb
          any: true
        not: true
      - notExists:
          path: spec.statefulSet
        documentSelector:
          path: kind
          value: MongoDBCommunity

  - it: keeps the rest of a statefulSet override
    set:
      managedMongo.enabled: true
      managedMongo.spec.statefulSet:
        spec:
          template:
            spec:
              containers:
                - name: mongod
                  resources:
                    limits:
                      memory: 250M
          volumeClaimTemplates:
            - metadata:
                name: data-volume
    documentSelector:
      path: kind
      value: MongoDBCommunity
    asserts:
      - equal:
          path: spec.statefulSet.spec.template.spec.serviceAccountName
          value: dsc-mongodb
      - equal:
          path: spec.statefulSet.spec.template.spec.containers[0].resources.limits.memory
          value: 250M
      - equal:
          path: spec.statefulSet.spec.volumeClaimTemplates[0].metadata.name
          value: data-volume

  - it: lets a statefulSet override name the service account
    set:
      managedMongo.enabled: true
      managedMongo.spec.statefulSet.spec.template.spec.serviceAccountName: from-override
    documentSelector:
      path: kind
      value: MongoDBCommunity
    asserts:
      - equal:
          path: spec.statefulSet.spec.template.spec.serviceAccountName
          value: from-override
