# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# ---------------------------------------------------------------------------
# Helm-unittest suite for the rendered realm.
#
# The realm is assembled by _realm.tpl from values that are spread across
# keycloak.realm, keycloak.elsi and keycloak.tokenStatusList, so a key that
# does not reach the template produces a realm that imports cleanly and behaves
# differently. That is the failure this suite guards.
# ---------------------------------------------------------------------------
suite: Keycloak realm
templates:
  - templates/realm.yaml
tests:
  # values.yaml has shipped `frontendURL` since forever while _realm.tpl only read `frontendUrl`,
  # so the documented key produced an empty attribute and Keycloak silently fell back to deriving
  # the issuer URL from the request.
  - it: should honour the documented frontendURL spelling
    set:
      keycloak.enabled: true
      keycloak.realm.frontendURL: https://kc.example.org
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"frontendUrl": "https://kc\.example\.org"'

  - it: should honour the frontendUrl spelling the template always read
    set:
      keycloak.enabled: true
      keycloak.realm.frontendUrl: https://kc.example.org
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"frontendUrl": "https://kc\.example\.org"'

  - it: should let frontendUrl win when both are given
    set:
      keycloak.enabled: true
      keycloak.realm.frontendURL: https://documented.example.org
      keycloak.realm.frontendUrl: https://explicit.example.org
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"frontendUrl": "https://explicit\.example\.org"'

  # defaultClients is a map so that a deployment can change one field of a standard client without
  # copying it whole, and null is how a values file removes one. helm template and helm install
  # keep the null and the template has to skip it (it failed with a nil pointer); helm-unittest
  # drops it while merging the values, so this only pins the result, not that failure.
  - it: should leave out a default client set to null
    set:
      keycloak.enabled: true
      keycloak.realm.defaultClients.admin-cli: null
    asserts:
      - notMatchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "admin-cli"'
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "account-console"'

  # With `none`, a realm served over plain HTTP answered requests from anywhere. `external`, the
  # default Keycloak itself gives a new realm, still accepts HTTP from private addresses, which is
  # how the components inside the cluster call it.
  - it: should require HTTPS for external requests by default
    set:
      keycloak.enabled: true
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"sslRequired": "external"'

  - it: should let a deployment choose when HTTPS is required
    set:
      keycloak.enabled: true
      keycloak.realm.sslRequired: all
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"sslRequired": "all"'

  # account-console and admin-cli are public clients: with the password grant, anyone who knows a
  # password gets a token straight from the token endpoint, without the login page and its second
  # factor. The rendered JSON has its keys sorted, so a client's flags follow its clientId with no
  # object in between, which is what `[^}]*` relies on.
  - it: should leave the password grant off on the public default clients
    set:
      keycloak.enabled: true
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "account-console",[^}]*"directAccessGrantsEnabled": false'
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "admin-cli",[^}]*"directAccessGrantsEnabled": false'

  # The k3s profiles turn it back on for the integration tests, merging one flag into the default
  # client: the rest of it, such as the OID4VCI opt-in, stays.
  - it: should let a deployment turn the password grant back on for one client
    set:
      keycloak.enabled: true
      keycloak.realm.defaultClients.account-console.directAccessGrantsEnabled: true
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "account-console",[^}]*"directAccessGrantsEnabled": true'
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"oid4vci.enabled": "true",[^{}]*\},\s*"authenticationFlowBindingOverrides": \{\},[^{}]*"clientId": "account-console"'
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"clientId": "admin-cli",[^}]*"directAccessGrantsEnabled": false'

  # The chart shipped `admin-user`, with the password `test` and the ADMIN role of the connector's
  # own client: in a deployment that did not replace the users, anyone could log in and get a
  # credential with that role, issued by the organisation.
  - it: should import no users and no roles of the connector's client by default
    set:
      keycloak.enabled: true
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"users": \[\]'
      - notMatchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"ADMIN"'

  # A map of client roles is merged into the default one, so a role in the default reached every
  # deployment that declared its own roles as a map.
  - it: should import only the users and client roles a deployment declares
    set:
      keycloak.enabled: true
      keycloak.realm.clientRoles:
        did:web:example.org:
          - name: READER
            clientRole: true
      keycloak.realm.users:
        - username: someone
          enabled: true
    asserts:
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"did:web:example.org": \[\s*\{\s*"clientRole": true,\s*"name": "READER"'
      - matchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"username": "someone"'
      - notMatchRegex:
          path: data["test-realm-realm.json"]
          pattern: '"ADMIN"|"admin-user"'
