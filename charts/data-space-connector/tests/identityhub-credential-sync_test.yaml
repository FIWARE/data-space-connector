# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# ---------------------------------------------------------------------------
# Helm-unittest suite for the credential-sync sidecar.
#
# The sidecar mirrors the credential the vc-operator maintains in a Secret into
# the identityhub's own credential store, on issuance and on every renewal.
#
# The assertions concentrate on the properties the design depends on: that it is
# a native sidecar (so it outlives the init phase and runs alongside the
# identityhub), that it writes over localhost rather than the Service, that the
# credential Secret is mounted optionally (a first install proceeds while the
# vc-operator is still issuing), and that the deprecated
# identityhub.bootstrap.credential.* keys still work.
# ---------------------------------------------------------------------------
suite: IdentityHub credential sync sidecar
templates:
  - templates/identityhub-deployment.yaml
  - templates/identityhub-bootstrap-cm.yaml
  - templates/identityhub-cm.yaml
tests:
  - it: should not render the sidecar unless it is asked for
    templates:
      - templates/identityhub-deployment.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
    asserts:
      # no cacerts, no otel and no sync means the whole initContainers block is absent
      - notExists:
          path: spec.template.spec.initContainers

  - it: should render a native sidecar that writes over localhost
    templates:
      - templates/identityhub-deployment.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
      identityhub.superuser.key: "c3VwZXItdXNlcg==.test"
      identityhub.bootstrap.did: did:web:example.org
      identityhub.credentialSync:
        enabled: true
        secretName: vc-credential
    asserts:
      # An init container with restartPolicy: Always - the native sidecar construct.
      # A plain init container would have to terminate before the identityhub starts,
      # which is the opposite of what this has to do.
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: credential-sync
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      # The Identity API is component-internal, so the write never leaves the pod.
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: IDENTITY_API
            value: "http://localhost:8082/api/identity/v1alpha"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: KEY_ID
            value: "did:web:example.org#key-1"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CREDENTIAL_FILE
            value: "/credential/credential"

  - it: should mount the credential optionally so a first install can proceed
    templates:
      - templates/identityhub-deployment.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
      identityhub.superuser.key: "c3VwZXItdXNlcg==.test"
      identityhub.bootstrap.did: did:web:example.org
      identityhub.credentialSync:
        enabled: true
        secretName: vc-credential
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credential
            secret:
              secretName: "vc-credential"
              optional: true

  - it: should provide the sync script even when the participant bootstrap is off
    templates:
      - templates/identityhub-bootstrap-cm.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
      identityhub.superuser.key: "c3VwZXItdXNlcg==.test"
      identityhub.bootstrap:
        enabled: false
        did: did:web:example.org
      identityhub.credentialSync:
        enabled: true
        secretName: vc-credential
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["sync-credential.sh"]
      - exists:
          path: data["lib.sh"]

  - it: should honour the deprecated bootstrap.credential keys
    templates:
      - templates/identityhub-deployment.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
      identityhub.superuser.key: "c3VwZXItdXNlcg==.test"
      identityhub.bootstrap.did: did:web:example.org
      identityhub.bootstrap.credential:
        enabled: true
        secretName: vc-legacy
        key: vc.jwt
        id: legacy-credential
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: credential-sync
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CREDENTIAL_ID
            value: "legacy-credential"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CREDENTIAL_FILE
            value: "/credential/vc.jwt"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credential
            secret:
              secretName: "vc-legacy"
              optional: true

  - it: should keep the identityhub credential watchdog off by default
    templates:
      - templates/identityhub-cm.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
    asserts:
      # There is no DCP issuer service to ask when the credential comes from an
      # OID4VCI issuer via the vc-operator, so every period would just produce a
      # failing request.
      - equal:
          path: data["edc.iam.credential.status.check.period"]
          value: "0"
      - notExists:
          path: data["edc.iam.credential.renewal.graceperiod"]

  - it: should configure the renewal grace period when the watchdog is on
    templates:
      - templates/identityhub-cm.yaml
    set:
      identityhub.enabled: true
      identityhub.endpoints.identity.authKeyAlias: super-user-apikey
      identityhub.credentialWatchdog:
        checkPeriodSeconds: 60
        renewalGracePeriodSeconds: 3600
    asserts:
      - equal:
          path: data["edc.iam.credential.status.check.period"]
          value: "60"
      - equal:
          path: data["edc.iam.credential.renewal.graceperiod"]
          value: "3600"
