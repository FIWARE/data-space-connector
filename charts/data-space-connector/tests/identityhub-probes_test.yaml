# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# ---------------------------------------------------------------------------
# Helm-unittest suite for the identityhub's probes.
#
# The startup probe holds the liveness probe back until the identityhub has
# started. Without it, a start slower than the liveness budget - the node busy
# starting the rest of the release - is killed half way and the pod goes into
# a restart loop. A restart in the middle of the first start can also leave
# the super-user with an API key other than the configured one, because the
# identityhub does not seed the super-user again once it exists.
# ---------------------------------------------------------------------------
suite: IdentityHub probes
templates:
  - templates/identityhub-deployment.yaml
set:
  identityhub:
    enabled: true
    endpoints:
      identity:
        authKeyAlias: super-user-apikey
tests:
  - it: should render a startup probe on the liveness endpoint by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/check/liveness
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: should keep the liveness and readiness probes
    asserts:
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should take the startup probe timings from the values
    set:
      identityhub:
        startupProbe:
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 40
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 20
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 40

  - it: should render no startup probe when it is disabled
    set:
      identityhub:
        startupProbe:
          enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
