{{- if ((.Values.tracing).autoInstrumentation).enabled }}
{{- /*
Instrumentation custom resource for the OpenTelemetry Operator.

The Operator's mutating webhook watches for pods annotated with
`instrumentation.opentelemetry.io/inject-<lang>: "true"` and injects
the appropriate language-specific auto-instrumentation agent (Java, Python,
Node.js) at pod creation time. This CR defines the agent images, exporter
endpoint, sampler, and propagator settings shared by all injected pods.

Prerequisites:
  - The `opentelemetry-operator` subchart must be enabled (provides the CRD
    and webhook).
  - cert-manager must be installed (the operator's webhook certificates are
    managed by cert-manager).

Gate: `tracing.autoInstrumentation.enabled`
*/ -}}
{{- $tracing := .Values.tracing | default dict -}}
{{- $autoInst := $tracing.autoInstrumentation | default dict -}}
{{- $sampler := get $tracing "sampler" | default "parentbased_traceidratio" -}}
{{- $samplerArg := get $tracing "samplerArg" | default "1.0" -}}
{{- $propagators := get $tracing "propagators" | default "tracecontext,baggage" -}}
{{- $java := $autoInst.java | default dict -}}
{{- $python := $autoInst.python | default dict -}}
{{- $nodejs := $autoInst.nodejs | default dict -}}

apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: {{ .Release.Name }}-auto-instrumentation
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "dsc.labels" . | nindent 4 }}
  # A hook, built when it runs: the operator subchart installs the Instrumentation CRD as a
  # template, so on a first install the kind does not exist yet when Helm builds the release's
  # resources. It runs after the otel-webhook-wait job (otel-restart-job.yaml), because the
  # operator's webhook validates it, and before the restart of the annotated pods. It is not
  # deleted once it succeeds: the operator reads it whenever it injects a pod.
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  exporter:
    endpoint: {{ include "dsc.otel.endpoint" . | quote }}
  propagators:
    {{- range (splitList "," $propagators) }}
    - {{ . | trim }}
    {{- end }}
  sampler:
    type: {{ $sampler }}
    argument: {{ $samplerArg | quote }}
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_METRICS_EXPORTER
      value: "none"
    - name: OTEL_LOGS_EXPORTER
      value: "none"
  java:
    image: {{ $java.image | default "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.11.0" | quote }}
  python:
    image: {{ $python.image | default "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.62b1" | quote }}
  nodejs:
    image: {{ $nodejs.image | default "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.75.0" | quote }}
{{- end }}
