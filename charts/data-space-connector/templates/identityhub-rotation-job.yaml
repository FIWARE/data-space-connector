{{- if and (eq .Values.identityhub.enabled true) .Values.identityhub.bootstrap.enabled .Values.identityhub.bootstrap.rotation.enabled }}
{{- $b := .Values.identityhub.bootstrap }}

# Replaces the participant's signing key, keeping the same vault alias and the same DID fragment.
#
# Deliberately NOT a Helm hook. Every run invalidates everything signed with the previous key under
# that fragment - credentials already held in wallets included - so it must be an explicit act, not
# a side effect of `helm upgrade`. Enable it, let it run once, then set it back to false. The Job
# name carries `rotation.instance` so a second rotation is a new, immutable Job rather than a failed
# attempt to patch a completed one.
#
# After it completes, three things are still on the operator (see the reminder the script prints):
# re-issue the credentials, restart everything that reads the identity key at startup, and restart
# apisix so it refetches the JWKS.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "identityhub-key-rotation-%s" ($b.rotation.instance | toString) | quote }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    app.kubernetes.io/name: identityhub
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: {{ $b.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identityhub
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: default
      securityContext:
        {{- toYaml .Values.identityhub.podSecurityContext | nindent 8 }}
      initContainers:
        - name: derive-key
          image: "{{ $b.opensslImage.repository }}:{{ $b.opensslImage.tag }}"
          imagePullPolicy: {{ $b.opensslImage.pullPolicy }}
          command: ["/bin/sh", "/scripts/derive-key.sh"]
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          env:
            {{- include "dsc.identityhub.bootstrapEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: identity-key
              mountPath: /identity-key
              readOnly: true
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
      containers:
        - name: rotate-key
          image: "{{ $b.curlImage.repository }}:{{ $b.curlImage.tag }}"
          imagePullPolicy: {{ $b.curlImage.pullPolicy }}
          command: ["/bin/sh", "/scripts/rotate-key.sh"]
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          env:
            {{- include "dsc.identityhub.bootstrapEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: "identityhub-bootstrap"
            defaultMode: 0755
        # The rotation reads the CURRENT content of this Secret. Rotating means: change the key
        # material in it first (or let cert-manager do it), then run this Job.
        - name: identity-key
          secret:
            secretName: {{ required "identityhub.bootstrap.identityKey.secretName is required when identityhub.bootstrap.enabled" $b.identityKey.secretName }}
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
