{{- if .Values.identityhub.enabled }}
{{- /*
Resolve the effective tracing state for the IdentityHub workload.
`identityhub.tracing.enabled` takes precedence when explicitly set;
otherwise the component inherits the global `tracing.enabled` toggle.
The Java agent init container is only injected when both tracing is
enabled and `identityhub.tracing.javaagent.enabled` is true, so operators
can turn auto-instrumentation off per-component without disabling the
OTEL env vars.
*/ -}}
{{- $ihTracing := .Values.identityhub.tracing | default dict -}}
{{- $otelEnabled := .Values.tracing.enabled -}}
{{- /* Only apply the per-component override when the value is explicitly
     set. `hasKey` returns true for present-but-null keys, so we must use
     `kindIs "invalid"` to detect the "inherit from global" case. */ -}}
{{- $ihOverride := get $ihTracing "enabled" -}}
{{- if not (kindIs "invalid" $ihOverride) -}}
{{- $otelEnabled = $ihOverride -}}
{{- end -}}
{{- if kindIs "invalid" $otelEnabled -}}{{- $otelEnabled = false -}}{{- end -}}
{{- $otelServiceName := default "identityhub" (get $ihTracing "serviceName") -}}
{{- $otelAgent := get $ihTracing "javaagent" | default dict -}}
{{- $otelAgentEnabled := true -}}
{{- $otelAgentOverride := get $otelAgent "enabled" -}}
{{- if not (kindIs "invalid" $otelAgentOverride) -}}{{- $otelAgentEnabled = $otelAgentOverride -}}{{- end -}}
{{- $otelInjectAgent := and $otelEnabled $otelAgentEnabled -}}
{{- $otelAgentImage := default "ghcr.io/open-telemetry/opentelemetry-java-instrumentation/autoinstrumentation-java:2.11.0" (get $otelAgent "image") -}}
{{- $otelAgentPullPolicy := default "IfNotPresent" (get $otelAgent "pullPolicy") -}}
{{- $otelJavaToolOption := "-javaagent:/otel-agent/opentelemetry-javaagent.jar" -}}
{{- $otelUserJto := default "" (get (default dict .Values.identityhub.env) "JAVA_TOOL_OPTIONS") -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityhub
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    app.kubernetes.io/name: identityhub
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.identityhub.autoscaling.enabled }}
  replicas: {{ .Values.identityhub.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identityhub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.identityhub.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: identityhub
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.identityhub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: default
      securityContext:
        {{- toYaml .Values.identityhub.podSecurityContext | nindent 8 }}
      {{- if or .Values.identityhub.initContainers $otelInjectAgent (include "dsc.identityhub.customCaCerts.enabled" .) (include "dsc.identityhub.credentialSync.enabled" .) }}
      initContainers:
        {{- if include "dsc.identityhub.customCaCerts.enabled" . }}
        # Import the extra CAs into a writable copy of the JVM truststore. Without this step the
        # `custom-cacerts` volume the main container mounts over
        # /opt/java/openjdk/lib/security/cacerts is an empty emptyDir, so declaring customCaCerts
        # replaced the entire truststore with nothing instead of extending it - every outbound TLS
        # connection then failed, including the ones to a vault with a private CA.
        - name: import-cacerts
          {{- if .Values.identityhub.image.repository }}
          image: "{{ .Values.identityhub.image.repository }}:{{ .Values.identityhub.image.tag | required "identityhub.image.tag is required: the identityhub is an upstream image and its version is unrelated to this chart's appVersion" }}"
          {{- else }}
          image: "tractusx/identityhub:{{ .Values.identityhub.image.tag | required "identityhub.image.tag is required: the identityhub is an upstream image and its version is unrelated to this chart's appVersion" }}"
          {{- end }}
          imagePullPolicy: {{ .Values.identityhub.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp "${JAVA_HOME}/lib/security/cacerts" /custom-cacerts/cacerts
              for cert in /custom-cacertificates/*; do
                [ -f "${cert}" ] || continue
                echo "importing $(basename "${cert}")"
                keytool -importcert -noprompt -trustcacerts \
                  -alias "$(basename "${cert}")" \
                  -file "${cert}" \
                  -keystore /custom-cacerts/cacerts \
                  -storepass changeit
              done
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          volumeMounts:
            - name: custom-cacertificates
              mountPath: /custom-cacertificates
              readOnly: true
            - name: custom-cacerts
              mountPath: /custom-cacerts
        {{- end }}
        {{- if $otelInjectAgent }}
        # tracing: copy the OpenTelemetry Java agent JAR from the
        # pinned upstream image into the shared `otel-agent` volume so
        # the main container can attach it via `JAVA_TOOL_OPTIONS`.
        - name: otel-agent-init
          image: {{ $otelAgentImage | quote }}
          imagePullPolicy: {{ $otelAgentPullPolicy }}
          command:
            - cp
            - /javaagent.jar
            - /otel-agent/opentelemetry-javaagent.jar
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          volumeMounts:
            - name: otel-agent
              mountPath: /otel-agent
        {{- end }}
        {{- with .Values.identityhub.initContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "dsc.identityhub.credentialSync.enabled" . }}
        # Mirror the credential the vc-operator maintains in a Secret into the identityhub's own
        # credential store, on issuance and on every renewal.
        #
        # A native Kubernetes sidecar - an init container with restartPolicy: Always - so it starts
        # before the identityhub and keeps running alongside it. Same construct as the OPA sidecar
        # of odrl-pap.
        #
        # It writes over localhost on purpose. The Identity API is component-internal ("must not be
        # internet facing"), so the only thing that writes to it is the pod that owns the store;
        # nothing outside needs credentials for it, and it never crosses the cluster network.
        - name: credential-sync
          restartPolicy: Always
          image: "{{ .Values.identityhub.bootstrap.curlImage.repository }}:{{ .Values.identityhub.bootstrap.curlImage.tag }}"
          imagePullPolicy: {{ .Values.identityhub.bootstrap.curlImage.pullPolicy }}
          command: ["/bin/sh", "/scripts/sync-credential.sh"]
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          env:
            {{- include "dsc.identityhub.credentialSyncEnv" . | nindent 12 }}
          volumeMounts:
            - name: credential-sync-scripts
              mountPath: /scripts
            - name: credential
              mountPath: /credential
              readOnly: true
            # readOnlyRootFilesystem is on, and curl writes its response bodies to /tmp. Its own
            # volume rather than the identityhub's, so the two never collide over a file name.
            - name: credential-sync-tmp
              mountPath: /tmp
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.identityhub.securityContext | nindent 12 }}
          # either use the specified image, or use the default one
          {{- if .Values.identityhub.image.repository }}
          image: "{{ .Values.identityhub.image.repository }}:{{ .Values.identityhub.image.tag | required "identityhub.image.tag is required: the identityhub is an upstream image and its version is unrelated to this chart's appVersion" }}"
          {{- else }}
          image: "tractusx/identityhub:{{ .Values.identityhub.image.tag | required "identityhub.image.tag is required: the identityhub is an upstream image and its version is unrelated to this chart's appVersion" }}"
          {{- end }}

          imagePullPolicy: {{ .Values.identityhub.image.pullPolicy }}
          ports:
          {{- range $key,$value := .Values.identityhub.endpoints }}
            - name: {{ $key }}
              containerPort: {{ $value.port }}
              protocol: TCP
          {{- end }}
          {{- if .Values.identityhub.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.identityhub.endpoints.default.path }}/check/liveness
              port: {{ .Values.identityhub.endpoints.default.port }}
            initialDelaySeconds: {{ .Values.identityhub.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.identityhub.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.identityhub.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.identityhub.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.identityhub.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.identityhub.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.identityhub.endpoints.default.path }}/check/readiness
              port: {{ .Values.identityhub.endpoints.default.port }}
            initialDelaySeconds: {{ .Values.identityhub.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.identityhub.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.identityhub.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.identityhub.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.identityhub.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.identityhub.resources | nindent 12 }}
          env:
            - name: EDC_DATASOURCE_PARTICIPANTCONTEXT_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_KEYPAIR_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_STSCLIENT_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_CREDENTIALREQUEST_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_CREDENTIALS_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_JTI_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_DATASOURCE_DIDRESOURCE_PASSWORD
              {{- if .Values.identityhub.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.postgresql.auth.existingSecret }}
                  key: {{ .Values.identityhub.postgresql.auth.existingSecretPasswordKey }}                
              {{- else }}
              value: {{ .Values.identityhub.postgresql.auth.password | quote }}
              {{- end }}
            - name: EDC_IH_API_SUPERUSER_KEY
              {{- if .Values.identityhub.superuser.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identityhub.superuser.existingSecret }}
                  key: {{ .Values.identityhub.superuser.existingSecretKeyKey }}
              {{- else }}
              value: {{ .Values.identityhub.superuser.key | quote }}
              {{- end }}
            {{- if .Values.vault.hashicorp.existingSecret }}
            # The vault token as an env var instead of a ConfigMap entry. identityhub-cm.yaml omits
            # the property entirely in this case: leaving an empty one behind would be resolved as
            # an empty token rather than falling through to this value.
            - name: EDC_VAULT_HASHICORP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.hashicorp.existingSecret }}
                  key: {{ .Values.vault.hashicorp.existingSecretTokenKey }}
            {{- end }}
            {{- if $otelInjectAgent }}
            # tracing: attach the OpenTelemetry Java agent to the JVM.
            # Any user-provided JAVA_TOOL_OPTIONS value is preserved by
            # concatenation; the final list skips the user entry below
            # to keep env-var names unique.
            - name: JAVA_TOOL_OPTIONS
              value: {{ (printf "%s %s" $otelJavaToolOption $otelUserJto) | trim | quote }}
            {{- end }}
            {{- if $otelEnabled }}
            # tracing: standard OpenTelemetry SDK environment variables
            # (service name, exporter endpoint, sampler, ...). Rendered
            # by the shared `dsc.otel.env` helper so every traced
            # component sees the same surface.
            {{- include "dsc.otel.env" (dict "ctx" . "service" $otelServiceName "enabled" $otelEnabled) | nindent 12 }}
            {{- end }}

            ######################################
            ## Additional environment variables ##
            ######################################
          {{- range $key, $value := .Values.identityhub.envValueFrom }}
            - name: {{ $key | quote }}
              valueFrom:
                {{- tpl (toYaml $value) $ | nindent 16 }}
          {{- end }}
          {{- range $key, $value := .Values.identityhub.env }}
            {{- /* When tracing is on we already emitted JAVA_TOOL_OPTIONS
                 (with the user value concatenated); skip the duplicate. */}}
            {{- if not (and $otelInjectAgent (eq $key "JAVA_TOOL_OPTIONS")) }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.identityhub.envSecretNames .Values.identityhub.envConfigMapNames }}
          envFrom:
          {{- range $value := .Values.identityhub.envSecretNames }}
            - secretRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- range $value := .Values.identityhub.envConfigMapNames }}
            - configMapRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- if include "dsc.identityhub.customCaCerts.enabled" . }}
            - name: custom-cacerts
              mountPath: /opt/java/openjdk/lib/security/cacerts
              subPath: cacerts
            {{- end }}
            - name: "tmp"
              mountPath: "/tmp"
            - name : configuration
              mountPath: /app/logging.properties
              subPath: logging.properties
            - name: logs
              mountPath: {{ .Values.identityhub.logging.path }}
            {{- if $otelInjectAgent }}
            # tracing: read-only view of the `otel-agent` volume seeded
            # by the `otel-agent-init` init container.
            - name: otel-agent
              mountPath: /otel-agent
              readOnly: true
            {{- end }}
            {{- if .Values.identityhub.additionalVolumeMounts }}
            {{- with .Values.identityhub.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.identityhub.additionalVolumes }}
        {{- with .Values.identityhub.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $otelInjectAgent }}
        # tracing: shared scratch volume that holds the copy of
        # `opentelemetry-javaagent.jar` produced by the init container.
        - name: otel-agent
          emptyDir:
            sizeLimit: 32Mi
        {{- end }}
        - name: "configuration"
          configMap:
            name: identityhub-logging
            items:
              - key: "logging.properties"
                path: "logging.properties"
        {{- if include "dsc.identityhub.customCaCerts.enabled" . }}
        # Every CA the init container has to import, gathered into one flat directory. `projected`
        # is what makes that possible from several places at once: the ConfigMap rendered from
        # customCaCerts, plus any Secret or ConfigMap that already exists in the cluster. The
        # init container never learns where a file came from - it just walks the directory.
        #
        # Secrets default to ca.crt rather than being mounted whole: a kubernetes.io/tls Secret also
        # holds tls.key, which has no business inside this pod and which keytool would choke on,
        # failing the init container. Named keys are projected as `<source>-<key>`, so two sources
        # cannot collide on a filename - a collision here is a mount failure, not a warning - and
        # the alias keytool derives from the basename says where the certificate came from.
        - name: custom-cacertificates
          projected:
            defaultMode: 0400
            sources:
              {{- if .Values.identityhub.customCaCerts }}
              - configMap:
                  name: identityhub-custom-cacerts
              {{- end }}
              {{- range $i, $src := .Values.identityhub.customCaCertsFrom }}
              {{- if $src.secret }}
              - secret:
                  name: {{ $src.secret | quote }}
                  items:
                    {{- range $src.keys | default (list "ca.crt") }}
                    - key: {{ . | quote }}
                      path: {{ printf "%s-%s" $src.secret . | quote }}
                    {{- end }}
              {{- else if $src.configMap }}
              - configMap:
                  name: {{ $src.configMap | quote }}
                  {{- with $src.keys }}
                  items:
                    {{- range . }}
                    - key: {{ . | quote }}
                      path: {{ printf "%s-%s" $src.configMap . | quote }}
                    {{- end }}
                  {{- end }}
              {{- else }}
              {{- fail (printf "identityhub.customCaCertsFrom[%d] needs either `secret` or `configMap`" $i) }}
              {{- end }}
              {{- end }}
        - name: custom-cacerts
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
        - name: "tmp"
          emptyDir: { }
        {{- if include "dsc.identityhub.credentialSync.enabled" . }}
        - name: credential-sync-scripts
          configMap:
            name: "identityhub-bootstrap"
            defaultMode: 0755
        # optional: on a first install the vc-operator has not written the credential yet. The
        # sidecar reports the empty mount and waits instead of crash-looping the pod.
        - name: credential
          secret:
            secretName: {{ include "dsc.identityhub.credentialSync.secretName" . | quote }}
            optional: true
        - name: credential-sync-tmp
          emptyDir: { }
        {{- end }}
        # The file handler writes here so the JUL config stays valid, but the logs are not meant to
        # be read off the volume: the console handler is the one that feeds the cluster's log stack.
        - name: logs
          emptyDir: { }
      {{- with .Values.identityhub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identityhub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identityhub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}