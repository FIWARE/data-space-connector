{{- if and .Values.consentManagement.enabled .Values.consentManagement.consentManager.enabled .Values.consentManagement.consentManager.secret.generate .Release.IsInstall }}
{{- $cm := .Values.consentManagement.consentManager }}
# Session/JWT/OAuth secrets, the consent key (injected by the APISIX facade) and
# the mongo password for the consent-manager. Generated once and kept across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cm.secret.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "dsc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  sessionSecret: {{ randAlphaNum 32 | b64enc | quote }}
  jwtSecret: {{ randAlphaNum 32 | b64enc | quote }}
  oauthSecret: {{ randAlphaNum 32 | b64enc | quote }}
  # deterministic (not random) so the facade injects the same value the CM validates
  {{ $cm.secret.consentKeyKey }}: {{ .Values.consentManagement.consentKey | b64enc | quote }}
{{- end }}
