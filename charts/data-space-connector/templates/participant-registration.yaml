{{- if .Values.registration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.registration.configMap }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "dsc.labels" . | nindent 4 }}
data:
  init.sh: |-
    {{- if .Values.registration.prepScript }}
    # Prep script
    {{ .Values.registration.prepScript }}
    {{- end }}
    {{- $registration := .Values.registration}}

    {{- $values := .Values -}}
    {{- /* Grants default to the scope contract-management revokes on participant.removed: the id of
    the one publisher allowed to send it, deduplicated and blank ids skipped as CM does. */}}
    {{- $removedType := "org.fiware.dataspace.participant.removed" }}
    {{- $membershipScopeType := "dataspace-membership" }}
    {{- $cm := index .Values "contract-management" | default dict }}
    {{- $removalPublishers := list }}
    {{- /* Not dig: it panics on a null level, e.g. an `events:` whose children are commented out. */}}
    {{- $events := ($cm.dataspace | default dict).events | default dict }}
    {{- range ($events.publishers | default list) }}
    {{- $types := .types | default list }}
    {{- /* Micronaut binds a comma-separated string to a List, so CM accepts that form too. */}}
    {{- if kindIs "string" $types }}
    {{- $types = splitList "," (nospace $types) }}
    {{- end }}
    {{- if not (kindIs "slice" $types) }}
    {{- fail (printf "contract-management.dataspace.events.publishers[].types of publisher %v must be a list or a comma-separated string, got %s" .id (kindOf $types)) }}
    {{- end }}
    {{- $id := .id | default "" | toString }}
    {{- if and (trim $id) (has $removedType $types) }}
    {{- $removalPublishers = append $removalPublishers $id | uniq }}
    {{- end }}
    {{- end }}
    {{- range $index, $issuer := .Values.registration.issuer }}
    {{- $scope := "" }}
    {{- if and (hasKey $issuer "scope") (not (kindIs "invalid" $issuer.scope)) }}
    {{- $scope = $issuer.scope | toString }}
    {{- else if gt (len $removalPublishers) 1 }}
    {{- fail (printf "registration.issuer %s sets no scope, but several contract-management.dataspace.events.publishers may publish %s (%s): set registration.issuer[].scope per issuer, or scope: \"\" to register it unscoped" $issuer.did $removedType (join ", " $removalPublishers)) }}
    {{- else if $removalPublishers }}
    {{- $scope = first $removalPublishers }}
    {{- end }}
    {{- $query := "" }}
    {{- if $scope }}
    {{- $query = printf "?scope=%s&scopeType=%s" (urlquery $scope) (urlquery ($issuer.scopeType | default $membershipScopeType)) }}
    {{- end }}
    # A 409 means this issuer is already on the list, which is the normal outcome of every run
    # after the first. `curl -f` turned that into a non-zero exit, and since the Job's exit status
    # is the last curl's, the Job failed on every re-run - which made the registration effectively
    # install-only and left later changes unable to reach the trusted-issuers list. The existing
    # entry is left as it is: it may have been changed through the API since, and a re-run must
    # not undo that.
    http_code=$(curl -s -o /tmp/til_resp.json -w '%{http_code}' -X 'POST' \
      '{{ $registration.til }}/issuer{{ $query }}' \
      -H 'accept: */*' \
      -H 'Content-Type: application/json' \
      -d "{
      \"did\": \"{{ $issuer.did }}\",
      \"credentials\": [
        {{- $last := sub (len $issuer.credentialTypes) 1 -}}
        {{- range $index, $credentialType := $issuer.credentialTypes }}
          {
            \"credentialsType\": \"{{ $credentialType }}\"
          }{{- if lt $index $last }},{{ end }}
        {{- end }}
      ]
    }")
    echo "POST {{ $registration.til }}/issuer{{ $query }} ({{ $issuer.did }}) -> HTTP ${http_code}"
    cat /tmp/til_resp.json 2>/dev/null || true
    echo
    case "${http_code}" in
      2*) ;;
      409) echo "issuer {{ $issuer.did }} is already registered and was left unchanged: changes in the values do not reach an existing issuer, update it through the trusted-issuers-list API instead" ;;
      *) exit 1 ;;
    esac
    {{- end }}


{{- end }}
