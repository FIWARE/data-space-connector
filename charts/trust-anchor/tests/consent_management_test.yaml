# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# ---------------------------------------------------------------------------
# Helm-unittest suite for the Consent Management components this chart templates:
# the consent-manager (deployment/service/secret) and the NetworkPolicies isolating it
# and the consent-facade. All gated by consentManagement.enabled.
#
# The consent-facade itself is deployed from its own published chart
# (oci://quay.io/fiware/helm-charts/consent-facade), so its behaviour is covered there.
# What this chart owns is the policy that closes it off and the consent-manager's pointer
# at it.
# ---------------------------------------------------------------------------
suite: Consent Management - deployable components
templates:
  - templates/consent-manager-deployment.yaml
  - templates/consent-manager-service.yaml
  - templates/consent-manager-secret.yaml
  - templates/consent-network-policies.yaml
tests:
  # ==========================================================================
  # Disabled by default -> nothing renders
  # ==========================================================================
  - it: renders nothing when consentManagement is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  # ==========================================================================
  # consent-manager deployment
  # ==========================================================================
  - it: renders the consent-manager deployment when enabled
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: consent-manager
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/wi_stefan/consent-manager:0.0.6"

  - it: applies the strict security context
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: points contract lookups at the consent-facade and builds the mongo uri
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTRACT_SERVICE_BASE_URL
            value: "http://consent-facade:8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            value: "mongodb://consent:$(CM_MONGO_PASSWORD)@mongodb-svc:27017/consent?replicaSet=mongodb"

  - it: uses an explicit mongo.uri when provided
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
      consentManagement.consentManager.mongo.uri: "mongodb://x:y@host:27017/consent?replicaSet=rs0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            value: "mongodb://x:y@host:27017/consent?replicaSet=rs0"

  - it: renders EXTERNAL_OIDC_DISCOVERY_PATH only when discoveryPath is set
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
      consentManagement.consentManager.externalIdp.enabled: true
      consentManagement.consentManager.externalIdp.issuers:
        - "https://verifier.dataspace-authority.org"
      consentManagement.consentManager.externalIdp.audience: "consent-manager"
      consentManagement.consentManager.externalIdp.discoveryPath: "/services/consent-manager/.well-known/openid-configuration"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTERNAL_OIDC_DISCOVERY_PATH
            value: "/services/consent-manager/.well-known/openid-configuration"

  - it: omits EXTERNAL_OIDC_DISCOVERY_PATH when discoveryPath is empty (well-known default)
    template: templates/consent-manager-deployment.yaml
    set:
      consentManagement.enabled: true
      consentManagement.consentManager.externalIdp.enabled: true
      consentManagement.consentManager.externalIdp.issuers:
        - "https://verifier.dataspace-authority.org"
      consentManagement.consentManager.externalIdp.audience: "consent-manager"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTERNAL_OIDC_DISCOVERY_PATH
            value: ""

  - it: generates the consent-manager secret with all keys
    template: templates/consent-manager-secret.yaml
    set:
      consentManagement.enabled: true
    asserts:
      - isKind:
          of: Secret
      - isNotNullOrEmpty:
          path: data.sessionSecret
      - isNotNullOrEmpty:
          path: data.jwtSecret
      - isNotNullOrEmpty:
          path: data.oauthSecret
      - isNotNullOrEmpty:
          path: data.consentKey

  # ==========================================================================
  # consent-facade
  # ==========================================================================

  # ==========================================================================
  # NetworkPolicies - the isolation this chart still owns
  # ==========================================================================
  - it: isolates the consent-manager and the facade, keyed off the facade subchart
    template: templates/consent-network-policies.yaml
    set:
      consentManagement.enabled: true
      consent-facade.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: consent-manager-ingress
        documentIndex: 0
      - equal:
          path: metadata.name
          value: consent-facade-ingress
        documentIndex: 1

  - it: renders no facade policy when the facade is not deployed here
    template: templates/consent-network-policies.yaml
    set:
      consentManagement.enabled: true
      consent-facade.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: consent-manager-ingress
        documentIndex: 0

  - it: admits the ingress controller only while the facade publishes an ingress
    template: templates/consent-network-policies.yaml
    documentIndex: 1
    set:
      consentManagement.enabled: true
      consent-facade.enabled: true
      consent-facade.ingress.enabled: true
      consentManagement.networkPolicy.ingressController.namespace: infra
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: infra
