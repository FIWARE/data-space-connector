{{- if and .Values.consentManagement.enabled .Values.consentManagement.consentFacade.enabled }}
{{- $f := .Values.consentManagement.consentFacade }}
{{- $selfUrl := $f.selfUrl | default (printf "http://consent-facade:%v" $f.service.port) }}
# The Micronaut consent-facade: serves the contract-service API the consent-manager
# consumes, projected from the DSC TMForum APIs. All TMForum client URLs point at
# `tmfApiUrl`; the per-api paths are baked into the image (application.yaml).
kind: Deployment
apiVersion: apps/v1
metadata:
  name: consent-facade
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: consent-facade
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-facade
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: default
      securityContext:
        {{- toYaml $f.podSecurityContext | nindent 8 }}
      {{- if $f.oid4vp.enabled }}
      {{- $o := $f.oid4vp }}
      initContainers:
        # cert-manager stores the tls private key in SEC1 (EC PRIVATE KEY); the
        # OID4VP holder signing service needs it as PKCS#8 (PRIVATE KEY).
        - name: convert-signing-key
          image: {{ $o.opensslImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - openssl pkcs8 -topk8 -nocrypt -in /signing-key-raw/tls.key -out /signing-key/tls.key && chmod 640 /signing-key/tls.key
          securityContext:
            {{- toYaml $f.securityContext | nindent 12 }}
          volumeMounts:
            - name: signing-key-raw
              mountPath: /signing-key-raw
            - name: signing-key
              mountPath: /signing-key
        # import the cluster CA (dsc-ca = the tls secret's ca.crt) into a copy of
        # the JVM truststore, mounted over $JAVA_HOME/lib/security/cacerts below, so
        # both the OID4VP client (java.net.http) and the Netty TM Forum clients trust
        # the provider's self-signed ingress. Uses the facade image (has keytool).
        - name: import-dsc-ca
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          imagePullPolicy: {{ $f.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # Resolve the JDK location instead of hardcoding it: the facade image's
            # base has changed before (UBI openjdk keeps the JDK under
            # /usr/lib/jvm/java-21, eclipse-temurin under /opt/java/openjdk), and a
            # hardcoded path turns a base-image swap into an init crashloop
            # ("cannot stat .../cacerts"). Prefer the explicit `javaHome` value, then
            # $JAVA_HOME, then derive it from the keytool/java binary on PATH.
            # The image's cacerts is mode 0444, so the copy is made writable for
            # keytool (and so a retry can overwrite it after a restart).
            - |
              set -e
              JDK_DIR="{{ $f.javaHome }}"
              if [ -z "$JDK_DIR" ]; then
                JDK_DIR="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v keytool || command -v java)")")")}"
              fi
              echo "using JDK at $JDK_DIR"
              cp "$JDK_DIR/lib/security/cacerts" /cacerts/cacerts
              chmod 0644 /cacerts/cacerts
              "$JDK_DIR/bin/keytool" -importcert -noprompt -alias dsc-ca \
                -file /root-ca/ca.crt -keystore /cacerts/cacerts -storepass changeit
          securityContext:
            {{- toYaml $f.securityContext | nindent 12 }}
          volumeMounts:
            - name: root-ca
              mountPath: /root-ca
            - name: cacerts
              mountPath: /cacerts
      {{- end }}
      containers:
        - name: consent-facade
          securityContext:
            {{- toYaml $f.securityContext | nindent 12 }}
          imagePullPolicy: {{ $f.image.pullPolicy }}
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          ports:
            - name: http
              containerPort: {{ $f.containerPort }}
              protocol: TCP
            # Micronaut serves the management endpoints (incl. /health) on a
            # separate port (endpoints.all.port in the image's application.yaml).
            - name: management
              containerPort: {{ $f.managementPort }}
              protocol: TCP
          env:
            - name: MICRONAUT_SERVER_PORT
              value: {{ $f.containerPort | quote }}
            # public base url written into the contracts' catalog / self-description links
            - name: FACADE_SELF_URL
              value: {{ $selfUrl | quote }}
            # point every TMForum client at the DSC tm-forum-api (paths from the image)
            - name: MICRONAUT_HTTP_SERVICES_PRODUCT_ORDER_URL
              value: {{ $f.tmfApiUrl | quote }}
            - name: MICRONAUT_HTTP_SERVICES_PRODUCT_CATALOG_URL
              value: {{ $f.tmfApiUrl | quote }}
            - name: MICRONAUT_HTTP_SERVICES_PRODUCT_INVENTORY_URL
              value: {{ $f.tmfApiUrl | quote }}
            - name: MICRONAUT_HTTP_SERVICES_PARTY_URL
              value: {{ $f.tmfApiUrl | quote }}
            - name: MICRONAUT_HTTP_SERVICES_AGREEMENT_URL
              value: {{ $f.tmfApiUrl | quote }}
            {{- if $f.persistentRegistry.enabled }}
            {{- $pr := $f.persistentRegistry }}
            # PostgreSQL-backed provider registry + /providers admin API (multi-provider, §11.8);
            # the schema is created by the facade's Flyway migration on first start
            - name: FACADE_PROVIDER_REGISTRY_PERSISTENT
              value: "true"
            - name: DATASOURCES_DEFAULT_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" $pr.database.host (toString $pr.database.port) $pr.database.name | quote }}
            - name: DATASOURCES_DEFAULT_USERNAME
              value: {{ $pr.database.username | quote }}
            - name: DATASOURCES_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pr.database.existingSecret.name | quote }}
                  key: {{ $pr.database.existingSecret.key | quote }}
            - name: DATASOURCES_DEFAULT_DIALECT
              value: "POSTGRES"
            - name: FLYWAY_DATASOURCES_DEFAULT_ENABLED
              value: "true"
            {{- end }}
            {{- if $f.oid4vp.enabled }}
            {{- $o := $f.oid4vp }}
            # OID4VP: present a verifiable credential (holder did:web) to obtain an
            # access token for the provider's OID4VP-protected TM Forum api. The
            # holder signing key + credentials come from the volumes below.
            - name: OID4VP_ENABLED
              value: "true"
            # The token targets are passed as system properties, not env vars: they are a
            # LIST OF OBJECTS, which needs bracketed property names, and Kubernetes rejects
            # brackets in env var names (they are fine inside a value, which is why this
            # rides along in JAVA_TOOL_OPTIONS).
            {{- $props := "" }}
            {{- range $i, $t := ($o.tokenTargets | default list) }}
            {{- $props = printf "%s -Doid4vp.token-targets[%d].audience=%s -Doid4vp.token-targets[%d].url=%s" $props $i $t.audience $i $t.url }}
            {{- if $t.clientId }}
            {{- $props = printf "%s -Doid4vp.token-targets[%d].client-id=%s" $props $i $t.clientId }}
            {{- end }}
            {{- if $t.discoveryPath }}
            {{- $props = printf "%s -Doid4vp.token-targets[%d].discovery-path=%s" $props $i $t.discoveryPath }}
            {{- end }}
            {{- range $j, $scope := ($t.scope | default list) }}
            {{- $props = printf "%s -Doid4vp.token-targets[%d].scope[%d]=%s" $props $i $j $scope }}
            {{- end }}
            {{- end }}
            # point the JVM default SSLContext (used by both the OID4VP java.net.http
            # client and the Netty TM Forum clients) at the dsc-ca-augmented truststore
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/opt/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit{{ $props }}"
            - name: OID4VP_HOLDER_HOLDER_ID
              value: {{ $o.holder.id | quote }}
            - name: OID4VP_HOLDER_KEY_TYPE
              value: {{ $o.holder.keyType | quote }}
            - name: OID4VP_HOLDER_KEY_PATH
              value: {{ $o.holder.keyPath | quote }}
            - name: OID4VP_HOLDER_SIGNATURE_ALGORITHM
              value: {{ $o.holder.signatureAlgorithm | quote }}
            - name: OID4VP_CREDENTIALS_FOLDER
              value: {{ $o.credentialsFolder | quote }}
            - name: OID4VP_CLIENT_ID
              value: {{ $o.clientId | quote }}
            # Micronaut binds a comma-separated env value to the List property
            # (avoids bracketed env names, which Kubernetes rejects)
            - name: OID4VP_SCOPES
              value: {{ join "," $o.scopes | quote }}
            - name: OID4VP_TRUST_ANCHORS
              value: {{ join "," $o.trustAnchors | quote }}
            {{- if $o.proxy.enabled }}
            - name: OID4VP_PROXY_HOST
              value: {{ $o.proxy.host | quote }}
            - name: OID4VP_PROXY_PORT
              value: {{ $o.proxy.port | quote }}
            # the generated TM Forum clients (Netty) reach the provider's external
            # ingress host through the same forward proxy - but ONLY when the TM Forum api
            # is actually external. For a participant's own facade it is an in-namespace
            # Service, and squid cannot resolve a cluster-internal name.
            {{- if $o.proxy.tmForumClients }}
            {{- range $svc := (list "PRODUCT_ORDER" "PRODUCT_CATALOG" "PRODUCT_INVENTORY" "PARTY" "AGREEMENT") }}
            - name: {{ printf "MICRONAUT_HTTP_SERVICES_%s_PROXY_TYPE" $svc | quote }}
              value: "HTTP"
            - name: {{ printf "MICRONAUT_HTTP_SERVICES_%s_PROXY_ADDRESS" $svc | quote }}
              value: {{ printf "%s:%v" $o.proxy.host (toString $o.proxy.port) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            ######################################
            ## Additional environment variables ##
            ######################################
          {{- range $key, $value := $f.envValueFrom }}
            - name: {{ $key | quote }}
              valueFrom:
                {{- tpl (toYaml $value) $ | nindent 16 }}
          {{- end }}
          {{- range $key, $value := $f.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          # the JVM needs a writable /tmp while the root filesystem is read-only
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $f.oid4vp.enabled }}
            # the PKCS#8 holder signing key (converted by the init container)
            - name: signing-key
              mountPath: /signing-key
              readOnly: true
            # the issued credential(s) presented over OID4VP
            - name: credential-repo
              mountPath: {{ $f.oid4vp.credentialsFolder | quote }}
              readOnly: true
            # the cluster CA as a PEM trust anchor for client identification
            - name: root-ca
              mountPath: /etc/ssl/cacert.pem
              subPath: ca.crt
              readOnly: true
            # the CA-augmented truststore. Mounted as a plain directory (no subPath,
            # which would make kubelet pre-create a root-owned path the uid-185 init
            # container cannot write); the JVM is pointed at it via JAVA_TOOL_OPTIONS.
            - name: cacerts
              mountPath: /opt/truststore
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: management
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml $f.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $f.oid4vp.enabled }}
        {{- $o := $f.oid4vp }}
        # raw SEC1 signing key from the participant's cert-manager tls secret
        - name: signing-key-raw
          secret:
            secretName: {{ $o.didSecretName | quote }}
            items:
              - key: tls.key
                path: tls.key
            defaultMode: 0640
        # the PKCS#8 key the convert-signing-key init container writes here
        - name: signing-key
          emptyDir: {}
        # the cluster CA (dsc-ca) from the same tls secret's ca.crt
        - name: root-ca
          secret:
            secretName: {{ $o.didSecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        # the CA-augmented JVM truststore built by the import-dsc-ca init container
        - name: cacerts
          emptyDir: {}
        # the issued credential(s) projected from their secrets into one folder
        - name: credential-repo
          projected:
            sources:
              {{- range $o.credentials }}
              - secret:
                  name: {{ .secretName | quote }}
                  items:
                    - key: {{ .secretKey | quote }}
                      path: {{ .fileName | quote }}
              {{- end }}
        {{- end }}
{{- end }}
