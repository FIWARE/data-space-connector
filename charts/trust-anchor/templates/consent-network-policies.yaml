{{- if and .Values.consentManagement.enabled .Values.consentManagement.networkPolicy.enabled }}
{{- /*
  Isolate the consent-manager and consent-facade so they are reachable only by their intended
  in-cluster peers. ClusterIP has no namespace isolation, so without these policies any pod in any
  namespace could reach them. The consent-manager validates a verifier JWT on every call itself;
  its policy narrows who may connect at all and never admits the management port. Plain
  `podSelector` peers match only this namespace; cross-namespace callers are listed explicitly.
  Requires a NetworkPolicy-enforcing CNI.
*/}}
{{- /* nil-safe: the subchart values are not always coalesced into this context */}}
{{- $manager := (index .Values "consent-manager") | default dict }}
{{- if $manager.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consent-manager-ingress
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: consent-manager
  policyTypes:
    - Ingress
  ingress:
    {{- /* NetworkPolicy ports match the container port, not the Service port. */}}
    {{- $port := dig "deployment" "containerPorts" "http" .Values.consentManagement.networkPolicy.consentManagerPort $manager }}
    {{- $ingressController := .Values.consentManagement.networkPolicy.ingressController }}
    - from:
        # the authority gateway publishing the consent-manager host
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        # an ingress controller, for setups that publish the consent-manager with an Ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $ingressController.podLabels | nindent 14 }}
        {{- range .Values.consentManagement.networkPolicy.consentManagerClients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ $port }}
{{- end }}
{{- /* nil-safe: the subchart values are not always coalesced into this context */}}
{{- $facade := (index .Values "consent-facade") | default dict }}
{{- if $facade.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consent-facade-ingress
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
spec:
  # the consent-facade accepts traffic only from the consent-manager (the contract-service API +
  # self-description dereference).
  podSelector:
    matchLabels:
      app.kubernetes.io/name: consent-facade
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: consent-manager
      ports:
        - port: {{ $facade.port | default .Values.consentManagement.networkPolicy.consentFacadePort }}
    {{- if ($facade.ingress | default dict).enabled }}
    # The facade publishes its self-description endpoints (see the facade ingress),
    # so the ingress controller must reach it. Which PATHS are public is decided by
    # the ingress (only /participants and /catalog); a NetworkPolicy is L3/L4 and
    # cannot express that, so this rule intentionally admits the controller only -
    # not arbitrary pods - and the contract endpoints stay unpublished.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.consentManagement.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.consentManagement.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - port: {{ $facade.port | default .Values.consentManagement.networkPolicy.consentFacadePort }}
    {{- end }}
{{- end }}
{{- end }}
