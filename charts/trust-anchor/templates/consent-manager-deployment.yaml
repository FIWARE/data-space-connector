{{- if and .Values.consentManagement.enabled .Values.consentManagement.consentManager.enabled }}
{{- $cm := .Values.consentManagement.consentManager }}
{{- $facadePort := .Values.consentManagement.consentFacade.service.port }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: consent-manager
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: consent-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: default
      securityContext:
        {{- toYaml $cm.podSecurityContext | nindent 8 }}
      containers:
        - name: consent-manager
          securityContext:
            {{- toYaml $cm.securityContext | nindent 12 }}
          imagePullPolicy: {{ $cm.image.pullPolicy }}
          image: "{{ $cm.image.repository }}:{{ $cm.image.tag }}"
          ports:
            - name: http
              containerPort: {{ $cm.containerPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ $cm.containerPort | quote }}
            - name: API_PREFIX
              value: {{ $cm.apiPrefix | quote }}
            - name: APP_ENDPOINT
              value: {{ $cm.appEndpoint | default (printf "http://consent-manager:%v" $cm.service.port) | quote }}
            - name: URL
              value: {{ $cm.appEndpoint | default (printf "http://consent-manager:%v" $cm.service.port) | quote }}
            # contract lookups are served by the facade (derives notices from TMForum)
            - name: CONTRACT_SERVICE_BASE_URL
              value: {{ $cm.contractServiceBaseUrl | default (printf "http://consent-facade:%v" $facadePort) | quote }}
            - name: SESSION_COOKIE_NAME
              value: "consentmanagersessid"
            - name: SALT_ROUNDS
              value: "10"
            - name: OAUTH_TOKEN_EXPIRES_IN
              value: "1h"
            # -- session/jwt/oauth secrets + the consent key (injected by the facade)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $cm.secret.name }}
                  key: sessionSecret
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cm.secret.name }}
                  key: jwtSecret
            - name: OAUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cm.secret.name }}
                  key: oauthSecret
            - name: X_VISIONSTRUST_CONSENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cm.secret.name }}
                  key: {{ $cm.secret.consentKeyKey }}
            # -- MongoDB connection (replica set required)
            {{- if $cm.mongo.uri }}
            - name: MONGO_URI
              value: {{ $cm.mongo.uri | quote }}
            {{- else }}
            - name: CM_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $cm.mongo.auth.existingSecret }}
                  key: {{ $cm.mongo.auth.existingSecretPasswordKey }}
            - name: MONGO_URI
              value: "mongodb://{{ $cm.mongo.username }}:$(CM_MONGO_PASSWORD)@{{ $cm.mongo.host }}:{{ $cm.mongo.port }}/{{ $cm.mongo.database }}?replicaSet={{ $cm.mongo.replicaSet }}"
            {{- end }}
            {{- if $cm.externalIdp.enabled }}
            {{- $ext := $cm.externalIdp }}
            # -- External IDP / OID4VP token verification: trust JWTs whose `iss` is listed here,
            # verify them via OIDC discovery + JWKS, and map the token `sub` (a DID) to a local
            # identity. Lets a data subject authenticate directly with its OID4VP access token.
            - name: EXTERNAL_OIDC_ISSUERS
              value: {{ join "," $ext.issuers | quote }}
            - name: EXTERNAL_OIDC_AUDIENCE
              value: {{ $ext.audience | quote }}
            - name: EXTERNAL_OIDC_ALGS
              value: {{ $ext.algorithms | quote }}
            - name: EXTERNAL_OIDC_SUBJECT_CLAIM
              value: {{ $ext.subjectClaim | quote }}
            - name: EXTERNAL_OIDC_DISCOVERY_TTL
              value: {{ $ext.discoveryTtl | quote }}
            {{- if $ext.discoveryPath }}
            # -- path appended to each issuer to fetch its OIDC discovery document. Override the
            # well-known default for verifiers (e.g. FIWARE VCVerifier) that serve discovery under a
            # per-service path while still stamping the bare host as the token `iss`.
            - name: EXTERNAL_OIDC_DISCOVERY_PATH
              value: {{ $ext.discoveryPath | quote }}
            {{- end }}
            {{- if $ext.proxy }}
            # the verifier discovery + JWKS are fetched over http(s); route them through the proxy
            # to reach an external verifier ingress from inside the cluster
            - name: HTTP_PROXY
              value: {{ $ext.proxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $ext.proxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local"
            {{- end }}
            {{- if $ext.caSecret.name }}
            # trust the verifier's TLS cert (usually cert-manager self-signed) for the discovery
            # + JWKS fetches; NODE_EXTRA_CA_CERTS extends Node's trust store for axios and jose.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/external-idp-ca/ca.crt
            {{- end }}
            {{- end }}
            ######################################
            ## Additional environment variables ##
            ######################################
          {{- range $key, $value := $cm.envValueFrom }}
            - name: {{ $key | quote }}
              valueFrom:
                {{- tpl (toYaml $value) $ | nindent 16 }}
          {{- end }}
          {{- range $key, $value := $cm.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- if or $cm.envSecretNames $cm.envConfigMapNames }}
          envFrom:
          {{- range $value := $cm.envSecretNames }}
            - secretRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- range $value := $cm.envConfigMapNames }}
            - configMapRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- end }}
          # writable dirs required because the root filesystem is read-only.
          # The consent-manager writes winston rotating logs to two compiled
          # paths (dist/src/logs and dist/src/libs/logs); mount emptyDirs there.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /usr/src/app/dist/src/logs
            - name: logs-all
              mountPath: /usr/src/app/dist/src/libs/logs
            {{- if and $cm.externalIdp.enabled $cm.externalIdp.caSecret.name }}
            - name: external-idp-ca
              mountPath: /etc/external-idp-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $cm.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: logs-all
          emptyDir: {}
        {{- if and $cm.externalIdp.enabled $cm.externalIdp.caSecret.name }}
        - name: external-idp-ca
          secret:
            secretName: {{ $cm.externalIdp.caSecret.name | quote }}
            items:
              - key: {{ $cm.externalIdp.caSecret.key | quote }}
                path: ca.crt
        {{- end }}
{{- end }}
