{{- if .Values.managedMongo.enabled }}
{{- /* The consent-manager is a subchart, so its values are not readable here in every
       context (helm-unittest renders this chart alone) - hence the nil-safe reads and the
       `consentManagement.mongo` defaults. */}}
{{- $cm := (index .Values "consent-manager") | default dict }}
{{- $cmMongo := $cm.mongo | default dict }}
{{- $mongoUser := $cmMongo.username | default .Values.consentManagement.mongo.username }}
{{- $mongoDatabase := $cmMongo.database | default .Values.consentManagement.mongo.database }}
{{- /*
  Managed MongoDB replica set for the consent-manager. The MongoDB community
  operator is installed cluster-wide (see k3s/mongo-operator.yaml, watchNamespace
  "*"); this only declares the MongoDBCommunity resource it reconciles plus the
  admin/consent password secrets. Unlike the main-chart mongodb.yaml this variant
  carries no marketplace users - the trust-anchor authority runs mongo solely for
  the consent-manager.
*/}}
{{- $spec := .Values.managedMongo.spec | default dict }}
{{- $consentMongoEnabled := and .Values.consentManagement.enabled $cm.enabled (not $cmMongo.uri) }}
{{- $dbSa := .Values.managedMongo.databaseServiceAccountName }}
{{- /*
  RBAC for the mongod pods. The community operator is installed cluster-wide
  (k3s/mongo-operator.yaml), but its Helm chart only provisions this
  ServiceAccount/Role/RoleBinding in its own `database.namespace`. The StatefulSet
  the operator generates here runs its pods as `mongodb-database`, so that account
  (and its role) must also exist in this namespace - otherwise the replica set
  stays Pending with no pods and `mongodb-svc` never gets endpoints.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $dbSa }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $dbSa }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $dbSa }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $dbSa }}
subjects:
  - kind: ServiceAccount
    name: {{ $dbSa }}
    namespace: {{ $.Release.Namespace | quote }}
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  # the CR name is also the replica-set name; the operator derives the service
  # ({name}-svc) the consent-manager connects to, so keep it in sync with
  # the consent-manager's `mongo.replicaSet`.
  name: {{ $cmMongo.replicaSet | default .Values.consentManagement.mongo.replicaSet | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "trust-anchor.labels" . | nindent 4 }}
spec:
  members: {{ $spec.members | default 1 }}
  type: {{ $spec.type | default "ReplicaSet" | quote }}
  version: {{ $spec.version | default "6.0.5" | quote }}
  security:
    {{- $security := $spec.security | default (dict "authentication" (dict "modes" (list "SCRAM"))) }}
{{ toYaml $security | nindent 4 }}
{{- with $spec.additionalMongodConfig }}
  additionalMongodConfig:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- /* `managedMongo.spec` is documented as the CRD spec, so users supplied there are
       merged rather than dropped - the same way the umbrella chart's mongodb.yaml does
       it. The chart's own admin user is added only when the input does not define one,
       so a deployment can take it over. */}}
{{- $inputUsers := $spec.users | default list }}
{{- $adminUserExists := false }}
{{- range $user := $inputUsers }}
  {{- if eq $user.name "admin" }}
    {{- $adminUserExists = true }}
  {{- end }}
{{- end }}
{{- $finalUsers := list }}
{{- if not $adminUserExists }}
  {{- $adminUser := dict "name" "admin" "db" "admin" "passwordSecretRef" (dict "name" "mongodb-admin-password") "scramCredentialsSecretName" "mongodb-admin-password" "roles" (list (dict "name" "clusterAdmin" "db" "admin") (dict "name" "userAdminAnyDatabase" "db" "admin")) }}
  {{- $finalUsers = append $finalUsers $adminUser }}
{{- end }}
{{- if $consentMongoEnabled }}
  {{- $consentUser := dict "name" $mongoUser "db" $mongoDatabase "passwordSecretRef" (dict "name" "mongodb-consent-password") "scramCredentialsSecretName" "mongodb-consent-password" "roles" (list (dict "name" "readWrite" "db" $mongoDatabase)) }}
  {{- $finalUsers = append $finalUsers $consentUser }}
{{- end }}
{{- range $user := $inputUsers }}
  {{- $finalUsers = append $finalUsers $user }}
{{- end }}
  users:
{{ toYaml $finalUsers | nindent 4 }}
{{- with $spec.statefulSet }}
  statefulSet:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- /* Generate once, then keep: gating on `.Release.IsInstall` would skip generation
       when managedMongo is enabled during an UPGRADE, leaving the MongoDBCommunity
       pointing `passwordSecretRef` at a secret nothing ever created. Looking the secret
       up instead is true to the intent - generate when it is not there yet - and it also
       keeps the value stable across re-renders. */}}
{{- $adminSecretExists := (lookup "v1" "Secret" $.Release.Namespace "mongodb-admin-password") }}
{{- if and .Values.managedMongo.generatePasswords (not $adminSecretExists) }}
---
# admin credentials for the managed replica set. Generated once and kept across
# upgrades (resource-policy keep) so the operator's stored SCRAM hash stays valid.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-admin-password
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ randAlphaNum 30 | b64enc | quote }}
{{- end }}
{{- $consentSecretExists := (lookup "v1" "Secret" $.Release.Namespace "mongodb-consent-password") }}
{{- if and $consentMongoEnabled .Values.managedMongo.generatePasswords (not $consentSecretExists) }}
---
# password shared by the managed-mongo `consent` user and the consent-manager
# (the consent-manager chart reads it from this secret - see its `mongo.auth`).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-consent-password
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ randAlphaNum 30 | b64enc | quote }}
{{- end }}
{{- end }}
