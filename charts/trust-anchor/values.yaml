## Installation of the postgres-operator - see https://github.com/zalando/postgres-operator
postgres-operator:
  # -- should the postgres-operator be installed
  enabled: true
  configKubernetes:
    enable_readiness_probe: true

## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
managedPostgres:
  # -- should it be enabled? Requires the postgres-operator CRDs to be installed before applying the chart
  enabled: true
  # -- config as defined in https://github.com/zalando/postgres-operator/blob/master/charts/postgres-operator/crds/postgresqls.yaml
  config:
    teamId: "trust-anchor"
    numberOfInstances: 1
    postgresql:
      version: "16"
    volume:
      size: 1Gi
    # the operator creates its `postgres` superuser itself
    users:
      til:
        - createdb
      # -- the consent-manager's user. Fixed name: the setup Job reads its Zalando secret
      # `consent-manager.postgres.credentials...` and `consent-manager.config.database.url` names the database.
      consent_manager: []
    databases:
      tildb: til
      # -- the consent-manager's database, owned by its user (fixed name, see the user above)
      consent_manager: consent_manager
    patroni:
      pg_hba: # Allow connections without ssl as db is not exposed
        - local   all all           trust
        - hostssl all all 0.0.0.0/0 md5
        - host    all all 0.0.0.0/0 md5

# -- configuration for the trusted-issuers-list to be deployed as part of the trust-anchor, see https://github.com/FIWARE/helm-charts/tree/main/charts/trusted-issuers-list for all options
trusted-issuers-list:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: true
  # -- allows to set a fixed name for the services
  fullnameOverride: tir
  # -- connection to the database
  database:
    # -- should persistence be used?
    persistence: true
    # -- name of the db dialect
    dialect: POSTGRES
    # -- name of the db user
    username: til
    # -- configuration for the existing secret to get the passwords from
    existingSecret:
      enabled: true
      name: til.postgres.credentials.postgresql.acid.zalan.do
      key: password
    # -- host of the database
    host: postgres
    # -- host of the database
    port: 5432
    # -- name of the schema inside the db
    name: tildb

# ---------------------------------------------------------------------------
# Consent management (ISO/IEC TS 27560) - the consent-manager + consent-facade.
# These live in the trust-anchor chart because the authority (this trust anchor)
# is where consent records are held; the consent-manager stores them in the
# `consent_manager` database of `managedPostgres`. The IAM that backs them
# (keycloak issuer, verifier, did:web helper, APISIX gateway, vc-operator) stays
# in the data-space-connector umbrella chart and is deployed as a separate
# `consent-authority` release in the same namespace (see doc/CONSENT_MANAGEMENT.md
# and k3s/consent-trust-anchor.yaml). Everything here is off by default; the
# consent scenario turns it on via k3s/consent-trust-anchor-components.yaml.
# ---------------------------------------------------------------------------

consentManagement:
  # -- should consent management be deployed
  enabled: false

  # NetworkPolicies isolating the consent-manager and consent-facade so they are reachable only by
  # their intended in-cluster peers. The consent-manager authenticates every call itself, so its
  # policy only narrows who can connect; its management port is admitted to `metricsScrapers` only.
  # Requires a NetworkPolicy-enforcing CNI (k3s enforces).
  networkPolicy:
    # -- create the isolation NetworkPolicies
    enabled: true
    # -- port the consent-manager listens on, used by its policy when
    # `consent-manager.deployment.containerPorts.http` is not readable.
    consentManagerPort: 8080
    # -- management port of the consent-manager (health, metrics), used by its policy when
    # `consent-manager.deployment.containerPorts.management` is not readable. Admitted to
    # `metricsScrapers` only.
    consentManagerManagementPort: 9090
    # -- port the consent-facade listens on, used by its policy. Mirrors the
    # consent-facade chart's own default.
    consentFacadePort: 8080
    ## the ingress controller that may reach the consent-manager and, when it publishes its
    ## self-description endpoints, the consent-facade. A NetworkPolicy is L3/L4 and cannot
    ## express WHICH paths are public - the ingress decides that.
    ingressController:
      # -- namespace of the ingress controller
      namespace: infra
      # -- pod labels of the ingress controller
      podLabels:
        app.kubernetes.io/name: traefik
    # -- further callers of the consent-manager API from other namespaces, e.g. a provider's
    # APISIX running the consent-filter plugin. Each entry is `{namespace, podLabels}`.
    consentManagerClients: []
    # -- pods allowed to reach the consent-manager's management port, and nothing else: the
    # Prometheus that scrapes `consent-manager.serviceMonitor`. Each entry is
    # `{namespace, podLabels}`; empty leaves the management port closed to every pod.
    metricsScrapers: []

  ## the Job that provisions the consent-manager's Secrets (`consent-manager-env`,
  ## `consent-manager-signing-keys`), see templates/consent-manager-setup-job.yaml. The
  ## database itself is created by the Zalando operator from
  ## `managedPostgres.config.databases`.
  setup:
    # -- image running the setup script; needs kubectl, jq, base64 and head
    image: alpine/k8s:1.31.4
    # -- image generating the receipt signing key; needs `step`
    jwkImage: smallstep/step-cli:0.28.7
    # -- container restarts before the Job gives up
    backoffLimit: 30
    # -- seconds the Job may run, counted from its creation, so including the wait for the
    # Zalando secrets and image pulls on a cold cluster; null removes the limit
    activeDeadlineSeconds: 1800
    # -- seconds a finished Job is kept. Set to null with a self-healing GitOps tool (Argo CD),
    # which would otherwise recreate the Job after every cleanup.
    ttlSecondsAfterFinished: 300
    # -- priorityClassName of the Job's pod
    priorityClassName: ""
    # -- resources of the Job's containers (`setup` and the `generate-jwk` init container). Empty
    # renders nothing; set it where a ResourceQuota or a LimitRange demands requests and limits,
    # which would otherwise reject the pod and leave the consent-manager without its Secrets.
    resources: {}
    ## the ServiceAccount the Job runs under. Switch creation off where RBAC is managed outside
    ## the chart; the Job then uses `name`, which has to exist and carry the permissions below.
    serviceAccount:
      # -- create the ServiceAccount
      create: true
      # -- name of the ServiceAccount; empty uses `consent-manager-setup`
      name: ""
      # -- annotations of the created ServiceAccount
      annotations: {}
    rbac:
      # -- create the Role and RoleBinding of the Job: `get` and `patch` on the two Secrets it
      # owns, plus `create` on Secrets, which Kubernetes cannot scope by name. Switch off to
      # grant those permissions yourself, see doc/CONSENT_MANAGEMENT.md.
      create: true

  signingKey:
    # -- generate the receipt signing key (an EC P-256 JWK) once, if
    # `consent-manager-signing-keys` does not exist. Set to false to provide that Secret yourself.
    generate: true

  ## SMTP credentials for the consent-manager's e-mail notifications. Host and sender are set
  ## under `consent-manager.config.smtp`.
  smtp:
    # -- existing Secret holding the SMTP credentials; empty sends no credentials
    existingSecret: ""
    # -- key of the SMTP user in that Secret
    userKey: username
    # -- key of the SMTP password in that Secret
    passwordKey: password

## The consent-facade, deployed from its own published FIWARE chart
## (oci://quay.io/fiware/helm-charts/consent-facade). Only the keys the trust-anchor
## deployment needs to differ on are set here; everything else is the chart's default.
## See https://github.com/FIWARE/helm-charts/tree/main/charts/consent-facade
consent-facade:
  # -- deploy the consent-facade. The authority runs it; a deployment that only needs the
  # consent-manager leaves it off.
  enabled: false
  # -- keep the resource names stable (`consent-facade` rather than
  # `<release>-consent-facade`): the consent-manager, the provider's consent-plugin and
  # the owner-resolver all address it by that name.
  fullnameOverride: consent-facade

## The consent-manager, deployed from the published dsc-consent-manager chart
## (oci://quay.io/fiware/helm-charts/dsc-consent-manager, aliased to `consent-manager`). Only
## the keys the trust-anchor deployment needs to differ on are set here; everything else is the
## chart's default. The authority deployment has to set `identityProviders.primary`.
consent-manager:
  # -- deploy the consent-manager. Requires `managedPostgres.enabled`.
  enabled: false
  # -- pins the `app.kubernetes.io/name` label both consent NetworkPolicies select
  nameOverride: consent-manager
  # -- keep the resource names stable (`consent-manager` rather than
  # `<release>-consent-manager`): the authority gateway, the providers' consent-filter plugin
  # and the setup Job address it by that name.
  fullnameOverride: consent-manager
  deployment:
    ## the application version, pinned here because the chart 0.1.0 this depends on carries
    ## appVersion 0.0.1. 0.0.3 is the first release this deployment works on at all, for three
    ## reasons: a privacy notice can be generated from a contract service that keeps only
    ## bilateral contracts (it answers the ecosystem endpoint with 501, which 0.0.1 reported as
    ## an upstream failure); a client exempted from the global proxy with `proxy-type: DIRECT`
    ## works; and a contract may name its parties by the participants' self-description URLs,
    ## which is the form contract-management writes and the only form the consent-facade's
    ## /verify matches - before 0.0.3 only the participant DID was accepted, so notice
    ## generation and the consent gate could not both work off one agreement (ADR-0017 of
    ## dsc-consent-manager). Drop this override when the dependency moves to a chart whose
    ## appVersion is 0.0.3 or newer.
    image:
      # -- overrides the image tag, whose default is the dsc-consent-manager chart's appVersion
      tag: "0.0.3"
  config:
    # -- base url of the contract service the privacy notices are derived from: the consent-facade
    contractServiceUrl: http://consent-facade:8080
    database:
      # -- the `consent_manager` database of `managedPostgres` (cluster `postgres`)
      url: jdbc:postgresql://postgres:5432/consent_manager
  secrets:
    # -- written by the setup Job (DB credentials, log-pseudonym and erasure keys, SMTP
    # credentials); do not change
    existingSecret: consent-manager-env
  signingKeys:
    # -- receipt signing key, written by the setup Job when `consentManagement.signingKey.generate`
    secretName: consent-manager-signing-keys
