## Installation of the postgres-operator - see https://github.com/zalando/postgres-operator
postgres-operator:
  # -- should the postgres-operator be installed
  enabled: true
  configKubernetes:
    enable_readiness_probe: true

## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
managedPostgres:
  # -- should it be enabled? Requires the postgres-operator CRDs to be installed before applying the chart
  enabled: true
  # -- config as defined in https://github.com/zalando/postgres-operator/blob/master/charts/postgres-operator/crds/postgresqls.yaml
  config:
    teamId: "trust-anchor"
    numberOfInstances: 1
    postgresql:
      version: "16"
    volume:
      size: 1Gi
    users:
      admin: # maintainer
        - superuser
        - createdb
      til:
        - createdb
    databases:
      tildb: til
    patroni:
      pg_hba: # Allow connections without ssl as db is not exposed
        - local   all all           trust
        - hostssl all all 0.0.0.0/0 md5
        - host    all all 0.0.0.0/0 md5

# -- configuration for the trusted-issuers-list to be deployed as part of the trust-anchor, see https://github.com/FIWARE/helm-charts/tree/main/charts/trusted-issuers-list for all options
trusted-issuers-list:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: true
  # -- allows to set a fixed name for the services
  fullnameOverride: tir
  # -- connection to the database
  database:
    # -- should persistence be used?
    persistence: true
    # -- name of the db dialect
    dialect: POSTGRES
    # -- name of the db user
    username: til
    # -- configuration for the existing secret to get the passwords from
    existingSecret:
      enabled: true
      name: til.postgres.credentials.postgresql.acid.zalan.do
      key: password
    # -- host of the database
    host: postgres
    # -- host of the database
    port: 5432
    # -- name of the schema inside the db
    name: tildb

# ---------------------------------------------------------------------------
# Consent management (ISO/IEC TS 27560) - the consent-manager + consent-facade
# and their managed MongoDB. These live in the trust-anchor chart because the
# authority (this trust anchor) is where consent records are held; the IAM that
# backs them (keycloak issuer, did:web helper, APISIX facade route, vc-operator)
# stays in the data-space-connector umbrella chart and is deployed as a separate
# `consent-authority` release in the same namespace (see doc/CONSENT_MANAGEMENT.md
# and k3s/consent-trust-anchor.yaml). Everything here is off by default; the
# consent scenario turns it on via k3s/consent-trust-anchor-components.yaml.
# ---------------------------------------------------------------------------

## Usage of the MongoDB community operator (installed cluster-wide, see
## k3s/mongo-operator.yaml) - the managed replica set backing the consent-manager.
managedMongo:
  # -- should the managed MongoDB replica set be deployed? Requires the MongoDB
  # community operator CRDs to be installed before applying the chart.
  enabled: false
  # -- generate the admin/consent password secrets in-cluster (once, kept across
  # upgrades). Set to false to provide `mongodb-admin-password` /
  # `mongodb-consent-password` externally.
  generatePasswords: true
  # -- name of the service account the mongod pods run as. The community operator
  # defaults the generated StatefulSet to `mongodb-database`; the chart provisions
  # this SA + its role/binding in the release namespace so the replica set can start
  # (the operator's own chart only creates it in its `database.namespace`).
  databaseServiceAccountName: mongodb-database
  # -- spec as defined in https://github.com/mongodb/helm-charts/tree/main/charts/community-operator-crds
  spec:
    additionalMongodConfig:
      storage.wiredTiger.engineConfig.journalCompressor: zlib

consentManagement:
  # -- should consent management be deployed
  enabled: false

  # NetworkPolicies isolating the consent-manager and consent-facade so they are reachable only by
  # their intended in-cluster peers - the authority APISIX and each other - and NOT by arbitrary
  # pods (e.g. a provider's APISIX consent-plugin). The consent-manager's participant auth + consent
  # key injection are enforced at the APISIX facade, so a direct path to consent-manager:3000 would
  # bypass them; these policies close that. Requires a NetworkPolicy-enforcing CNI (k3s enforces).
  networkPolicy:
    # -- create the isolation NetworkPolicies
    enabled: true

  # -- the consent-manager service (VisionsOfficial/consent-manager, ISO 27560)
  consentManager:
    # -- deploy the consent-manager
    enabled: true
    # -- override for CONTRACT_SERVICE_BASE_URL (the consent-facade). Empty =>
    # http://consent-facade:<port> (same namespace). Set to a cross-namespace FQDN
    # (e.g. http://consent-facade.provider.svc.cluster.local:8080) when the
    # consent-manager and consent-facade live in different namespaces.
    contractServiceBaseUrl: ""
    image:
      # -- repository of the consent-manager image (compiled, non-root, read-only-fs
      # safe; built from docker/app/Dockerfile in the consent-manager repo)
      repository: quay.io/wi_stefan/consent-manager
      # -- tag of the consent-manager image (carries the external-JWKS feature, the
      # configurable discovery path, and the `did` uniqueness guard that makes a
      # participant's DID a safe lookup key for externally issued tokens)
      tag: "0.0.6"
      # -- image pull policy (IfNotPresent so a locally-imported image is used; pulls
      # from quay when absent)
      pullPolicy: IfNotPresent
    # -- api prefix served by the consent-manager
    apiPrefix: /v1
    # -- port the consent-manager listens on
    containerPort: 3000
    service:
      # -- kubernetes service type (keep internal)
      type: ClusterIP
      # -- service port
      port: 3000
    # -- application base url (APP_ENDPOINT/URL), defaults to the in-cluster service
    appEndpoint: ""
    mongo:
      # -- full MongoDB connection string (must include the replica set). If set, overrides the parts below.
      uri: ""
      # -- mongodb host (managed-mongo service by default)
      host: mongodb-svc
      # -- mongodb port
      port: 27017
      # -- database name
      database: consent
      # -- username
      username: consent
      # -- replica set name (the managed MongoDBCommunity resource name)
      replicaSet: mongodb
      auth:
        # -- secret holding the mongo password (shared with the managed-mongo consent user)
        existingSecret: mongodb-consent-password
        # -- key within the secret holding the mongo password
        existingSecretPasswordKey: password
    # -- session/JWT/OAuth/consent-key secret. Generated in-cluster when generate=true.
    secret:
      # -- name of the secret
      name: consent-manager-secret
      # -- generate the secret (session/jwt/oauth/consentKey/mongoPassword) in-cluster
      generate: true
      # -- key holding the consent key (X_VISIONSTRUST_CONSENT_KEY), injected by the facade
      consentKeyKey: consentKey
    # External IDP / OID4VP token verification (consent-manager >= 1.2.0). When enabled, the
    # consent-manager trusts JWTs whose `iss` is in `issuers`, verifying them via OIDC discovery +
    # JWKS and mapping the token `sub` (a DID) to a local User/UserIdentifier/Participant. This is
    # what lets a data subject (end-user) authenticate to the consent-manager DIRECTLY with its
    # OID4VP access token - no facade translation and no x-user-key.
    externalIdp:
      # -- enable external-token verification (empty issuers => feature off in the consent-manager)
      enabled: false
      # -- trusted issuer URLs (must equal the token `iss`, i.e. the verifier's bare `server.host`).
      # OIDC discovery runs at `<issuer><discoveryPath>` (see discoveryPath below).
      issuers: []
      # -- expected `aud` claim (required by the consent-manager whenever issuers are set).
      # One value covers both data subjects and participants: they present different
      # credentials, but to the same relying party, so on the verifier that is a single
      # service with one credential policy per scope - and every token it issues carries
      # that service id as `aud`.
      audience: ""
      # -- accepted signing algorithms (asymmetric only)
      algorithms: "RS256,ES256,EdDSA"
      # -- token claim carrying the subject DID
      subjectClaim: sub
      # -- discovery + JWKS cache TTL (seconds)
      discoveryTtl: 3600
      # -- path appended to each issuer to fetch its OIDC discovery document. Empty => the
      # spec default `/.well-known/openid-configuration`. The FIWARE VCVerifier stamps its bare
      # `server.host` as the token `iss` but serves discovery under a per-service path, so set this
      # to e.g. `/services/consent-manager/.well-known/openid-configuration` to discover there while
      # `issuers` stays the bare host that matches the token.
      discoveryPath: ""
      # -- forward proxy for reaching an external verifier ingress in-cluster (HTTP(S)_PROXY on the
      # consent-manager). Empty => no proxy. For the local demo the verifier ingress resolves to
      # 127.0.0.1, so route discovery/JWKS through the squid proxy.
      proxy: ""
      # -- CA the consent-manager must trust to reach the verifier over TLS (the verifier's ingress
      # cert is usually cert-manager self-signed). Mounted and exported as NODE_EXTRA_CA_CERTS.
      # Empty name => rely on the system trust store.
      caSecret:
        # -- secret holding the CA certificate (e.g. the verifier ingress tls secret)
        name: ""
        # -- key within the secret holding the PEM CA certificate
        key: ca.crt
    # -- extra environment variables (map)
    env: {}
    # -- "valueFrom" environment variable references (map, name templated)
    envValueFrom: {}
    # -- additional secrets to load as env (list of secret names)
    envSecretNames: []
    # -- additional config maps to load as env (list of config map names)
    envConfigMapNames: []
    # -- pod security context
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsUser: 10100
      runAsGroup: 10100
      fsGroup: 10100
    # -- container security context
    securityContext:
      capabilities:
        drop:
          - ALL
        add: []
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 10100
    # -- cpu/memory resources
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # -- the Micronaut consent-facade (Java) that projects the DSC TMForum
  # agreements/catalog/party into the contract-service API the consent-manager
  # consumes (github.com/wistefan/consent-facade); it reads the TMForum api
  # configured via `tmfApiUrl`.
  consentFacade:
    # -- should the consent-facade be deployed (defaults on with consent management;
    # the provider disables it, the authority runs it)
    enabled: true
    image:
      # -- repository of the consent-facade image
      repository: quay.io/seamware/consent-facade
      # -- image tag. 0.0.2+ preserves the source ODRL target as `assetTarget`, which
      # the provider-side owner-resolver matches against the requested object. 0.0.3 is
      # built on the repo's intended UBI base (JAVA_HOME=/usr/lib/jvm/java-21, uid 185);
      # the published 0.0.2 was built on eclipse-temurin (/opt/java/openjdk), which is
      # why the init container resolves the JDK instead of hardcoding it (see javaHome).
      # 0.0.4 adds POST /internal/tokens (the OID4VP token service the consent-plugin
      # uses instead of participant client credentials - doc/CONSENT_MANAGEMENT.md).
      # 0.0.5 makes each token target's OIDC discovery path configurable: a VCVerifier
      # serves discovery per service, and 0.0.4 always asked at the host root (404).
      tag: "0.0.14"
      # -- image pull policy
      pullPolicy: Always
    # -- port the facade listens on
    containerPort: 8080
    # -- explicit JDK home inside the facade image, used by the import-dsc-ca init
    # container to locate `lib/security/cacerts` and `bin/keytool`. Empty (default)
    # resolves it at runtime from $JAVA_HOME, falling back to the keytool/java binary
    # on PATH - so the chart keeps working when the image's base changes (UBI openjdk
    # uses /usr/lib/jvm/java-21, eclipse-temurin /opt/java/openjdk). Set only to pin it.
    javaHome: ""
    # -- port the Micronaut management endpoints (incl. /health) listen on
    # (matches endpoints.all.port in the image's application.yaml)
    managementPort: 9090
    service:
      # -- kubernetes service type
      type: ClusterIP
      # -- service port
      port: 8080
    # -- base url of the TMForum api the facade reads (the DSC tm-forum-api). All
    # of the facade's TMForum clients (product-ordering/-catalog/-inventory, party,
    # agreement) are pointed here; the per-api paths come from the image defaults.
    tmfApiUrl: http://tm-forum-api-svc:8080
    # -- public base url the facade writes into the contracts' catalog/self-description
    # links. These ids travel into privacy notices and ISO 27560 consent receipts and
    # are meant to be dereferenceable by subjects, auditors and other participants, so
    # in any real deployment this MUST be the public ingress url (see `ingress` below),
    # not a cluster-internal name. Defaults to the in-cluster service
    # (http://consent-facade:<port>), which is only adequate for a single-cluster test.
    selfUrl: ""
    # Public ingress for the facade's self-description endpoints. Only the read-only
    # SD/catalog paths are published; the contract endpoints (/verify, /bilaterals,
    # /contracts) stay internal because they reveal which participants contract with
    # each other and the facade has no authentication of its own.
    ingress:
      # -- expose the self-description endpoints via ingress
      enabled: false
      # -- ingress class (empty => the cluster default)
      ingressClassName: ""
      # -- annotations (cert-manager / controller specific)
      annotations: {}
      # -- path prefixes published publicly. Keep this to self-description reads.
      publicPaths:
        - /participants
        - /catalog
      # -- hosts served, e.g. [{host: consent-facade.dataspace-authority.org}]
      hosts: []
      # -- namespace of the ingress controller, admitted by the facade NetworkPolicy
      # when the ingress is enabled (it must reach the pod to serve the public paths)
      controllerNamespace: infra
      # -- pod labels of the ingress controller, admitted by the NetworkPolicy
      controllerPodLabels:
        app.kubernetes.io/name: traefik
      # -- tls blocks as in a standard Ingress spec
      tls: []
    # persistent, database-backed provider registry (multi-provider). When enabled the
    # facade manages providers at runtime through the /providers admin API, backed by
    # PostgreSQL (the schema is created by the facade's Flyway migration on first start,
    # seeded from the static providers). Off by default - the single-provider consent
    # demo needs only the static config.
    persistentRegistry:
      # -- enable the PostgreSQL-backed provider registry + /providers admin API
      enabled: false
      database:
        # -- database host (the shared managed-postgres service)
        host: postgres
        # -- database port
        port: 5432
        # -- database name (must exist; provision via managedPostgres.config.databases)
        name: providerregistrydb
        # -- database user
        username: postgres
        # -- existing secret holding the db password (postgres-operator credentials secret)
        existingSecret:
          # -- secret name
          name: postgres.postgres.credentials.postgresql.acid.zalan.do
          # -- key within the secret holding the password
          key: password
    # OID4VP authentication of the facade's outbound TM Forum calls. Because the
    # facade runs at the authority and reads a *provider's* OID4VP-protected TM Forum
    # api cross-organisation, it presents a verifiable credential (holder did:web:...)
    # to obtain an access token. The holder signing key and the cluster CA (dsc-ca)
    # are taken from the participant's cert-manager `<domain>-tls` secret
    # (`didSecretName`, provisioned by the did helper in the consent-authority
    # release); the issued credential(s) are projected from their secrets into
    # `credentialsFolder`. Off by default.
    oid4vp:
      # -- enable OID4VP authentication of the facade's outbound TM Forum calls
      enabled: false
      # -- audiences this facade may mint access tokens for via POST /internal/tokens,
      # so components that do not implement OID4VP (the Go consent-plugin) can
      # authenticate as this participant. A closed list of NAMED targets, never a
      # caller-supplied URL: anything reaching that endpoint could otherwise make the
      # facade present this participant's credential to an arbitrary host
      # (see the consent-facade repo, doc/adr/0003).
      #
      # Each entry: `audience` (the name callers ask for), `url` (the verifier),
      # `clientId` (the verifier SERVICE), `scope` (which of that service's credential
      # policies to satisfy) and `discoveryPath` (the sub-path the target serves OIDC
      # discovery under - a FIWARE VCVerifier serves it per service, e.g.
      # `/services/consent-manager`; omit it only for an issuer that serves the
      # spec location at its root). Passed as system properties rather than env vars:
      # a list of objects needs bracketed property names, and Kubernetes does not
      # allow brackets in env var NAMES (only in their values).
      tokenTargets: []
      # -- name of the participant's cert-manager tls secret. Its `tls.key` is the
      # did:web signing key (converted to PKCS#8 by an init container) and its
      # `ca.crt` is the cluster CA (dsc-ca) imported into the JVM truststore.
      didSecretName:
      holder:
        # -- the holder DID presented in the verifiable presentation (this
        # participant's did:web identity)
        id:
        # -- holder key type
        keyType: EC
        # -- path the PKCS#8 signing key is mounted at (converted from
        # `didSecretName`'s tls.key by the convert-signing-key init container)
        keyPath: /signing-key/tls.key
        # -- algorithm used to sign the presentation
        signatureAlgorithm: ECDH-ES
      # -- folder the credentials to present are read from (the projected credential
      # secrets, see `credentials`)
      credentialsFolder: /credential-repo
      # -- OID4VP client_id presented to the provider's authorization endpoint. This
      # is the target provider's registered verifier SERVICE id (not the holder DID) -
      # the verifier looks the service up by client_id. For the DSC TM Forum api the
      # registered service is `tmf-api`.
      clientId: "tmf-api"
      # -- OID4VP scopes requested for TM Forum access
      scopes:
        - default
      # -- trust anchors (PEM paths) added on top of the system truststore for
      # client identification (the verifier's chain); the imported dsc-ca lives here
      trustAnchors:
        - /etc/ssl/cacert.pem
      # -- credential secrets projected into `credentialsFolder`, issued by the
      # authority's keycloak via the vc-operator. Each entry:
      # secretName/secretKey -> fileName written into the folder.
      credentials:
        - secretName: vc-operator-credential
          secretKey: credential
          fileName: operator-credential.jwt
      proxy:
        # -- route the OID4VP flow through a forward proxy. Needed in-cluster to reach a
        # verifier's *external* ingress host: the squid proxy resolves the ingress that
        # otherwise points at 127.0.0.1.
        enabled: false
        # -- also route the TM Forum clients through that proxy. True for a facade that
        # fronts OTHER participants (their TM Forum api is behind an external ingress).
        # Set FALSE for a participant's own facade, whose TM Forum api is an in-namespace
        # Service: squid cannot resolve a cluster-internal name and answers 500
        # ("=> tm-forum-api-svc/<unresolved>:8080"), so every contract lookup fails.
        tmForumClients: true
        # -- proxy host
        host: squid-proxy.infra.svc.cluster.local
        # -- proxy port
        port: 8888
      # -- openssl image used by the init container to convert the SEC1 signing key
      # to the PKCS#8 the OID4VP holder expects
      opensslImage: alpine/openssl:3.5.5
    # -- extra environment variables (map)
    env: {}
    # -- "valueFrom" environment variable references (map, name templated)
    envValueFrom: {}
    # -- pod security context
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 185
      runAsGroup: 0
    # -- container security context
    securityContext:
      capabilities:
        drop:
          - ALL
        add: []
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 185
    # -- cpu/memory resources
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # -- the shared consent key (X_VISIONSTRUST_CONSENT_KEY). The consent-manager
  # validates it and the authority's APISIX facade injects it on the caller's
  # behalf (the facade route in the consent-authority release reads it from
  # consent-manager-secret). Seeded into consent-manager-secret under
  # `consentManager.secret.consentKeyKey`.
  consentKey: "changeme-consent-key"
