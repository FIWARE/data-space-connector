## Installation of the postgres-operator - see https://github.com/zalando/postgres-operator
postgres-operator:
  # -- should the postgres-operator be installed
  enabled: true
  configKubernetes:
    enable_readiness_probe: true

## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
managedPostgres:
  # -- should it be enabled? Requires the postgres-operator CRDs to be installed before applying the chart
  enabled: true
  # -- config as defined in https://github.com/zalando/postgres-operator/blob/master/charts/postgres-operator/crds/postgresqls.yaml
  config:
    teamId: "trust-anchor"
    numberOfInstances: 1
    postgresql:
      version: "16"
    volume:
      size: 1Gi
    users:
      admin: # maintainer
        - superuser
        - createdb
      til:
        - createdb
    databases:
      tildb: til
    patroni:
      pg_hba: # Allow connections without ssl as db is not exposed
        - local   all all           trust
        - hostssl all all 0.0.0.0/0 md5
        - host    all all 0.0.0.0/0 md5

# -- configuration for the trusted-issuers-list to be deployed as part of the trust-anchor, see https://github.com/FIWARE/helm-charts/tree/main/charts/trusted-issuers-list for all options
trusted-issuers-list:
  # -- should it be enabled? set to false if one outside the chart is used.
  enabled: true
  # -- allows to set a fixed name for the services
  fullnameOverride: tir
  # -- connection to the database
  database:
    # -- should persistence be used?
    persistence: true
    # -- name of the db dialect
    dialect: POSTGRES
    # -- name of the db user
    username: til
    # -- configuration for the existing secret to get the passwords from
    existingSecret:
      enabled: true
      name: til.postgres.credentials.postgresql.acid.zalan.do
      key: password
    # -- host of the database
    host: postgres
    # -- host of the database
    port: 5432
    # -- name of the schema inside the db
    name: tildb

# ---------------------------------------------------------------------------
# Consent management (ISO/IEC TS 27560) - the consent-manager + consent-facade
# and their managed MongoDB. These live in the trust-anchor chart because the
# authority (this trust anchor) is where consent records are held; the IAM that
# backs them (keycloak issuer, did:web helper, APISIX facade route, vc-operator)
# stays in the data-space-connector umbrella chart and is deployed as a separate
# `consent-authority` release in the same namespace (see doc/CONSENT_MANAGEMENT.md
# and k3s/consent-trust-anchor.yaml). Everything here is off by default; the
# consent scenario turns it on via k3s/consent-trust-anchor-components.yaml.
# ---------------------------------------------------------------------------

## Usage of the MongoDB community operator (installed cluster-wide, see
## k3s/mongo-operator.yaml) - the managed replica set backing the consent-manager.
managedMongo:
  # -- should the managed MongoDB replica set be deployed? Requires the MongoDB
  # community operator CRDs to be installed before applying the chart.
  enabled: false
  # -- generate the admin/consent password secrets in-cluster (once, kept across
  # upgrades). Set to false to provide `mongodb-admin-password` /
  # `mongodb-consent-password` externally.
  generatePasswords: true
  # -- name of the service account the mongod pods run as. The community operator
  # defaults the generated StatefulSet to `mongodb-database`; the chart provisions
  # this SA + its role/binding in the release namespace so the replica set can start
  # (the operator's own chart only creates it in its `database.namespace`).
  databaseServiceAccountName: mongodb-database
  # -- spec as defined in https://github.com/mongodb/helm-charts/tree/main/charts/community-operator-crds
  spec:
    additionalMongodConfig:
      storage.wiredTiger.engineConfig.journalCompressor: zlib

consentManagement:
  # -- should consent management be deployed
  enabled: false

  # NetworkPolicies isolating the consent-manager and consent-facade so they are reachable only by
  # their intended in-cluster peers - the authority APISIX and each other - and NOT by arbitrary
  # pods (e.g. a provider's APISIX consent-plugin). The consent-manager's participant auth + consent
  # key injection are enforced at the APISIX facade, so a direct path to consent-manager:3000 would
  # bypass them; these policies close that. Requires a NetworkPolicy-enforcing CNI (k3s enforces).
  networkPolicy:
    # -- create the isolation NetworkPolicies
    enabled: true
    ## the ingress controller that has to reach the consent-facade when it publishes its
    ## self-description endpoints. A NetworkPolicy is L3/L4 and cannot express WHICH paths
    ## are public - the facade's ingress decides that - so this admits the controller
    ## only, and the contract endpoints stay unpublished.
    # -- port the consent-manager listens on, used by its policy. Mirrors the
    # consent-manager chart's own default.
    consentManagerPort: 3000
    # -- port the consent-facade listens on, used by its policy. Mirrors the
    # consent-facade chart's own default.
    consentFacadePort: 8080
    ingressController:
      # -- namespace of the ingress controller
      namespace: infra
      # -- pod labels of the ingress controller
      podLabels:
        app.kubernetes.io/name: traefik

  # The consent-manager (the ISO 27560 consent records and receipts) and the
  # consent-facade (which projects the TM Forum agreements, catalog and parties into the
  # contract-service API the consent-manager consumes) are both deployed from their own
  # published charts; configure them under the top-level `consent-manager` and
  # `consent-facade` keys below.
  ## the user the managed MongoDB provisions for the consent-manager. It has to match the
  ## `consent-manager.mongo` values, which is where the application reads them from.
  mongo:
    # -- user the managed MongoDB provisions
    username: consent
    # -- database that user is given readWrite on
    database: consent
    # -- name of the MongoDBCommunity resource, which is also the replica-set name (the
    # operator derives the `<name>-svc` service from it). Has to match the
    # consent-manager's `mongo.replicaSet`.
    replicaSet: mongodb

## The consent-facade, deployed from its own published FIWARE chart
## (oci://quay.io/fiware/helm-charts/consent-facade). Only the keys the trust-anchor
## deployment needs to differ on are set here; everything else is the chart's default.
## See https://github.com/FIWARE/helm-charts/tree/main/charts/consent-facade
consent-facade:
  # -- deploy the consent-facade. The authority runs it; a deployment that only needs the
  # consent-manager leaves it off.
  enabled: false
  # -- keep the resource names stable (`consent-facade` rather than
  # `<release>-consent-facade`): the consent-manager, the provider's consent-plugin and
  # the owner-resolver all address it by that name.
  fullnameOverride: consent-facade

## The consent-manager, deployed from its own published FIWARE chart
## (oci://quay.io/fiware/helm-charts/consent-manager). Only the keys the trust-anchor
## deployment needs to differ on are set here; everything else is the chart's default.
## See https://github.com/FIWARE/helm-charts/tree/main/charts/consent-manager
consent-manager:
  # -- deploy the consent-manager. The authority runs it; a deployment that only needs the
  # facade leaves it off.
  enabled: false
  # -- keep the resource names stable (`consent-manager` rather than
  # `<release>-consent-manager`): the authority's APISIX facade route, its NetworkPolicy
  # and the participants that address the api all use that name.
  fullnameOverride: consent-manager
  ## the contract service the privacy notices are derived from - the consent-facade. Set a
  ## cross-namespace FQDN when the two do not share a namespace.
  contractService:
    # -- base url of the consent-facade
    url: http://consent-facade:8080
  ## MongoDB: the managed replica set this chart declares (see `managedMongo`). The
  ## username/database have to match `consentManagement.mongo`, which is what the operator
  ## provisions, and the password secret is the one it creates for that user.
  mongo:
    # -- host of the managed replica set
    host: mongodb-svc
    # -- database to use
    database: consent
    # -- user to connect as
    username: consent
    # -- name of the replica set (the managed MongoDBCommunity resource name)
    replicaSet: mongodb
    auth:
      existingSecret:
        # -- the secret the managed MongoDB creates for this user
        name: mongodb-consent-password
        # -- key of the password inside it
        key: password
