apiVersion: v2
name: trust-anchor
description: Umbrella Chart to provide a minimal trust anchor for a FIWARE Dataspace
version: 1.4.0
dependencies:
  - name: trusted-issuers-list
    condition: trusted-issuers-list.enabled
    version: 0.19.1
    repository: https://fiware.github.io/helm-charts
  - name: postgres-operator
    condition: postgres-operator.enabled
    version: 1.15.1
    repository: https://opensource.zalando.com/postgres-operator/charts/postgres-operator
  # The consent-facade is no longer templated in this chart: it is published as its own
  # FIWARE chart. Enabled by the authority (which runs it), disabled elsewhere.
  - name: consent-facade
    condition: consent-facade.enabled
    version: 0.2.2
    repository: oci://quay.io/fiware/helm-charts
  # dsc-consent-manager, aliased so the values key and the `consent-manager` names stay stable.
  - name: dsc-consent-manager
    alias: consent-manager
    condition: consent-manager.enabled
    version: 0.1.0
    repository: oci://quay.io/fiware/helm-charts
